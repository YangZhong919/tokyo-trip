lamachi → 银座 滨松町名铁酒店 登塔可选，晚上整理行李。 10/5 周一 06:15 左右出发 → 羽田 T3 → JL029 — 纯返程日。 东京住宿统一为滨松町名铁酒店。A、B 是同两天的两个版本，不是多出来的行程。"}, "hotels": {"id": "source-1", "title": "二、住宿、行李与交通票券", "markdown": "### 1. 住宿信息和关键时间\n\n| 地点 | 酒店与地址 | 关键时间／交通 | 联系方式 |\n|---|---|---|---|\n| 镰仓 | **plat hostel keikyu kamakura wave**；镰仓市由比ヶ浜 2-2-39 | 入住 **16:00—22:30**，退房 11:00；镰仓站步行约 5 分钟，海滩约 10 分钟；寄存存在收费项目。 | +81-467-81-5005 |\n| 箱根 | **Hakone Yumoto Onsen Tenseien／箱根汤本温泉 天成园**；箱根町湯本 682 | 入住 15:00，退房 10:00；含晚餐方案注意 **18:00 前入住**，晚到提前联系。汤本站步行约 12 分钟。 | 原稿记录 +81-460-83-8511，出发前对照订单。 |\n| 伊豆 | **Itoen Hotel Atagawa／伊東園ホテル熱川**；东伊豆町奈良本 1267-2 | 车站步行约 10 分钟。原稿订单摘要写退房 10:00，官网通常为 11:00；本版安排更早离开，实际按订单执行。 | +81-557-23-2200 |\n| 东京 | **滨松町名铁酒店／Meitetsu Inn Hamamatsucho（名鉄イン浜松町）**；〒105-0013 东京都港区浜松町 1-19-14 | 通常 **15:00 入住、10:00 退房**，具体按订单。JR 滨松町北口步行约 **4 分钟**；大门站 **A2 出口约 2 分钟**；带大件行李可走 **A1 电梯出口约 3 分钟**。 | +81-3-5472-3434 |\n\n公开资料：[镰仓酒店][hotel-kamakura]、[天成园问答][hotel-tenseien]、[热川酒店][hotel-atagawa]、[滨松町名铁酒店交通][hotel-meitetsu]与[酒店问答][hotel-meitetsu-faq]。箱根、伊豆“含早晚餐”来自原稿，不是本轮重新核验的订房权益；具体餐次到店确认。\n\n**滨松町名铁酒店行李安排**：官方说明可在入住日至退房日期间于前台寄存行李。因此 10/2 提前抵达仍按“先寄存、再游玩”安排，不把提前到达写成一定可以提前进房；大件数量、贵重物品与具体取件要求向前台确认。[官方问答][hotel-meitetsu-faq]\n\n**热川酒店当前接驳：**\n\n- **车站 → 酒店**：13:30、14:00、14:30、15:00、15:30、16:00、16:30。\n- **酒店 → 车站**：09:15、09:55、10:35、11:15。\n- 出发前再核对。错过 16:30 不代表回不了酒店，而是需要步行或另行安排出租车；拖箱、下雨时留更多余量。[接驳信息][hotel-atagawa]\n\n### 2. 票券选择：按路线买，不为了回本绕路\n\n| 路段 | 本版选择 | 费用与边界 |\n|---|---|---|\n| 成田 → 镰仓 | **普通 JR 优先**，出关后选合适接续 | 查询参考约 **2,420／人**；不默认 N’EX，也不为等直通车长时间空等。 |\n| 9/26 江之电 | 普通一日券「のりおりくん」 | **800／人**；乘车少时再与单程票比较，餐饮另付。 |\n| 9/27—9/29 箱根 | 小田原出发**三日周游券** | **6,400／人**；按 9/27 起用购买。镰仓到小田原、伊豆铁路、美术馆门票另计。 |\n| 9/29—9/30 伊豆高原巴士 | 单程票与两日券比较后决定 | 两日券目前 **1,800／人**；**2026/10/1 起销售价格调至 2,150**。不因酒店在票区外就否定它。 |\n| 箱根 → 伊豆、伊豆 → 东京 | 普通车可选；踊り子是少换乘方案 | **基本运费＋特急附加费**，不能只拿基本运费预算特急。 |\n| 东京市内 | 默认 IC 卡按次乘车 | 路线含不同运营公司，不强行套地铁券。 |\n\n资料：[机场参考][airport-fare]、[江之电一日券][enoden-pass]、[箱根周游券][hakone-pass]、[东海巴士券与调价][tokai-pass]。\n\n**巴士两日券这样算**：比较两天实际巴士费用，加上确实能用的景点优惠，再与票价比较。热川往返伊豆高原的铁路不包含；改为步行去海岸或两次使用不连续两天时重新算，不预设一定划算。\n\n**美食券不作为默认。** 2,500 日元套餐的一日乘车券加四张兑换券，不等于四顿饭；一份商品可能用多张，周末还有限制。原文“省约 2,300 日元”的算法不再使用。[套餐说明][enoden-food]", "html": "\u003ch3\u003e1. 住宿信息和关键时间\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e地点\u003c/th\u003e\n\u003cth\u003e酒店与地址\u003c/th\u003e\n\u003cth\u003e关键时间／交通\u003c/th\u003e\n\u003cth\u003e联系方式\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eplat hostel keikyu kamakura wave\u003c/strong\u003e；镰仓市由比ヶ浜 2-2-39\u003c/td\u003e\n\u003ctd\u003e入住 \u003cstrong\u003e16:00—22:30\u003c/strong\u003e，退房 11:00；镰仓站步行约 5 分钟，海滩约 10 分钟；寄存存在收费项目。\u003c/td\u003e\n\u003ctd\u003e+81-467-81-5005\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eHakone Yumoto Onsen Tenseien／箱根汤本温泉 天成园\u003c/strong\u003e；箱根町湯本 682\u003c/td\u003e\n\u003ctd\u003e入住 15:00，退房 10:00；含晚餐方案注意 \u003cstrong\u003e18:00 前入住\u003c/strong\u003e，晚到提前联系。汤本站步行约 12 分钟。\u003c/td\u003e\n\u003ctd\u003e原稿记录 +81-460-83-8511，出发前对照订单。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eItoen Hotel Atagawa／伊東園ホテル熱川\u003c/strong\u003e；东伊豆町奈良本 1267-2\u003c/td\u003e\n\u003ctd\u003e车站步行约 10 分钟。原稿订单摘要写退房 10:00，官网通常为 11:00；本版安排更早离开，实际按订单执行。\u003c/td\u003e\n\u003ctd\u003e+81-557-23-2200\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e滨松町名铁酒店／Meitetsu Inn Hamamatsucho（名鉄イン浜松町）\u003c/strong\u003e；〒105-0013 东京都港区浜松町 1-19-14\u003c/td\u003e\n\u003ctd\u003e通常 \u003cstrong\u003e15:00 入住、10:00 退房\u003c/strong\u003e，具体按订单。JR 滨松町北口步行约 \u003cstrong\u003e4 分钟\u003c/strong\u003e；大门站 \u003cstrong\u003eA2 出口约 2 分钟\u003c/strong\u003e；带大件行李可走 \u003cstrong\u003eA1 电梯出口约 3 分钟\u003c/strong\u003e。\u003c/td\u003e\n\u003ctd\u003e+81-3-5472-3434\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e公开资料：\u003ca href=\"https://plat-hostel-keikyu.com/hostel/kamakura-wave/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e镰仓酒店\u003c/a\u003e、\u003ca href=\"https://www.tenseien.co.jp/faq/?category=%E5%AE%BF%E6%B3%8A\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e天成园问答\u003c/a\u003e、\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e热川酒店\u003c/a\u003e、\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e滨松町名铁酒店交通\u003c/a\u003e与\u003ca href=\"https://www.m-inn.com/hamamatsucho/faq/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店问答\u003c/a\u003e。箱根、伊豆“含早晚餐”来自原稿，不是本轮重新核验的订房权益；具体餐次到店确认。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e滨松町名铁酒店行李安排\u003c/strong\u003e：官方说明可在入住日至退房日期间于前台寄存行李。因此 10/2 提前抵达仍按“先寄存、再游玩”安排，不把提前到达写成一定可以提前进房；大件数量、贵重物品与具体取件要求向前台确认。\u003ca href=\"https://www.m-inn.com/hamamatsucho/faq/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方问答\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e热川酒店当前接驳：\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e车站 → 酒店\u003c/strong\u003e：13:30、14:00、14:30、15:00、15:30、16:00、16:30。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e酒店 → 车站\u003c/strong\u003e：09:15、09:55、10:35、11:15。\u003c/li\u003e\n\u003cli\u003e出发前再核对。错过 16:30 不代表回不了酒店，而是需要步行或另行安排出租车；拖箱、下雨时留更多余量。\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e接驳信息\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e2. 票券选择：按路线买，不为了回本绕路\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e路段\u003c/th\u003e\n\u003cth\u003e本版选择\u003c/th\u003e\n\u003cth\u003e费用与边界\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e成田 → 镰仓\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e普通 JR 优先\u003c/strong\u003e，出关后选合适接续\u003c/td\u003e\n\u003ctd\u003e查询参考约 \u003cstrong\u003e2,420／人\u003c/strong\u003e；不默认 N’EX，也不为等直通车长时间空等。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/26 江之电\u003c/td\u003e\n\u003ctd\u003e普通一日券「のりおりくん」\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e800／人\u003c/strong\u003e；乘车少时再与单程票比较，餐饮另付。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/27—9/29 箱根\u003c/td\u003e\n\u003ctd\u003e小田原出发\u003cstrong\u003e三日周游券\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e6,400／人\u003c/strong\u003e；按 9/27 起用购买。镰仓到小田原、伊豆铁路、美术馆门票另计。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/29—9/30 伊豆高原巴士\u003c/td\u003e\n\u003ctd\u003e单程票与两日券比较后决定\u003c/td\u003e\n\u003ctd\u003e两日券目前 \u003cstrong\u003e1,800／人\u003c/strong\u003e；\u003cstrong\u003e2026/10/1 起销售价格调至 2,150\u003c/strong\u003e。不因酒店在票区外就否定它。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根 → 伊豆、伊豆 → 东京\u003c/td\u003e\n\u003ctd\u003e普通车可选；踊り子是少换乘方案\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e基本运费＋特急附加费\u003c/strong\u003e，不能只拿基本运费预算特急。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京市内\u003c/td\u003e\n\u003ctd\u003e默认 IC 卡按次乘车\u003c/td\u003e\n\u003ctd\u003e路线含不同运营公司，不强行套地铁券。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e资料：\u003ca href=\"https://ekitan.com/transit/route/sf-1998/st-1865\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e机场参考\u003c/a\u003e、\u003ca href=\"https://www.enoden.co.jp/tourism/ticket/noriorikun/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e江之电一日券\u003c/a\u003e、\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e箱根周游券\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/ito_kanko_freepass.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东海巴士券与调价\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e巴士两日券这样算\u003c/strong\u003e：比较两天实际巴士费用，加上确实能用的景点优惠，再与票价比较。热川往返伊豆高原的铁路不包含；改为步行去海岸或两次使用不连续两天时重新算，不预设一定划算。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e美食券不作为默认。\u003c/strong\u003e 2,500 日元套餐的一日乘车券加四张兑换券，不等于四顿饭；一份商品可能用多张，周末还有限制。原文“省约 2,300 日元”的算法不再使用。\u003ca href=\"https://www.enoden.co.jp/tabemeguri-ticket/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e套餐说明\u003c/a\u003e\u003c/p\u003e\n", "plain": "1. 住宿信息和关键时间 地点 酒店与地址 关键时间／交通 联系方式 镰仓 plat hostel keikyu kamakura wave ；镰仓市由比ヶ浜 2-2-39 入住 16:00—22:30 ，退房 11:00；镰仓站步行约 5 分钟，海滩约 10 分钟；寄存存在收费项目。 +81-467-81-5005 箱根 Hakone Yumoto Onsen Tenseien／箱根汤本温泉 天成园 ；箱根町湯本 682 入住 15:00，退房 10:00；含晚餐方案注意 18:00 前入住 ，晚到提前联系。汤本站步行约 12 分钟。 原稿记录 +81-460-83-8511，出发前对照订单。 伊豆 Itoen Hotel Atagawa／伊東園ホテル熱川 ；东伊豆町奈良本 1267-2 车站步行约 10 分钟。原稿订单摘要写退房 10:00，官网通常为 11:00；本版安排更早离开，实际按订单执行。 +81-557-23-2200 东京 滨松町名铁酒店／Meitetsu Inn Hamamatsucho（名鉄イン浜松町） ；〒105-0013 东京都港区浜松町 1-19-14 通常 15:00 入住、10:00 退房 ，具体按订单。JR 滨松町北口步行约 4 分钟 ；大门站 A2 出口约 2 分钟 ；带大件行李可走 A1 电梯出口约 3 分钟 。 +81-3-5472-3434 公开资料： 镰仓酒店 、 天成园问答 、 热川酒店 、 滨松町名铁酒店交通 与 酒店问答 。箱根、伊豆“含早晚餐”来自原稿，不是本轮重新核验的订房权益；具体餐次到店确认。 滨松町名铁酒店行李安排 ：官方说明可在入住日至退房日期间于前台寄存行李。因此 10/2 提前抵达仍按“先寄存、再游玩”安排，不把提前到达写成一定可以提前进房；大件数量、贵重物品与具体取件要求向前台确认。 官方问答 热川酒店当前接驳： 车站 → 酒店 ：13:30、14:00、14:30、15:00、15:30、16:00、16:30。 酒店 → 车站 ：09:15、09:55、10:35、11:15。 出发前再核对。错过 16:30 不代表回不了酒店，而是需要步行或另行安排出租车；拖箱、下雨时留更多余量。 接驳信息 2. 票券选择：按路线买，不为了回本绕路 路段 本版选择 费用与边界 成田 → 镰仓 普通 JR 优先 ，出关后选合适接续 查询参考约 2,420／人 ；不默认 N’EX，也不为等直通车长时间空等。 9/26 江之电 普通一日券「のりおりくん」 800／人 ；乘车少时再与单程票比较，餐饮另付。 9/27—9/29 箱根 小田原出发 三日周游券 6,400／人 ；按 9/27 起用购买。镰仓到小田原、伊豆铁路、美术馆门票另计。 9/29—9/30 伊豆高原巴士 单程票与两日券比较后决定 两日券目前 1,800／人 ； 2026/10/1 起销售价格调至 2,150 。不因酒店在票区外就否定它。 箱根 → 伊豆、伊豆 → 东京 普通车可选；踊り子是少换乘方案 基本运费＋特急附加费 ，不能只拿基本运费预算特急。 东京市内 默认 IC 卡按次乘车 路线含不同运营公司，不强行套地铁券。 资料： 机场参考 、 江之电一日券 、 箱根周游券 、 东海巴士券与调价 。 巴士两日券这样算 ：比较两天实际巴士费用，加上确实能用的景点优惠，再与票价比较。热川往返伊豆高原的铁路不包含；改为步行去海岸或两次使用不连续两天时重新算，不预设一定划算。 美食券不作为默认。 2,500 日元套餐的一日乘车券加四张兑换券，不等于四顿饭；一份商品可能用多张，周末还有限制。原文“省约 2,300 日元”的算法不再使用。 套餐说明", "hotelHtml": "\u003ch3\u003e1. 住宿信息和关键时间\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e地点\u003c/th\u003e\n\u003cth\u003e酒店与地址\u003c/th\u003e\n\u003cth\u003e关键时间／交通\u003c/th\u003e\n\u003cth\u003e联系方式\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eplat hostel keikyu kamakura wave\u003c/strong\u003e；镰仓市由比ヶ浜 2-2-39\u003c/td\u003e\n\u003ctd\u003e入住 \u003cstrong\u003e16:00—22:30\u003c/strong\u003e，退房 11:00；镰仓站步行约 5 分钟，海滩约 10 分钟；寄存存在收费项目。\u003c/td\u003e\n\u003ctd\u003e+81-467-81-5005\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eHakone Yumoto Onsen Tenseien／箱根汤本温泉 天成园\u003c/strong\u003e；箱根町湯本 682\u003c/td\u003e\n\u003ctd\u003e入住 15:00，退房 10:00；含晚餐方案注意 \u003cstrong\u003e18:00 前入住\u003c/strong\u003e，晚到提前联系。汤本站步行约 12 分钟。\u003c/td\u003e\n\u003ctd\u003e原稿记录 +81-460-83-8511，出发前对照订单。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eItoen Hotel Atagawa／伊東園ホテル熱川\u003c/strong\u003e；东伊豆町奈良本 1267-2\u003c/td\u003e\n\u003ctd\u003e车站步行约 10 分钟。原稿订单摘要写退房 10:00，官网通常为 11:00；本版安排更早离开，实际按订单执行。\u003c/td\u003e\n\u003ctd\u003e+81-557-23-2200\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e滨松町名铁酒店／Meitetsu Inn Hamamatsucho（名鉄イン浜松町）\u003c/strong\u003e；〒105-0013 东京都港区浜松町 1-19-14\u003c/td\u003e\n\u003ctd\u003e通常 \u003cstrong\u003e15:00 入住、10:00 退房\u003c/strong\u003e，具体按订单。JR 滨松町北口步行约 \u003cstrong\u003e4 分钟\u003c/strong\u003e；大门站 \u003cstrong\u003eA2 出口约 2 分钟\u003c/strong\u003e；带大件行李可走 \u003cstrong\u003eA1 电梯出口约 3 分钟\u003c/strong\u003e。\u003c/td\u003e\n\u003ctd\u003e+81-3-5472-3434\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e公开资料：\u003ca href=\"https://plat-hostel-keikyu.com/hostel/kamakura-wave/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e镰仓酒店\u003c/a\u003e、\u003ca href=\"https://www.tenseien.co.jp/faq/?category=%E5%AE%BF%E6%B3%8A\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e天成园问答\u003c/a\u003e、\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e热川酒店\u003c/a\u003e、\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e滨松町名铁酒店交通\u003c/a\u003e与\u003ca href=\"https://www.m-inn.com/hamamatsucho/faq/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店问答\u003c/a\u003e。箱根、伊豆“含早晚餐”来自原稿，不是本轮重新核验的订房权益；具体餐次到店确认。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e滨松町名铁酒店行李安排\u003c/strong\u003e：官方说明可在入住日至退房日期间于前台寄存行李。因此 10/2 提前抵达仍按“先寄存、再游玩”安排，不把提前到达写成一定可以提前进房；大件数量、贵重物品与具体取件要求向前台确认。\u003ca href=\"https://www.m-inn.com/hamamatsucho/faq/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方问答\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e热川酒店当前接驳：\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e车站 → 酒店\u003c/strong\u003e：13:30、14:00、14:30、15:00、15:30、16:00、16:30。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e酒店 → 车站\u003c/strong\u003e：09:15、09:55、10:35、11:15。\u003c/li\u003e\n\u003cli\u003e出发前再核对。错过 16:30 不代表回不了酒店，而是需要步行或另行安排出租车；拖箱、下雨时留更多余量。\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e接驳信息\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n"}, "izu": {"id": "source-7", "title": "四、9/29—10/2：伊豆与进东京的衔接", "markdown": "### 先记住伊豆的方向\n\n以下是**主要站点示意，不是完整站表**：\n\n```text\n北\n热海\n  │ JR 伊东线\n伊东\n  │ 伊豆急行线\n城崎海岸\n伊豆高原\n伊豆大川\n伊豆北川\n伊豆热川【酒店】\n片濑白田\n伊豆稻取\n河津\n南\n```\n\n**伊豆高原在热川北边，稻取、河津在热川南边。** 热海到热川不是 20 分钟，热川到伊豆高原也不是一站三分钟。\n\n| 普通电车路段 | 排程参考，不含候车／步行 | 当前成人单程普通纸票 |\n|---|---:|---:|\n| 伊豆热川 ↔ 热海 | 约 65—80 分钟 | 1,520 |\n| 伊豆热川 ↔ 伊豆高原 | 约 15—25 分钟 | 470 |\n| 伊豆热川 ↔ 伊豆北川 | 短程，按实际班次衔接 | 190 |\n| 伊豆热川 ↔ 伊豆稻取 | 约 10—15 分钟 | 280 |\n| 伊豆热川 ↔ 河津 | 约 20—30 分钟 | 560 |\n\n票价依据[伊豆急官方运价表][izu-fare]；IC 价格可能略有差异。时间沿用 review 的规划区间，不是所有车次相同，也不能套用成特急时间。", "html": "\u003ch3\u003e先记住伊豆的方向\u003c/h3\u003e\n\u003cp\u003e以下是\u003cstrong\u003e主要站点示意，不是完整站表\u003c/strong\u003e：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e北\n热海\n  │ JR 伊东线\n伊东\n  │ 伊豆急行线\n城崎海岸\n伊豆高原\n伊豆大川\n伊豆北川\n伊豆热川【酒店】\n片濑白田\n伊豆稻取\n河津\n南\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003e伊豆高原在热川北边，稻取、河津在热川南边。\u003c/strong\u003e 热海到热川不是 20 分钟，热川到伊豆高原也不是一站三分钟。\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e普通电车路段\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003e排程参考，不含候车／步行\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003e当前成人单程普通纸票\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 热海\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 65—80 分钟\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e1,520\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 伊豆高原\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 15—25 分钟\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e470\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 伊豆北川\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e短程，按实际班次衔接\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e190\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 伊豆稻取\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 10—15 分钟\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e280\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 河津\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 20—30 分钟\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e560\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e票价依据\u003ca href=\"https://www.izukyu.co.jp/fares/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e伊豆急官方运价表\u003c/a\u003e；IC 价格可能略有差异。时间沿用 review 的规划区间，不是所有车次相同，也不能套用成特急时间。\u003c/p\u003e\n", "plain": "先记住伊豆的方向 以下是 主要站点示意，不是完整站表 ： 北\n热海\n  │ JR 伊东线\n伊东\n  │ 伊豆急行线\n城崎海岸\n伊豆高原\n伊豆大川\n伊豆北川\n伊豆热川【酒店】\n片濑白田\n伊豆稻取\n河津\n南 伊豆高原在热川北边，稻取、河津在热川南边。 热海到热川不是 20 分钟，热川到伊豆高原也不是一站三分钟。 普通电车路段 排程参考，不含候车／步行 当前成人单程普通纸票 伊豆热川 ↔ 热海 约 65—80 分钟 1,520 伊豆热川 ↔ 伊豆高原 约 15—25 分钟 470 伊豆热川 ↔ 伊豆北川 短程，按实际班次衔接 190 伊豆热川 ↔ 伊豆稻取 约 10—15 分钟 280 伊豆热川 ↔ 河津 约 20—30 分钟 560 票价依据 伊豆急官方运价表 ；IC 价格可能略有差异。时间沿用 review 的规划区间，不是所有车次相同，也不能套用成特急时间。"}, "budget": {"id": "source-19", "title": "八、预算：把确定单价与未定项目分开", "markdown": "### 1. 已有依据的交通单价\n\n金额为成人每人，普通纸票与 IC 可能有小额差异。**特急列车总价不能只用下面的基本运费。**\n\n| 项目 | 参考金额 | 是否已包括在其他项目中 |\n|---|---:|---|\n| 成田 → 镰仓普通 JR | 约 2,420 | 独立一笔，不另拆东京换乘费用。 |\n| 9/26 江之电一日券 | 800 | 当日适用乘车，不含餐饮。 |\n| 镰仓 → 小田原 JR | 约 810，沿用 review 参考，购票复核 | 不在箱根周游券内。 |\n| 箱根三日周游券 | 6,400 | 包括适用范围内的箱根交通，不再逐段重复相加。 |\n| 小田原 → 伊豆高原基本运费 | 1,470 | 乘踊り子另加特急费；从箱根转场只算一次。 |\n| 伊豆高原 → 热川 | 470 | 9/29 入住段。 |\n| 热川 ↔ 伊豆高原 | 往返 940 | 9/30；巴士另计。 |\n| 热川 ↔ 河津 | 往返 1,120 | 10/1 默认方案；七滝巴士另计。 |\n| 热川 ↔ 稻取 | 往返 560 | 仅选择 10/2 稻取替换方案时加入。 |\n| 伊豆高原巴士两日券 | 9 月销售价 1,800；10/1 起 2,150 | 选券后不再把已覆盖的单程巴士全加一次。 |\n\n依据：[机场查询][airport-fare]、[江之电][enoden-pass]、[箱根周游券][hakone-pass]、[伊豆急运价][izu-fare]、[东海巴士][tokai-pass]。镰仓到小田原的 810 日元是 review 的参考值，不是已购买票价。\n\n**尚未锁定的交通费用**：踊り子附加费、10/1 具体巴士、伊豆到品川的最终票价、东京市内和羽田交通、寄存柜及偶发出租车。路线与席别确定后统一补入，本文不把未定项目藏进一个看似精确的全程总价。\n\n### 2. 景点与可选项目\n\n| 项目 | 成人参考价 | 本版位置 |\n|---|---:|---|\n| 长谷寺 | 400 | 9/26 主线 |\n| 镰仓大佛 | 300；胎内另 50 | 9/26 主线／附加可选 |\n| 江之岛岩屋 | 500 | 与登塔取舍，不一定加入 |\n| 雕刻之森 | 网上 1,800；现场 2,000 | 9/27 主线 |\n| 大室山缆椅 | 往返 1,000 | 9/30 主线 |\n| 仙人掌动物公园 | 平日 2,800；周末及指定假期 3,000 | 9/30，按实际票种 |\n| 黒根岩 | 700 | 10/1 替换方案 |\n| 稻取雛之馆 | 500 | 10/2 替换方案 |\n| 多摩川花火单人椅席 | 6,500＋适用手续费 | A 版可选付费席 |\n| SHIBUYA SKY 网络成人票 | 15:00 前 2,700；15:00 起 3,400 | B 版默认下午，A 版上午可替换购物 |\n\n上述价格的官方链接见各日正文。**仅长谷寺、大佛外部、美术馆、大室山、动物公园五项合计约 6,300—6,500 日元／人**，按动物公园平日普通票、无额外体验计算。这个小计不是全程门票总额，不包含御苑、岩屋、登塔、烟花等其他选择，也未套用任何可叠加优惠。\n\n新宿御苑、江之岛灯塔、晴空塔等按最终到访项目与票种购票；不使用原稿里未经确认的旧价。餐饮、购物、住宿、温泉税、寄存和保险均不混入上述小计。\n\n### 3. 餐饮与现金的规划方式\n\n原稿注明箱根两晚、热川三晚包含早晚餐；实际先核对订单，不在外面再安排同一晚的固定餐厅。白天午餐给出行留余量，不为打卡店错过车。\n\n**现金可先按每位成人约 10,000—15,000 日元的备用额准备**，这是规划建议，不是实际必需支出。结合卡片能否使用和日常花费补充，不把所有寺庙、温泉、动物公园统称“只收现金”。交通卡余额、实体卡或手机支持情况在出发前自行确认。", "html": "\u003ch3\u003e1. 已有依据的交通单价\u003c/h3\u003e\n\u003cp\u003e金额为成人每人，普通纸票与 IC 可能有小额差异。\u003cstrong\u003e特急列车总价不能只用下面的基本运费。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e项目\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003e参考金额\u003c/th\u003e\n\u003cth\u003e是否已包括在其他项目中\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e成田 → 镰仓普通 JR\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 2,420\u003c/td\u003e\n\u003ctd\u003e独立一笔，不另拆东京换乘费用。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/26 江之电一日券\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e800\u003c/td\u003e\n\u003ctd\u003e当日适用乘车，不含餐饮。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓 → 小田原 JR\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 810，沿用 review 参考，购票复核\u003c/td\u003e\n\u003ctd\u003e不在箱根周游券内。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根三日周游券\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e6,400\u003c/td\u003e\n\u003ctd\u003e包括适用范围内的箱根交通，不再逐段重复相加。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e小田原 → 伊豆高原基本运费\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e1,470\u003c/td\u003e\n\u003ctd\u003e乘踊り子另加特急费；从箱根转场只算一次。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆高原 → 热川\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e470\u003c/td\u003e\n\u003ctd\u003e9/29 入住段。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e热川 ↔ 伊豆高原\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e往返 940\u003c/td\u003e\n\u003ctd\u003e9/30；巴士另计。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e热川 ↔ 河津\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e往返 1,120\u003c/td\u003e\n\u003ctd\u003e10/1 默认方案；七滝巴士另计。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e热川 ↔ 稻取\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e往返 560\u003c/td\u003e\n\u003ctd\u003e仅选择 10/2 稻取替换方案时加入。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆高原巴士两日券\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e9 月销售价 1,800；10/1 起 2,150\u003c/td\u003e\n\u003ctd\u003e选券后不再把已覆盖的单程巴士全加一次。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e依据：\u003ca href=\"https://ekitan.com/transit/route/sf-1998/st-1865\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e机场查询\u003c/a\u003e、\u003ca href=\"https://www.enoden.co.jp/tourism/ticket/noriorikun/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e江之电\u003c/a\u003e、\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e箱根周游券\u003c/a\u003e、\u003ca href=\"https://www.izukyu.co.jp/fares/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e伊豆急运价\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/ito_kanko_freepass.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东海巴士\u003c/a\u003e。镰仓到小田原的 810 日元是 review 的参考值，不是已购买票价。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e尚未锁定的交通费用\u003c/strong\u003e：踊り子附加费、10/1 具体巴士、伊豆到品川的最终票价、东京市内和羽田交通、寄存柜及偶发出租车。路线与席别确定后统一补入，本文不把未定项目藏进一个看似精确的全程总价。\u003c/p\u003e\n\u003ch3\u003e2. 景点与可选项目\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e项目\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003e成人参考价\u003c/th\u003e\n\u003cth\u003e本版位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e长谷寺\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e400\u003c/td\u003e\n\u003ctd\u003e9/26 主线\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓大佛\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e300；胎内另 50\u003c/td\u003e\n\u003ctd\u003e9/26 主线／附加可选\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e江之岛岩屋\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e500\u003c/td\u003e\n\u003ctd\u003e与登塔取舍，不一定加入\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e雕刻之森\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e网上 1,800；现场 2,000\u003c/td\u003e\n\u003ctd\u003e9/27 主线\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e大室山缆椅\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e往返 1,000\u003c/td\u003e\n\u003ctd\u003e9/30 主线\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e仙人掌动物公园\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e平日 2,800；周末及指定假期 3,000\u003c/td\u003e\n\u003ctd\u003e9/30，按实际票种\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e黒根岩\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e700\u003c/td\u003e\n\u003ctd\u003e10/1 替换方案\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e稻取雛之馆\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e500\u003c/td\u003e\n\u003ctd\u003e10/2 替换方案\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多摩川花火单人椅席\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e6,500＋适用手续费\u003c/td\u003e\n\u003ctd\u003eA 版可选付费席\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSHIBUYA SKY 网络成人票\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e15:00 前 2,700；15:00 起 3,400\u003c/td\u003e\n\u003ctd\u003eB 版默认下午，A 版上午可替换购物\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e上述价格的官方链接见各日正文。\u003cstrong\u003e仅长谷寺、大佛外部、美术馆、大室山、动物公园五项合计约 6,300—6,500 日元／人\u003c/strong\u003e，按动物公园平日普通票、无额外体验计算。这个小计不是全程门票总额，不包含御苑、岩屋、登塔、烟花等其他选择，也未套用任何可叠加优惠。\u003c/p\u003e\n\u003cp\u003e新宿御苑、江之岛灯塔、晴空塔等按最终到访项目与票种购票；不使用原稿里未经确认的旧价。餐饮、购物、住宿、温泉税、寄存和保险均不混入上述小计。\u003c/p\u003e\n\u003ch3\u003e3. 餐饮与现金的规划方式\u003c/h3\u003e\n\u003cp\u003e原稿注明箱根两晚、热川三晚包含早晚餐；实际先核对订单，不在外面再安排同一晚的固定餐厅。白天午餐给出行留余量，不为打卡店错过车。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e现金可先按每位成人约 10,000—15,000 日元的备用额准备\u003c/strong\u003e，这是规划建议，不是实际必需支出。结合卡片能否使用和日常花费补充，不把所有寺庙、温泉、动物公园统称“只收现金”。交通卡余额、实体卡或手机支持情况在出发前自行确认。\u003c/p\u003e\n", "plain": "1. 已有依据的交通单价 金额为成人每人，普通纸票与 IC 可能有小额差异。 特急列车总价不能只用下面的基本运费。 项目 参考金额 是否已包括在其他项目中 成田 → 镰仓普通 JR 约 2,420 独立一笔，不另拆东京换乘费用。 9/26 江之电一日券 800 当日适用乘车，不含餐饮。 镰仓 → 小田原 JR 约 810，沿用 review 参考，购票复核 不在箱根周游券内。 箱根三日周游券 6,400 包括适用范围内的箱根交通，不再逐段重复相加。 小田原 → 伊豆高原基本运费 1,470 乘踊り子另加特急费；从箱根转场只算一次。 伊豆高原 → 热川 470 9/29 入住段。 热川 ↔ 伊豆高原 往返 940 9/30；巴士另计。 热川 ↔ 河津 往返 1,120 10/1 默认方案；七滝巴士另计。 热川 ↔ 稻取 往返 560 仅选择 10/2 稻取替换方案时加入。 伊豆高原巴士两日券 9 月销售价 1,800；10/1 起 2,150 选券后不再把已覆盖的单程巴士全加一次。 依据： 机场查询 、 江之电 、 箱根周游券 、 伊豆急运价 、 东海巴士 。镰仓到小田原的 810 日元是 review 的参考值，不是已购买票价。 尚未锁定的交通费用 ：踊り子附加费、10/1 具体巴士、伊豆到品川的最终票价、东京市内和羽田交通、寄存柜及偶发出租车。路线与席别确定后统一补入，本文不把未定项目藏进一个看似精确的全程总价。 2. 景点与可选项目 项目 成人参考价 本版位置 长谷寺 400 9/26 主线 镰仓大佛 300；胎内另 50 9/26 主线／附加可选 江之岛岩屋 500 与登塔取舍，不一定加入 雕刻之森 网上 1,800；现场 2,000 9/27 主线 大室山缆椅 往返 1,000 9/30 主线 仙人掌动物公园 平日 2,800；周末及指定假期 3,000 9/30，按实际票种 黒根岩 700 10/1 替换方案 稻取雛之馆 500 10/2 替换方案 多摩川花火单人椅席 6,500＋适用手续费 A 版可选付费席 SHIBUYA SKY 网络成人票 15:00 前 2,700；15:00 起 3,400 B 版默认下午，A 版上午可替换购物 上述价格的官方链接见各日正文。 仅长谷寺、大佛外部、美术馆、大室山、动物公园五项合计约 6,300—6,500 日元／人 ，按动物公园平日普通票、无额外体验计算。这个小计不是全程门票总额，不包含御苑、岩屋、登塔、烟花等其他选择，也未套用任何可叠加优惠。 新宿御苑、江之岛灯塔、晴空塔等按最终到访项目与票种购票；不使用原稿里未经确认的旧价。餐饮、购物、住宿、温泉税、寄存和保险均不混入上述小计。 3. 餐饮与现金的规划方式 原稿注明箱根两晚、热川三晚包含早晚餐；实际先核对订单，不在外面再安排同一晚的固定餐厅。白天午餐给出行留余量，不为打卡店错过车。 现金可先按每位成人约 10,000—15,000 日元的备用额准备 ，这是规划建议，不是实际必需支出。结合卡片能否使用和日常花费补充，不把所有寺庙、温泉、动物公园统称“只收现金”。交通卡余额、实体卡或手机支持情况在出发前自行确认。"}, "road": {"id": "source-20", "title": "九、行李、交通衔接与天气：现场用这一页", "markdown": "### 1. 四个行李节点\n\n| 日期 | 默认安排 | 失败时怎么改 |\n|---|---|---|\n| **9/27 镰仓退房** | 问酒店是否可短时寄存，逛完取走 | 收费接受与否自行决定；不假设免费。 |\n| **9/27 箱根上山前** | 汤本站适用寄存设施，或先去酒店询问 | 有额外往返就缩短美术馆，不推迟到酒店的底线。 |\n| **9/29 伊豆高原** | 存箱子，轻装海岸短线 | 无合适柜位就去热川，海岸换到 10/1 或取消。 |\n| **10/2 进东京／稻取备选** | 默认到滨松町名铁酒店前台寄存；稻取版先问热川酒店 | 不拖大件去稻取散步；未解决行李就取消稻取。 |\n\n### 2. 需要临近乘车日期填写的交通表\n\n下面“计划／下一班”尚未锁定，不代表已查到或已订票。填写时同时核对日期、上下车站、方向与适用票券。\n\n| 日期 | 路段 | 当前安排 | 计划班次／下一班 |\n|---|---|---|---|\n| 9/25 | 空港第2ビル → 镰仓 | 出关后选车，17:01 直通是候选 | 当天按实际出关查询 |\n| 9/27 | 镰仓 → 大船 → 小田原 | 11:00 左右离开 | 待按日期复核 |\n| 9/29 | 小田原 → 伊豆高原 | 踊り子 1 号 10:01 → 11:02，或普通车 | 购票后填席位／普通车接续 |\n| 9/29 | 伊豆高原 ↔ 伊豆海洋公園 | 海岸巴士候选，也可用电车＋步行 | 去程：____；回程：____；下一班：____ |\n| 9/30 | 伊豆高原 ↔ シャボテン公園 | 大室山、动物公园 | 去程：____；回程：____；下一班：____ |\n| 10/1 | 河津 → 上入口；七滝 → 河津 | 仅默认七滝方案 | 去程：____；回程：____；下一班：____ |\n| 10/2 | 伊豆热川 → 品川 | 默认踊り子 2 号 10:32 → 12:40 | 购票后填席位；稻取版另查午后车 |\n| 10/5 | 滨松町 → 羽田 T3 | 以约 07:00 前到航站楼倒推 | 计划：____；备选：____ |\n\n查询入口：[JR 候选去伊豆列车][odoriko-1]／[JR 候选回东京列车][odoriko-2]／[东海巴士][tokai-search]／[东京单轨电车][monorail]。\n\n### 3. 只替换、不叠加的调整规则\n\n| 情况 | 优先处理 |\n|---|---|\n| 9/25 航班或入境延误 | 删除散步；先保证入住，接近截止时间提前联系酒店。 |\n| 9/26 江之岛超时 | 删登塔／岩屋、极乐寺短停，不再追固定海边日落。 |\n| 9/27 镰仓晚出发 | 缩短／取消美术馆。确实要补到 9/29，就把那天改为美术馆＋转场，海岸让给 10/1。 |\n| 9/28 箱根缆车或船停运 | 根据官方公告走能运行的部分，或提早回酒店。 |\n| 9/29 寄存失败或海岸不适合走 | 直接入住热川，海岸改日或取消。 |\n| 9/30 大室山天气差 | 与 10/1 互换或取消；重算巴士券，不自动换成危险的户外替代。 |\n| 10/2 决定去稻取 | 放弃早班特急和新宿御苑，东京只保留傍晚。 |\n| 10/3 不看烟花、天气正常 | 用东京 B 版。 |\n| 10/3 因恶劣天气取消烟花 | 选室内活动，不保证当天还有 SHIBUYA SKY 票，也不硬上屋顶。 |\n| 10/3 散场很晚 | 10/4 先删皇居，从浅草开始，晚上仍尽早整理行李。 |\n\n### 4. 导航时用这些日文名称\n\n| 中文 | 可复制的检索词 |\n|---|---|\n| 成田 T2 铁路站 | 空港第2ビル |\n| 镰仓／大船 | 鎌倉駅／大船駅 |\n| 镰仓高校前／长谷 | 鎌倉高校前駅／長谷駅 |\n| 箱根汤本／雕刻之森 | 箱根湯本駅／彫刻の森美術館 |\n| 早云山／大涌谷／桃源台 | 早雲山／大涌谷／桃源台 |\n| 元箱根港 | 元箱根港 |\n| 伊豆高原／热川／北川 | 伊豆高原駅／伊豆熱川駅／伊豆北川駅 |\n| 城崎海岸／门胁吊桥 | 城ヶ崎海岸／門脇つり橋 |\n| 大室山／动物公园巴士站 | 大室山／シャボテン公園 |\n| 河津七滝上入口／下游站 | 河津七滝遊歩道上入口／河津七滝 |\n| 稻取人偶馆 | 文化公園 雛の館 |\n| 滨松町名铁酒店 | 名鉄イン浜松町／Meitetsu Inn Hamamatsucho | \n| 酒店附近车站／出口 | 浜松町駅 北口／大門駅 A2出口（电梯走 A1出口） |\n| 烟花会场／分流站 | 二子玉川緑地運動場／用賀駅 |\n| 回程机场站 | 羽田空港第3ターミナル |", "html": "\u003ch3\u003e1. 四个行李节点\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e日期\u003c/th\u003e\n\u003cth\u003e默认安排\u003c/th\u003e\n\u003cth\u003e失败时怎么改\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/27 镰仓退房\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e问酒店是否可短时寄存，逛完取走\u003c/td\u003e\n\u003ctd\u003e收费接受与否自行决定；不假设免费。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/27 箱根上山前\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e汤本站适用寄存设施，或先去酒店询问\u003c/td\u003e\n\u003ctd\u003e有额外往返就缩短美术馆，不推迟到酒店的底线。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/29 伊豆高原\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e存箱子，轻装海岸短线\u003c/td\u003e\n\u003ctd\u003e无合适柜位就去热川，海岸换到 10/1 或取消。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/2 进东京／稻取备选\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e默认到滨松町名铁酒店前台寄存；稻取版先问热川酒店\u003c/td\u003e\n\u003ctd\u003e不拖大件去稻取散步；未解决行李就取消稻取。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch3\u003e2. 需要临近乘车日期填写的交通表\u003c/h3\u003e\n\u003cp\u003e下面“计划／下一班”尚未锁定，不代表已查到或已订票。填写时同时核对日期、上下车站、方向与适用票券。\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e日期\u003c/th\u003e\n\u003cth\u003e路段\u003c/th\u003e\n\u003cth\u003e当前安排\u003c/th\u003e\n\u003cth\u003e计划班次／下一班\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/25\u003c/td\u003e\n\u003ctd\u003e空港第2ビル → 镰仓\u003c/td\u003e\n\u003ctd\u003e出关后选车，17:01 直通是候选\u003c/td\u003e\n\u003ctd\u003e当天按实际出关查询\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/27\u003c/td\u003e\n\u003ctd\u003e镰仓 → 大船 → 小田原\u003c/td\u003e\n\u003ctd\u003e11:00 左右离开\u003c/td\u003e\n\u003ctd\u003e待按日期复核\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/29\u003c/td\u003e\n\u003ctd\u003e小田原 → 伊豆高原\u003c/td\u003e\n\u003ctd\u003e踊り子 1 号 10:01 → 11:02，或普通车\u003c/td\u003e\n\u003ctd\u003e购票后填席位／普通车接续\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/29\u003c/td\u003e\n\u003ctd\u003e伊豆高原 ↔ 伊豆海洋公園\u003c/td\u003e\n\u003ctd\u003e海岸巴士候选，也可用电车＋步行\u003c/td\u003e\n\u003ctd\u003e去程：\u003cstrong\u003e\u003cstrong\u003e；回程：\u003c/strong\u003e\u003c/strong\u003e；下一班：____\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/30\u003c/td\u003e\n\u003ctd\u003e伊豆高原 ↔ シャボテン公園\u003c/td\u003e\n\u003ctd\u003e大室山、动物公园\u003c/td\u003e\n\u003ctd\u003e去程：\u003cstrong\u003e\u003cstrong\u003e；回程：\u003c/strong\u003e\u003c/strong\u003e；下一班：____\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/1\u003c/td\u003e\n\u003ctd\u003e河津 → 上入口；七滝 → 河津\u003c/td\u003e\n\u003ctd\u003e仅默认七滝方案\u003c/td\u003e\n\u003ctd\u003e去程：\u003cstrong\u003e\u003cstrong\u003e；回程：\u003c/strong\u003e\u003c/strong\u003e；下一班：____\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/2\u003c/td\u003e\n\u003ctd\u003e伊豆热川 → 品川\u003c/td\u003e\n\u003ctd\u003e默认踊り子 2 号 10:32 → 12:40\u003c/td\u003e\n\u003ctd\u003e购票后填席位；稻取版另查午后车\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/5\u003c/td\u003e\n\u003ctd\u003e滨松町 → 羽田 T3\u003c/td\u003e\n\u003ctd\u003e以约 07:00 前到航站楼倒推\u003c/td\u003e\n\u003ctd\u003e计划：\u003cstrong\u003e\u003cstrong\u003e；备选：\u003c/strong\u003e\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e查询入口：\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098941.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 候选去伊豆列车\u003c/a\u003e／\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098921.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 候选回东京列车\u003c/a\u003e／\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东海巴士\u003c/a\u003e／\u003ca href=\"https://www.tokyo-monorail.co.jp/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东京单轨电车\u003c/a\u003e。\u003c/p\u003e\n\u003ch3\u003e3. 只替换、不叠加的调整规则\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e情况\u003c/th\u003e\n\u003cth\u003e优先处理\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/25 航班或入境延误\u003c/td\u003e\n\u003ctd\u003e删除散步；先保证入住，接近截止时间提前联系酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/26 江之岛超时\u003c/td\u003e\n\u003ctd\u003e删登塔／岩屋、极乐寺短停，不再追固定海边日落。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/27 镰仓晚出发\u003c/td\u003e\n\u003ctd\u003e缩短／取消美术馆。确实要补到 9/29，就把那天改为美术馆＋转场，海岸让给 10/1。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/28 箱根缆车或船停运\u003c/td\u003e\n\u003ctd\u003e根据官方公告走能运行的部分，或提早回酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/29 寄存失败或海岸不适合走\u003c/td\u003e\n\u003ctd\u003e直接入住热川，海岸改日或取消。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/30 大室山天气差\u003c/td\u003e\n\u003ctd\u003e与 10/1 互换或取消；重算巴士券，不自动换成危险的户外替代。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/2 决定去稻取\u003c/td\u003e\n\u003ctd\u003e放弃早班特急和新宿御苑，东京只保留傍晚。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/3 不看烟花、天气正常\u003c/td\u003e\n\u003ctd\u003e用东京 B 版。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/3 因恶劣天气取消烟花\u003c/td\u003e\n\u003ctd\u003e选室内活动，不保证当天还有 SHIBUYA SKY 票，也不硬上屋顶。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u0 td\u003e普通一日券「のりおりくん」\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e800／人\u003c/strong\u003e；乘车少时再与单程票比较，餐饮另付。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/27—9/29 箱根\u003c/td\u003e\n\u003ctd\u003e小田原出发\u003cstrong\u003e三日周游券\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e6,400／人\u003c/strong\u003e；按 9/27 起用购买。镰仓到小田原、伊豆铁路、美术馆门票另计。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/29—9/30 伊豆高原巴士\u003c/td\u003e\n\u003ctd\u003e单程票与两日券比较后决定\u003c/td\u003e\n\u003ctd\u003e两日券目前 \u003cstrong\u003e1,800／人\u003c/strong\u003e；\u003cstrong\u003e2026/10/1 起销售价格调至 2,150\u003c/strong\u003e。不因酒店在票区外就否定它。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根 → 伊豆、伊豆 → 东京\u003c/td\u003e\n\u003ctd\u003e普通车可选；踊り子是少换乘方案\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e基本运费＋特急附加费\u003c/strong\u003e，不能只拿基本运费预算特急。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京市内\u003c/td\u003e\n\u003ctd\u003e默认 IC 卡按次乘车\u003c/td\u003e\n\u003ctd\u003e路线含不同运营公司，不强行套地铁券。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e资料：\u003ca href=\"https://ekitan.com/transit/route/sf-1998/st-1865\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e机场参考\u003c/a\u003e、\u003ca href=\"https://www.enoden.co.jp/tourism/ticket/noriorikun/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e江之电一日券\u003c/a\u003e、\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e箱根周游券\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/ito_kanko_freepass.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东海巴士券与调价\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e巴士两日券这样算\u003c/strong\u003e：比较两天实际巴士费用，加上确实能用的景点优惠，再与票价比较。热川往返伊豆高原的铁路不包含；改为步行去海岸或两次使用不连续两天时重新算，不预设一定划算。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e美食券不作为默认。\u003c/strong\u003e 2,500 日元套餐的一日乘车券加四张兑换券，不等于四顿饭；一份商品可能用多张，周末还有限制。原文“省约 2,300 日元”的算法不再使用。\u003ca href=\"https://www.enoden.co.jp/tabemeguri-ticket/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e套餐说明\u003c/a\u003e\u003c/p\u003e\n", "title": "票券选择"}}, "checks": [{"id": "check-0", "group": "先确认版本和选择", "html": "\u003cp\u003e\u003cstrong\u003e实际回程确为 10/5 JL029、羽田出发\u003c/strong\u003e；核对时间和航站楼。\u003c/p\u003e\n", "text": "实际回程确为 10/5 JL029、羽田出发 ；核对时间和航站楼。"}, {"id": "check-1", "group": "先确认版本和选择", "html": "\u003cp\u003e东京住宿已按要求改为\u003cstrong\u003e滨松町名铁酒店（名鉄イン浜松町），10/2—10/5，共 3 晚\u003c/strong\u003e；出发前对照实际订单核实日期、房型、费用及退改条款。\u003c/p\u003e\n", "text": "东京住宿已按要求改为 滨松町名铁酒店（名鉄イン浜松町），10/2—10/5，共 3 晚 ；出发前对照实际订单核实日期、房型、费用及退改条款。"}, {"id": "check-2", "group": "先确认版本和选择", "html": "\u003cp\u003e确认人数、房间数、早餐晚餐权益、入住／退房、取消条款，不依赖原稿摘要。\u003c/p\u003e\n", "text": "确认人数、房间数、早餐晚餐权益、入住／退房、取消条款，不依赖原稿摘要。"}, {"id": "check-3", "group": "先确认版本和选择", "html": "\u003cp\u003e接受 \u003cstrong\u003e9/27 早离开镰仓＋下午美术馆\u003c/strong\u003e，而不是同时保留中午鳗鱼饭。\u003c/p\u003e\n", "text": "接受 9/27 早离开镰仓＋下午美术馆 ，而不是同时保留中午鳗鱼饭。"}, {"id": "check-4", "group": "先确认版本和选择", "html": "\u003cp\u003e10/1 选河津、热海＋黒根岩、温泉休息版，或天气补位中的一套。\u003c/p\u003e\n", "text": "10/1 选河津、热海＋黒根岩、温泉休息版，或天气补位中的一套。"}, {"id": "check-5", "group": "先确认版本和选择", "html": "\u003cp\u003e10/2 选\u003cstrong\u003e早进东京\u003c/strong\u003e还是\u003cstrong\u003e稻取半日\u003c/strong\u003e。\u003c/p\u003e\n", "text": "10/2 选 早进东京 还是 稻取半日 。"}, {"id": "check-6", "group": "先确认版本和选择", "html": "\u003cp\u003e东京选 A 看烟花或 B 不看烟花；若订付费席，核实会场、连座与取票。\u003c/p\u003e\n", "text": "东京选 A 看烟花或 B 不看烟花；若订付费席，核实会场、连座与取票。"}, {"id": "check-7", "group": "再落实预订与出行", "html": "\u003cp\u003e购买并保存适用日期的列车票、箱根周游券；特急确认目的地车厢、席位和总价。\u003c/p\u003e\n", "text": "购买并保存适用日期的列车票、箱根周游券；特急确认目的地车厢、席位和总价。"}, {"id": "check-8", "group": "再落实预订与出行", "html": "\u003cp\u003e按实际使用日期比较伊豆巴士两日券，注意 10/1 调价和连续两天规则。\u003c/p\u003e\n", "text": "按实际使用日期比较伊豆巴士两日券，注意 10/1 调价和连续两天规则。"}, {"id": "check-9", "group": "再落实预订与出行", "html": "\u003cp\u003e查好伊豆去程、回程和下一班巴士，截图保存，不用模糊班次规律。\u003c/p\u003e\n", "text": "查好伊豆去程、回程和下一班巴士，截图保存，不用模糊班次规律。"}, {"id": "check-10", "group": "再落实预订与出行", "html": "\u003cp\u003e向酒店确认寄存、接驳、晚餐场次和晚到联系方式。\u003c/p\u003e\n", "text": "向酒店确认寄存、接驳、晚餐场次和晚到联系方式。"}, {"id": "check-11", "group": "再落实预订与出行", "html": "\u003cp\u003e需要时预订美术馆、SHIBUYA SKY、晴空塔和餐厅；未订项目不标“已确认”。\u003c/p\u003e\n", "text": "需要时预订美术馆、SHIBUYA SKY、晴空塔和餐厅；未订项目不标“已确认”。"}, {"id": "check-12", "group": "再落实预订与出行", "html": "\u003cp\u003e采用烟花付费席时，到日本后按流程领取实体票，保存官方会场图。\u003c/p\u003e\n", "text": "采用烟花付费席时，到日本后按流程领取实体票，保存官方会场图。"}, {"id": "check-13", "group": "再落实预订与出行", "html": "\u003cp\u003e准备个人有效证件、订单、通讯、支付方式、备用现金和适合步行的鞋。\u003c/p\u003e\n", "text": "准备个人有效证件、订单、通讯、支付方式、备用现金和适合步行的鞋。"}, {"id": "check-14", "group": "再落实预订与出行", "html": "\u003cp\u003e带轻便雨具、外套、充电宝；每日根据次日天气和运行公告微调。\u003c/p\u003e\n", "text": "带轻便雨具、外套、充电宝；每日根据次日天气和运行公告微调。"}, {"id": "check-15", "group": "再落实预订与出行", "html": "\u003cp\u003e10/4 晚上完成行李整理、核对羽田早晨交通，10/5 不留其他任务。\u003c/p\u003e\n", "text": "10/4 晚上完成行李整理、核对羽田早晨交通，10/5 不留其他任务。"}], "transit": [{"id": "transit-0", "date": "9/25", "route": "空港第2ビル → 镰仓", "current": "出关后选车，17:01 直通是候选", "hint": "当天按实际出关查询"}, {"id": "transit-1", "date": "9/27", "route": "镰仓 → 大船 → 小田原", "current": "11:00 左右离开", "hint": "待按日期复核"}, {"id": "transit-2", "date": "9/29", "route": "小田原 → 伊豆高原", "current": "踊り子 1 号 10:01 → 11:02，或普通车", "hint": "购票后填席位／普通车接续"}, {"id": "transit-3", "date": "9/29", "route": "伊豆高原 ↔ 伊豆海洋公園", "current": "海岸巴士候选，也可用电车＋步行", "hint": "去程： ；回程： ；下一班：____"}, {"id": "transit-4", "date": "9/30", "route": "伊豆高原 ↔ シャボテン公園", "current": "大室山、动物公园", "hint": "去程： ；回程： ；下一班：____"}, {"id": "transit-5", "date": "10/1", "route": "河津 → 上入口；七滝 → 河津", "current": "仅默认七滝方案", "hint": "去程： ；回程： ；下一班：____"}, {"id": "transit-6", "date": "10/2", "route": "伊豆热川 → 品川", "current": "默认踊り子 2 号 10:32 → 12:40", "hint": "购票后填席位；稻取版另查午后车"}, {"id": "transit-7", "date": "10/5", "route": "滨松町 → 羽田 T3", "current": "以约 07:00 前到航站楼倒推", "hint": "计划： ；备选："}], "refs": {"hotel-kamakura": "https://plat-hostel-keikyu.com/hostel/kamakura-wave/", "hotel-tenseien nabi.com/about/", "fireworks-price": "https://www.city.setagaya.lg.jp/02219/26491.html", "fireworks-seat": "https://tamagawa-hanabi.com/seat/", "fireworks-manner": "https://tamagawa-hanabi.com/manner/", "fireworks-venue": "https://tamagawa-hanabi.com/venue/", "fireworks-traffic": "https://tamagawa-hanabi.com/traffic/", "fireworks-map": "https://tamagawa-hanabi.com/wp-content/uploads/2026/06/%E4%BA%A4%E9%80%9A%E8%A6%8F%E5%88%B6%E3%81%A8%E5%BE%92%E6%AD%A9%E3%83%AB%E3%83%BC%E3%83%88%E6%A1%88%E5%86%85%E5%9B%B3.pdf", "jal-hnd": "https://www.jal.co.jp/jp/ja/inter/airport/hnd/info/", "monorail": "https://www.tokyo-monorail.co.jp/"}, "sourceName": "Japan_Trip_Integrated_Itinerary_2026_Meitetsu.md", "sourceMarkdown": "# 2026 日本旅行计划｜整合执行版\n\n**2026 年 9 月 25 日—10 月 5 日｜11 天 10 晚｜公共交通为主**  \n**成田 → 镰仓 → 箱根 → 伊豆热川 → 东京 → 羽田**  \n**版本日期：2026 年 9 月 18 日｜滨松町名铁酒店更新版**\n\n\u003e **使用方法**：每天先看主线和时间表，再看交通、行李与删减规则。“替换方案”只能替换当天主线，不能继续叠加。\n\u003e\n\u003e **时间与费用口径**：全部时间为当地时间。游玩时段是排程建议，不是保证抵达时间；精确列车时刻标为“候选车次”，仍须按乘车日期核对。费用为日元、成人每人，双人席另有注明。\n\u003e\n\u003e **整合依据**：原始《2026-09-16 日本旅行计划》、上一轮《Japan_Trip_Review_Changes_2026.md》、此前对话中的东京“看烟花／不看烟花”两版。路线取舍与原有公开资料沿用整合版。未见订单原件的事项不视为已核实。\n\u003e\n\u003e **本次酒店更新**：按最新要求，东京住宿统一改为**滨松町名铁酒店（Meitetsu Inn Hamamatsucho／名鉄イン浜松町）**，仍为 **10/2 入住、10/5 退房，共 3 晚**。同步更新地址、电话、车站出口、步行与行李信息；其他城市安排、东京看烟花／不看烟花两版、航班及原有时间表不变。新增酒店公开资料依据[酒店官方交通页][hotel-meitetsu]与[官方问答][hotel-meitetsu-faq]；其他票价、班次和开放信息本次未重新核验。\n\n---\n\n## 一、先统一版本，避免拿错酒店和机场\n\n| 项目 | 本版采用 | 与其他材料的冲突／边界 |\n|---|---|---|\n| 去程 | **9/25 JL736，香港 → 成田**；前文时间 10:30 → 15:55 | 航班号由本人确认，时间沿用前文，最终看电子机票。 |\n| 回程 | **10/5 JL029，羽田 → 香港**；前文时间 09:55 → 13:30 | 原始 Markdown 写的是 JL735、成田 18:20 起飞。本版不混用那个方案。 |\n| 镰仓住宿 | plat hostel keikyu kamakura wave，9/25—9/27 | 沿用原住宿。 |\n| 箱根住宿 | 天成园，9/27—9/29 | 沿用原住宿，原稿注明含早晚餐。 |\n| 伊豆住宿 | 伊东园酒店热川，9/29—10/2 | 沿用原住宿，原稿注明含早晚餐。 |\n| 东京住宿 | **滨松町名铁酒店（Meitetsu Inn Hamamatsucho），10/2—10/5** | 按最新要求更新；不再采用旧版东京酒店。房型、费用、餐食和退改条款以实际订单为准。 |\n| 东京游玩 | 新宿、涩谷、浅草、银座等；10/3—10/4 分两版 | 不采用原始 Markdown 的 10/4 DisneySea、龟户往返路线和成田返程。 |\n| 10/2 上午 | **默认直接进东京**，稻取是互斥替换方案 | 保留稻取就放弃当天新宿御苑，不把两套时间表拼在一起。 |\n\n**东京酒店按最新要求采用滨松町名铁酒店，回程仍须复核电子机票。** 本次仅更新行程文档，不代表已变更、取消或核实任何酒店订单。原稿房间数量与“两人预算”也不完全一致，因此本文不推算同行人数，不汇总房费，不复制取消期限。\n\n### 一眼看完整行程\n\n| 日期 | 当日主线 | 当晚住宿 | 主要取舍 |\n|---|---|---|---|\n| **9/25 周五** | 成田落地 → 普通 JR → 镰仓入住 | 镰仓 | 纯交通日。 |\n| **9/26 周六** | 镰仓高校前 → 江之岛 → 长谷寺、大佛 → 海边 | 镰仓 | 岩屋、登塔不全部叠加。 |\n| **9/27 周日** | 鹤冈八幡宫、小町通 → 11:00 左右出发 → 雕刻之森 | 箱根天成园 | 放弃原来 12:00 的镰仓鳗鱼午餐。 |\n| **9/28 周一** | 箱根环线：大涌谷 → 芦之湖 → 箱根神社 | 箱根天成园 | 留温泉与晚餐时间。 |\n| **9/29 周二** | 箱根 → 伊豆高原寄存 → 城崎海岸短线 → 热川 | 伊豆热川 | 不先去热川放箱子再折返。 |\n| **9/30 周三** | 大室山＋仙人掌动物公园 | 伊豆热川 | 两个相邻景点用完整白天。 |\n| **10/1 周四** | 默认河津七滝；或热海＋黒根岩／温泉休息版 | 伊豆热川 | 只选一套，也作为天气调整日。 |\n| **10/2 周五** | 默认早进东京 → 新宿御苑、新宿 → 东京塔外观 | 滨松町名铁酒店 | 稻取半日是替换方案。 |\n| **10/3 周六·A** | 涩谷半日 → 提前进场 → 多摩川花火 | 滨松町名铁酒店 | 整个下午、晚上留给烟花。 |\n| **10/4 周日·A** | 皇居东御苑 → 浅草 → 银座 | 滨松町名铁酒店 | 晴空塔只远眺，疲惫时删皇居。 |\n| **10/3 周六·B** | 皇居东御苑 → 涩谷 → SHIBUYA SKY | 滨松町名铁酒店 | 不去二子玉川。 |\n| **10/4 周日·B** | 浅草 → 晴空塔／Solamachi → 银座 | 滨松町名铁酒店 | 登塔可选，晚上整理行李。 |\n| **10/5 周一** | 06:15 左右出发 → 羽田 T3 → JL029 | — | 纯返程日。 |\n\n东京住宿统一为滨松町名铁酒店。A、B 是同两天的两个版本，不是多出来的行程。\n\n---\n\n## 二、住宿、行李与交通票券\n\n### 1. 住宿信息和关键时间\n\n| 地点 | 酒店与地址 | 关键时间／交通 | 联系方式 |\n|---|---|---|---|\n| 镰仓 | **plat hostel keikyu kamakura wave**；镰仓市由比ヶ浜 2-2-39 | 入住 **16:00—22:30**，退房 11:00；镰仓站步行约 5 分钟，海滩约 10 分钟；寄存存在收费项目。 | +81-467-81-5005 |\n| 箱根 | **Hakone Yumoto Onsen Tenseien／箱根汤本温泉 天成园**；箱根町湯本 682 | 入住 15:00，退房 10:00；含晚餐方案注意 **18:00 前入住**，晚到提前联系。汤本站步行约 12 分钟。 | 原稿记录 +81-460-83-8511，出发前对照订单。 |\n| 伊豆 | **Itoen Hotel Atagawa／伊東園ホテル熱川**；东伊豆町奈良本 1267-2 | 车站步行约 10 分钟。原稿订单摘要写退房 10:00，官网通常为 11:00；本版安排更早离开，实际按订单执行。 | +81-557-23-2200 |\n| 东京 | **滨松町名铁酒店／Meitetsu Inn Hamamatsucho（名鉄イン浜松町）**；〒105-0013 东京都港区浜松町 1-19-14 | 通常 **15:00 入住、10:00 退房**，具体按订单。JR 滨松町北口步行约 **4 分钟**；大门站 **A2 出口约 2 分钟**；带大件行李可走 **A1 电梯出口约 3 分钟**。 | +81-3-5472-3434 |\n\n公开资料：[镰仓酒店][hotel-kamakura]、[天成园问答][hotel-tenseien]、[热川酒店][hotel-atagawa]、[滨松町名铁酒店交通][hotel-meitetsu]与[酒店问答][hotel-meitetsu-faq]。箱根、伊豆“含早晚餐”来自原稿，不是本轮重新核验的订房权益；具体餐次到店确认。\n\n**滨松町名铁酒店行李安排**：官方说明可在入住日至退房日期间于前台寄存行李。因此 10/2 提前抵达仍按“先寄存、再游玩”安排，不把提前到达写成一定可以提前进房；大件数量、贵重物品与具体取件要求向前台确认。[官方问答][hotel-meitetsu-faq]\n\n**热川酒店当前接驳：**\n\n- **车站 → 酒店**：13:30、14:00、14:30、15:00、15:30、16:00、16:30。\n- **酒店 → 车站**：09:15、09:55、10:35、11:15。\n- 出发前再核对。错过 16:30 不代表回不了酒店，而是需要步行或另行安排出租车；拖箱、下雨时留更多余量。[接驳信息][hotel-atagawa]\n\n### 2. 票券选择：按路线买，不为了回本绕路\n\n| 路段 | 本版选择 | 费用与边界 |\n|---|---|---|\n| 成田 → 镰仓 | **普通 JR 优先**，出关后选合适接续 | 查询参考约 **2,420／人**；不默认 N’EX，也不为等直通车长时间空等。 |\n| 9/26 江之电 | 普通一日券「のりおりくん」 | **800／人**；乘车少时再与单程票比较，餐饮另付。 |\n| 9/27—9/29 箱根 | 小田原出发**三日周游券** | **6,400／人**；按 9/27 起用购买。镰仓到小田原、伊豆铁路、美术馆门票另计。 |\n| 9/29—9/30 伊豆高原巴士 | 单程票与两日券比较后决定 | 两日券目前 **1,800／人**；**2026/10/1 起销售价格调至 2,150**。不因酒店在票区外就否定它。 |\n| 箱根 → 伊豆、伊豆 → 东京 | 普通车可选；踊り子是少换乘方案 | **基本运费＋特急附加费**，不能只拿基本运费预算特急。 |\n| 东京市内 | 默认 IC 卡按次乘车 | 路线含不同运营公司，不强行套地铁券。 |\n\n资料：[机场参考][airport-fare]、[江之电一日券][enoden-pass]、[箱根周游券][hakone-pass]、[东海巴士券与调价][tokai-pass]。\n\n**巴士两日券这样算**：比较两天实际巴士费用，加上确实能用的景点优惠，再与票价比较。热川往返伊豆高原的铁路不包含；改为步行去海岸或两次使用不连续两天时重新算，不预设一定划算。\n\n**美食券不作为默认。** 2,500 日元套餐的一日乘车券加四张兑换券，不等于四顿饭；一份商品可能用多张，周末还有限制。原文“省约 2,300 日元”的算法不再使用。[套餐说明][enoden-food]\n\n---\n\n## 三、9/25—9/28：镰仓与箱根\n\n## Day 1｜9/25 周五：成田落地，直接去镰仓\n\n**住：plat hostel keikyu kamakura wave**  \n**主线：JL736 → 成田 T2／空港第2ビル站 → JR → 镰仓站 → 步行入住。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 15:55 | 按前文时间抵达成田，下机、入境、取行李。 |\n| 17:00—18:15 左右 | 根据实际出关时间乘车，不预设 17:00 一定办完。 |\n| 19:30—21:00 左右 | 正常接续下的酒店抵达规划范围；延误及时联系酒店。 |\n| 入住后 | 简单晚餐／便利店补给，休息；海滩散步不是必做项目。 |\n\n**普通 JR 有直通镰仓的班次，不必固定在东京换车。** 当前九月平日时刻表中，**空港第2ビル 17:01 出发，久里浜方向，约 19:25 到镰仓**。途中线路名称变化，但同一列车直通时不用下车。[JR 官方候选车次][airport-jr]\n\n前面查询也出现过 **18:04 出发、约 20:30 到镰仓**的接续，可作为较晚出关时的查询目标；必须输入 9/25 日期复核，不只记住截图时间。[路线查询][airport-fare]\n\n售票时直接说明终点 **鎌倉／Kamakura**。普通车不保证有座。N’EX 只在疲惫、行李不便或接续明显更好时升级；到大船仍要换车，途中经过北镰仓，并不是一站到镰仓。[JR 站序][airport-jr]\n\n到镰仓站后正常步行去酒店，不默认打车。酒店到海滩约 10 分钟，并非“楼下就是沙滩”。**22:30 是最晚入住要求**，不要与前台其他服务时段混淆。[酒店信息][hotel-kamakura]\n\n**删减规则：**晚到只办入住、吃饭。预计逼近 22:30 时提前电话沟通，不自行假设酒店会等到深夜。\n\n---\n\n## Day 2｜9/26 周六：江之电海岸线与镰仓寺庙\n\n**住：镰仓**  \n**主线：镰仓高校前 → 江之岛 → 长谷寺 → 镰仓大佛 → 由比滨。**\n\n保留原稿“上午先去高校前和江之岛、下午回长谷”的喜好，但缩减岛内支线，不把餐券店设为必须抵达的节点。\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00—08:40 | 酒店附近早餐，轻装出门。 |\n| 08:40—09:30 | 江之电去镰仓高校前，平交道和海边短停。 |\n| 09:30—10:15 | 去江之岛站，步行上岛；包括站外步行。 |\n| 10:15—12:45 | 神社、街区、岛上午餐，登塔或岩屋最多选一个。 |\n| 12:45—14:00 | 离岛、候车、乘江之电回长谷。 |\n| 14:00—15:15 | 长谷寺境内和见晴台。 |\n| 15:30—16:15 | 镰仓大佛；胎内参观按开放、排队情况决定。 |\n| 16:30—17:30 | 海岸散步；天气不好或疲惫就直接回酒店。 |\n| 18:00 后 | 镰仓站／酒店附近晚餐。 |\n\n**岛上默认：神社和街区＋午餐，有余量再登塔。** 偏爱岩屋就用它替换登塔，并减少其他支线，不同时完成三宫全程、岩屋、灯塔和离岛午餐。\n\n岩屋成人 **500 日元**，开放受季节和临时状况影响；不承诺某个潮位、富士山一定可见或固定日落机位。[岩屋信息][enoshima-iwaya]\n\n长谷寺当前 **08:00 开放、16:30 停止入场、17:00 闭山，成人 400 日元**。大佛参拜 **300**，胎内另 **50 日元**。[长谷寺][hasedera]／[高德院][daibutsu]\n\n**超时先删：登塔／岩屋、极乐寺短停、固定日落机位。** 下午先完成寺庙，不为拍照错过入场。极乐寺不作为必下车项目；拍平交道时不进入轨道或车道。\n\n**餐饮处理：**review 已指出 BREEZE BIRD 不能按 08:45 早餐安排，ミンナミ食堂周六兑券、ヨリドコロ日落后兑券也不适配原路线。本版早餐以按时吃到为先，午餐留江之岛，晚餐在镰仓附近；那些店只保留为候选，不为兑券绕路。\n\n---\n\n## Day 3｜9/27 周日：镰仓收尾，下午雕刻之森\n\n**住：箱根天成园**  \n**主线：鹤冈八幡宫 → 小町通 → 镰仓 → 大船 → 小田原 → 箱根汤本 → 雕刻之森 → 天成园。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00 左右 | 退房或与酒店确认寄存，费用按规定。 |\n| 08:30—09:45 | 鹤冈八幡宫、段葛一带。 |\n| 10:00—10:30 | 小町通、买手信，不长时间排队用餐。 |\n| 10:30—11:00 | 取行李，到镰仓站。 |\n| 11:00 左右 | 经大船换 JR 东海道线去小田原。 |\n| 12:00—13:00 | 周游券、去箱根汤本、简餐与寄存，按实际接续调整。 |\n| 13:00—14:00 | 登山电车上山，步行入馆。 |\n| 14:00—16:00 | 雕刻之森美术馆。 |\n| 16:00—17:15 | 下山、取行李、到天成园。 |\n| 晚上 | 按酒店安排吃自助晚餐，之后泡汤。 |\n\n**这一版不保留 12:00「鰻のおかむら」午餐，也不承诺 15:00 已在酒店泡汤。** 想吃鳗鱼，可保留翌日元箱根长谷川为候选。这项取舍是为了留住美术馆，并释放 9/29 的时间。\n\n优先用箱根汤本站可用寄存设施；无合适柜位时先去酒店询问寄存，再上山，**相应缩短或取消美术馆**。不保证寄存免费，也不预设大件柜有空位。\n\n雕刻之森 **09:00—17:00，16:30 最后入馆**；成人现场 **2,000**、网上 **1,800 日元**。汤本上山留约 35—45 分钟车程，再加候车和步行，不是五分钟。[美术馆][hakone-museum]\n\n含晚餐方案注意天成园 **18:00 前入住**；预计晚到提前联系。延误时宁可早点离馆，也不拿酒店晚餐作赌注。[天成园问答][hotel-tenseien]\n\n---\n\n## Day 4｜9/28 周一：箱根环线与温泉\n\n**住：箱根天成园**  \n**主线：汤本 → 强罗 → 早云山 → 大涌谷 → 桃源台 → 元箱根港 → 箱根神社 → 汤本。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00 前后 | 早餐，查看缆车、游船运行公告。 |\n| 08:30—10:00 | 登山电车到强罗、缆车到早云山、空中缆车到大涌谷。 |\n| 10:00—11:00 | 大涌谷观景、黑蛋等简单体验。 |\n| 11:00—12:15 | 去桃源台，候船、乘海贼船，按当天停靠顺序。 |\n| 12:15—14:15 | **元箱根港**下船，午餐、箱根神社和湖边。 |\n| 14:15—15:30 | 鸟居拍照或散步，随后候车回汤本；排队过长就不等。 |\n| 16:00—17:00 左右 | 回酒店，休息、泡汤。 |\n| 晚上 | 酒店晚餐。 |\n\n神社与**元箱根港**衔接，官方参考步行约 10 分钟。不去箱根关所、旧街道时，不特地在箱根町下船再折返。[神社交通][hakone-shrine]\n\n湖边回汤本巴士按**约 35—60 分钟排程余量**考虑，另留候车与拥堵时间。上车核对运营公司、线路和周游券覆盖范围。[周游券][hakone-pass]\n\n午餐保留 **鳗鱼长谷川元箱根本店**为候选，定位在元箱根码头附近；尚未预约，满位则换就近午餐。[餐厅官网][hakone-eel]\n\n不加入已闭馆的小王子博物馆，不重复美术馆，也不把“覆盖八类交通”理解成“必须坐完八种”。缆车、游船停运时按当天公告缩减，**不预设一定有免费替代巴士**；天气不好早点回酒店即可。\n\n\n## 四、9/29—10/2：伊豆与进东京的衔接\n\n### 先记住伊豆的方向\n\n以下是**主要站点示意，不是完整站表**：\n\n```text\n北\n热海\n  │ JR 伊东线\n伊东\n  │ 伊豆急行线\n城崎海岸\n伊豆高原\n伊豆大川\n伊豆北川\n伊豆热川【酒店】\n片濑白田\n伊豆稻取\n河津\n南\n```\n\n**伊豆高原在热川北边，稻取、河津在热川南边。** 热海到热川不是 20 分钟，热川到伊豆高原也不是一站三分钟。\n\n| 普通电车路段 | 排程参考，不含候车／步行 | 当前成人单程普通纸票 |\n|---|---:|---:|\n| 伊豆热川 ↔ 热海 | 约 65—80 分钟 | 1,520 |\n| 伊豆热川 ↔ 伊豆高原 | 约 15—25 分钟 | 470 |\n| 伊豆热川 ↔ 伊豆北川 | 短程，按实际班次衔接 | 190 |\n| 伊豆热川 ↔ 伊豆稻取 | 约 10—15 分钟 | 280 |\n| 伊豆热川 ↔ 河津 | 约 20—30 分钟 | 560 |\n\n票价依据[伊豆急官方运价表][izu-fare]；IC 价格可能略有差异。时间沿用 review 的规划区间，不是所有车次相同，也不能套用成特急时间。\n\n---\n\n## Day 5｜9/29 周二：转场伊豆，城崎海岸短线\n\n**住：伊东园酒店热川**  \n**主线：天成园退房 → 小田原 → 伊豆高原寄存 → 城崎海岸 → 伊豆高原取行李 → 热川。**\n\n### 两种进伊豆的方式\n\n**少换乘版，优先查询候选车次：**\n\n\u003e **踊り子 1 号：小田原 10:01 → 伊豆高原 11:02。**  \n\u003e 当前 JR 公布时刻，不代表已买票或保证有座。[JR 官方车次][odoriko-1]\n\n建议约 **08:45 离开天成园**，预留到小田原、进站、找站台和买票时间。注意连接不同目的地车厢的情况：**去伊豆高原要坐「伊豆急下田」方向车厢，不是「修善寺」方向。** 以票面车厢和现场显示为准。\n\n**省钱版：小田原 → 热海 → 伊东／伊豆高原的普通电车接续。**\n\n目标在 **12:00 前后到伊豆高原**，按当天换乘查实际抵达时间，不能把普通车写成与特急同样用时。小田原到伊豆高原普通纸票参考 **1,470 日元**；特急另付附加费。汤本到小田原按周游券适用范围乘坐，不重复计费。[伊豆急运价][izu-fare]／[箱根周游券][hakone-pass]\n\n### 以 11 点左右到伊豆高原为基础的安排\n\n| 建议时间 | 安排 |\n|---|---|\n| 11:00—11:45 | 寄存行李、简餐、确认海岸往返交通。 |\n| 11:45—14:00 | 前往海岸，游览门胁吊桥、灯塔周边和一段步道。 |\n| 14:00—15:00 | 回伊豆高原站取行李。 |\n| 15:00—16:15 | 电车去伊豆热川，按到站时间衔接酒店接驳。 |\n| 16:00—17:00 左右 | 入住、休息，按酒店场次吃晚餐。 |\n\n### 先存好行李，再去海岸\n\n伊豆高原站设有寄存柜，但**不保证到站时有适合大件行李的空位**。[站内设施][izu-kogen-station]\n\n寄存失败、明显晚到或天气不适合走海岸时，直接去热川酒店。城崎海岸改为 **10/1 的替换项目**，不硬塞回大室山和动物公园那一天。\n\n### 海岸交通要选对站\n\n**巴士候选：伊豆高原站 →「伊豆海洋公園」→ 按现场步道前往门胁吊桥。** 下车后仍有步行，不是公交直接停在吊桥上；发车、步道入口与回程路线按官方查询及现场信息确认。[东海巴士查询][tokai-search]\n\n**不等巴士的备选：电车到「城ヶ崎海岸」站，再步行去海岸。** 官网车站到景区参考约 **35 分钟**，往返步行必须单独计入，不能当成“站口就是海”。[海岸交通][jogasaki]\n\n今天只走短线，不按九公里全线徒步安排。门胁灯塔按现场开放参观，不再沿用原稿“灯塔 300 日元”的预算。\n\n**删减规则：**普通车接续导致较晚到达时，缩短停留；约 12:30 后才解决好行李和午餐，就重新评估是否取消海岸，不牺牲入住与晚餐。\n\n---\n\n## Day 6｜9/30 周三：大室山＋仙人掌动物公园\n\n**住：伊豆热川**  \n**主线：热川 → 伊豆高原 → 巴士「シャボテン公園」→ 大室山 → 仙人掌动物公园 → 热川。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00—09:00 | 早餐、看大室山运行公告、查回程巴士。 |\n| 09:00—10:30 | 去伊豆高原转巴士；可使用酒店 09:15 接驳。 |\n| 10:30—11:45 | 大室山缆椅、山顶环行和拍照。 |\n| 11:45—12:30 | 午餐。 |\n| 12:30—15:00 | 动物公园，按兴趣选区域，不排满所有互动。 |\n| 15:00—17:00 | 巴士、电车返程；有酒店接驳则乘，错过则步行或另行安排。 |\n| 晚上 | 酒店晚餐和温泉。 |\n\n大室山成人往返缆椅 **1,000 日元**，山顶绕行约 20—30 分钟，另算排队和拍照。官网区分季节：**3—9 月通常营业至 17:00，10—2 月通常至 16:00**，实际受天气影响。挪到 10/1 时不能套用九月时间。[营业与费用][omuro]\n\n动物公园当前成人普通票为**平日 2,800、周末及指定假期 3,000 日元**；额外体验另计。九月底以参观动物和植物为主，不把“水豚泡温泉”作为一定能看到的节目。[动物公园票价][shaboten]\n\n**去回程查明确站名：伊豆高原駅／シャボテン公園。** 不用“每小时 :45、:59”猜班次。酒店 16:30 接驳末班不是游览的绝对截止线，但必须知道后面怎么回去，且不影响晚餐。[巴士查询][tokai-search]／[酒店接驳][hotel-atagawa]\n\n**天气调整：**可与 10/1 对调，把较好的风况和能见度留给大室山。若强风、暴雨或步道封闭，就减少户外活动，不能自动改去海岸或瀑布。换日后同时重查巴士券有效期、营业时间与晚餐衔接。\n\n---\n\n## Day 7｜10/1 周四：伊豆弹性日，三套只选一套\n\n### 默认：河津七滝，下午回热川\n\n**主线：热川 → 河津站 → 巴士 → 七滝步道 → 河津站 → 热川。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:30—10:15 | 离开酒店，电车到河津，再按已查好的巴士进山。 |\n| 10:15—12:45 | 溪谷和瀑布步道，留台阶、拍照、休息时间。 |\n| 12:45—13:30 | 简餐，地点不能影响回程巴士。 |\n| 13:30—15:30 | 巴士、电车返回；接续不佳时顺延。 |\n| 15:30—16:30 左右 | 回酒店休息，晚上吃酒店晚餐。 |\n\n计划从上游往下游走时，去程可查询 **「河津七滝遊歩道上入口」**，回程查询 **「河津七滝」**，不是同一站。上入口按约 **30—40 分钟巴士排程余量**考虑，具体停靠、班次和通行情况出发前确认。\n\n不承诺所有步道及七处瀑布当天全部开放，不为凑齐数量进入封闭路段。资料：[七滝观光协会][nanadaru]、[巴士查询][tokai-search]。\n\n**不再加石廊崎、修善寺或热海。** 电车接巴士加溪谷步行，已经是完整的一天。\n\n### 替换一：热海小镇＋黒根岩温泉\n\n保留原稿偏好，使用修正后的交通时间。\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:30—10:15 | 热川北上热海，包含候车与步行。 |\n| 10:15—12:30 | 来宫神社、商店街，减少支线。 |\n| 12:30—13:15 | 午餐，附近海边短走。 |\n| 13:15—14:45 | 电车南下伊豆北川，再步行到温泉。 |\n| 14:45—15:45 | 黒根岩風呂，按当天开放执行。 |\n| 15:45—17:00 | 返回热川酒店。 |\n\n**不加热海城。** 从热海南下先到北川、后到热川，不需要先坐过酒店站再倒回来。\n\n黒根岩当前 **10:00—18:00、17:45 最晚入场，成人 700 日元**，男女分浴。官网列有 PayPay，不再写“只收现金”；游客仍可备好现金、小毛巾，遵守浴场规定，不随意拍摄他人。[北川温泉官网][kurone]\n\n这套不是“近、零风险的轻松日”，有较长电车往返；偏爱小镇和海边温泉再选。\n\n### 替换二：北川温泉半日＋热川休息\n\n不去热海，也不去河津。早餐后慢慢出门，中午用餐，白天去黒根岩，下午回热川休息。\n\n若 9/29 海岸取消，也可将今天换成**城崎海岸专门日**，而不是把海岸、河津和温泉全部留下。\n\n\u003e **稻取雛之馆不要直接挪来今天：周四通常休馆。** 它保留在 10/2 替换段，与东京半日明确取舍。[开放信息][hina]\n\n---\n\n## Day 8｜10/2 周五：进东京，两种衔接方式\n\n### 默认：早离开伊豆，保住新宿下午\n\n**住：滨松町名铁酒店（Meitetsu Inn Hamamatsucho／名鉄イン浜松町）**  \n**主线：伊豆热川 → 品川 → JR 滨松町站北口 → 滨松町名铁酒店寄存 → 新宿 → 东京塔外观。**\n\n从品川转 JR 山手线或京滨东北线到滨松町，出**北口后步行约 4 分钟**到酒店；若从地铁大门站到达，选 **A2 出口**，需要电梯时选 **A1 出口**。[酒店交通][hotel-meitetsu]\n\n\u003e **候选车次：踊り子 2 号，伊豆热川 10:32 → 品川 12:40。**  \n\u003e 须核对 10/2 运行、票面日期和座位，不是已经代订。[JR 官方车次][odoriko-2]\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00—09:30 | 早餐、整理、退房。 |\n| 09:30—10:15 | 去车站；当前 09:55 酒店接驳可用作查询目标，不等 10:35 那班。 |\n| 10:32—12:40 | 候选特急去品川。 |\n| 13:00—14:00 | 前往滨松町名铁酒店寄存、简单午餐；未到通常 15:00 入住时间，不等待进房。 |\n| 14:00—14:45 | 去新宿，步行到御苑入口。 |\n| 14:45—15:50 | 新宿御苑散步，不追求全园。 |\n| 16:00—18:30 | 新宿街区、购物、晚餐；都厅可删。 |\n| 19:30—20:30 | 回酒店附近，芝公园、东京塔外观。 |\n\n**御苑十月 16:00 停止入园、16:30 闭园。** 当天迟到就删御苑，改逛新宿，不能把入园顺延至傍晚。[官方指南][gyoen]\n\n滨松町名铁酒店到东京塔官方参考步行约 **15 分钟**，所以原有东京塔外观散步安排保留，不再单独安排登塔半日。[酒店周边信息][hotel-meitetsu]\n\n### 替换：保留稻取雛之馆，东京只留傍晚\n\n**选择这一版，就不乘 10:32 的早班特急，也不安排当天下午新宿御苑。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:30—09:00 | 退房、确认寄存；先解决行李，再决定是否去稻取。 |\n| 09:00—10:00 | 电车去伊豆稻取，步行到文化公园。 |\n| 10:00—11:00 | **文化公园「雛の館」**秋季展示。 |\n| 11:00—12:00 | 温泉街／海边、简单海鲜午餐，不加远处展望台。 |\n| 12:00—13:00 | 回热川取行李，再到车站。 |\n| 13:00—14:00 左右 | 按提前查好的车次离开伊豆，优先少换乘的接续。 |\n| 16:00—17:30 左右 | 东京酒店抵达规划范围，以所选车次实际倒推。 |\n| 傍晚 | 芝公园、东京塔外观；体力好再考虑新宿夜间活动。 |\n\n这里是**室内秋季吊雏展示**，不是春季素盏鸣神社的阶梯人偶活动。雛之馆通常 **09:00—16:00、15:40 最晚入馆，成人 500 日元，周四休馆**；10/2 为周五，仍要看秋季开放日历。[雛之馆][hina]\n\n退房后寄存是否允许、费用和取件时间，须先问热川酒店；资料不足以保证热川站有合适大件柜。\n\n**取舍结论：默认版保留新宿御苑，稻取版保留伊豆人偶与小镇。** 两套都保留供选择，但不写成可以同时完成。\n\n\n## 五、东京 A 版：看 10/3 多摩川花火\n\n**10/2 按上一节默认早进东京；10/3、10/4 采用本节。**  \n核心取舍：保留涩谷、皇居、浅草、银座，**不强排晴空塔登塔，也不在烟花当天预约日落时段 SHIBUYA SKY**。\n\n## Day 9A｜10/3 周六：涩谷半日 → 多摩川花火\n\n官方已公布 **2026/10/3，18:00—19:00** 举办世田谷区多摩川花火大会，主会场为二子玉川绿地运动场，恶劣天气取消。[大会信息][fireworks-about]\n\n| 建议时间 | 安排 |\n|---|---|\n| 09:30—12:00 | 涩谷十字路口、八公、街区和商场，轻装活动。 |\n| 12:00—13:00 | 午餐，补水和简单食物，提前上厕所。 |\n| 13:00 左右 | 从涩谷乘田园都市线前往二子玉川。 |\n| 14:00—15:00 | 按选定会场入口步行和排队，不临时换岸找位置。 |\n| 15:00—17:30 | 付费席按规定入场，或在指定一般区等待、休息。 |\n| **18:00—19:00** | 花火大会。 |\n| 19:00—19:30 后 | 按现场指引分散离场，视拥堵决定何时步行出发。 |\n| 21:00—22:00 左右 | 作为回酒店的规划范围；严重拥堵时可能更晚。 |\n\n**这天预留的是整个下午和晚上，不只是放烟花的一小时。** SHIBUYA SKY 不是必去；很想上就选上午，替换部分涩谷购物，不叠加下午或日落票。\n\n### 1. 观览位置：提前选定，不现场巡回找“穴场”\n\n| 选择 | 使用原则 |\n|---|---|\n| **付费观览席** | 先确认具体会场、入口、座位和取票方式。单人椅席当前标价 **6,500／人**，双人椅席 **14,000／对**，手续费另看订单；未核实时余票。 |\n| **一般观览区** | 只采用当年官方图标出的可入场区域，遵守站立区、通道与铺垫规则，不承诺随到随有好位置。 |\n| **原稿的几个公园** | 不把二子玉川公园、兵库岛、上野毛自然公园、等々力绿地一概当作“免费、空、人少、散场快”的保证。部分区域有收费观览安排或管制。 |\n\n票价和观览区以[世田谷官方售票说明][fireworks-price]、[大会座位说明][fireworks-seat]为准。购买两张单人票不等于已经保证连座，需看实际选座和票面。\n\n### 2. 入场与物品\n\n付费席当前说明 **15:00 起入场**，需按流程在 **7-Eleven 领取实体票**；不要只带订单截图。购买后变更、主动取消及大会取消后的退款，都按官方票规，不能默认免费退。[票券规则][fireworks-seat]\n\n一般区铺野餐垫须遵守**当日 14:00 以后**等规则，不早上铺满位置后离场逛街。准备饮水、便携食物、充电宝、轻便外套、垃圾袋；使用垫子和摄影器材不挡通道或他人视线。[现场规则][fireworks-manner]\n\n提前保存票面、会场图和返程路线；到场后不把手机网络始终通畅当成前提。\n\n### 3. 去程不要卡在开场前\n\n官方提示，临近开场时车站到会场可能耗时**超过 90 分钟**。因此本版 13:00 左右就从涩谷出发，不能把“16:30 到二子玉川站”当作稳妥方案。[会场交通][fireworks-venue]\n\n入场按当年开放入口和现场指引走；地图 App 的最短路径不一定能穿过管制区。不要临时横穿河流两岸，以免遇到桥面通行限制。[官方交通图][fireworks-map]\n\n### 4. 散场：把用贺站当作分流备选\n\n官方专门给出前往 **用賀駅／用贺站**的步行分流路线，参考约 **30 分钟**；拥堵、出场位置、体力会额外增加时间，不是保证半小时进站。[分流路线图][fireworks-map]\n\n可采用：\n\n**会场 → 按指引经吉沢口／華火橋口等适用出口 → 用贺站 → 田园都市线／直通半藏门线 → 青山一丁目 → 大江户线 → 大门站 A2 出口 → 步行约 2 分钟 → 滨松町名铁酒店。**\n\n车站至酒店的末段按新酒店位置更新；需要电梯时可用 A1 出口，步行约 3 分钟。[酒店交通][hotel-meitetsu]\n\n二子玉川站也可作为返程选项，但不要认为它距离近就一定最快。不要把出租车设为可靠的散场捷径，也不预订烟花结束后的固定时间餐厅、展望台或其他活动。[交通管制][fireworks-traffic]\n\n### 5. 当天取消怎么办\n\n官方会在当天早上 **07:00 前作出一次举办判断**，之后也可能因天气变化取消，仍要持续查看公告。[官方票券与取消说明][fireworks-seat]\n\n- **提前决定不看且天气适合户外**：改用后面的 B 版，重排皇居和涩谷。\n- **临时因恶劣天气取消**：改为涩谷室内商场、餐饮和休息；不是自动去屋顶展望台。\n- 已买 SHIBUYA SKY 或烟花票时，按各自票规处理，不假设当日能随意改票或临时买到日落场。\n\n---\n\n## Day 10A｜10/4 周日：皇居 → 浅草 → 银座\n\n**住：滨松町名铁酒店；今晚完成行李整理。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 09:00—10:15 | 皇居东御苑，选主要步道，不走遍全园。 |\n| 10:15—11:00 | 前往浅草。 |\n| 11:00—13:00 | 浅草寺、仲见世、午餐。 |\n| 13:00—13:30 | 隅田川边短走，远眺晴空塔。 |\n| 14:30—18:00 | 银座购物、晚餐。 |\n| 19:00—20:00 | 回酒店、整理行李、确认次日机场路线。 |\n\n宫内厅当前日历显示 **10/3、10/4 东御苑开放，10/2、10/5 休园**，临时安排仍需查看公告。[开放日历][imperial]\n\n**疲惫时的删减顺序：先删皇居，再减少浅草支线；保留回酒店收行李的时间。** 晴空塔这版只远眺，不登塔；东京塔外观已放到 10/2，不再重复跑。\n\n---\n\n## 六、东京 B 版：不看烟花\n\n**10/2 不变；10/3、10/4 用本节替换 A 版。**  \n把皇居移到 10/3 上午，10/4 才能给浅草、晴空塔和银座留出完整时段。\n\n## Day 9B｜10/3 周六：皇居 → 涩谷 → SHIBUYA SKY\n\n| 建议时间 | 安排 |\n|---|---|\n| 09:00—10:30 | 皇居东御苑。 |\n| 10:30—11:30 | 前往涩谷。 |\n| 11:30—15:30 | 午餐、街区、商场，中间留休息时间。 |\n| 16:00—17:30 | SHIBUYA SKY，按实际预约入场时间调整。 |\n| 18:00—19:30 | 晚餐，继续逛街或回酒店。 |\n| 20:00 左右 | 回酒店。 |\n\nSHIBUYA SKY 当前官方网络票通常销售未来**两周**的时段；网页售罄时不能默认窗口有票。成人网络票目前按入场时间区分：**15:00 前 2,700 日元，15:00 起 3,400 日元**；以购买页面为准。[官方门票][shibuya-sky]\n\n屋顶可能因降雨、强风等关闭，是否退改按票规。16 点左右只是本版的参观建议，不保证晴天、日落效果或一定有余票。\n\n**B 版不是完整暴雨预案。** 天气差时改为室内购物、吃饭和休息，不坚持屋顶或长距离露天散步。\n\n---\n\n## Day 10B｜10/4 周日：浅草 → 晴空塔 → 银座\n\n| 建议时间 | 安排 |\n|---|---|\n| 09:00—11:00 | 浅草寺、仲见世街区。 |\n| 11:00—11:30 | 前往晴空塔。 |\n| 11:30—13:30 | 晴空塔／Solamachi、午餐；登塔按预约时间。 |\n| 14:30—18:00 | 银座购物、晚餐。 |\n| 19:00—20:00 | 回酒店收行李，早点休息。 |\n\n**登晴空塔是可选，不是必须。** 已上过 SHIBUYA SKY、对第二个高处视角兴趣一般，就只逛商场、看外观。门票按到访日期与所选展望层核价，不沿用原稿的固定旧价格。\n\n### A、B 版的主要差别\n\n| 项目 | A：看烟花 | B：不看烟花 |\n|---|---|---|\n| 10/3 上午 | 涩谷 | 皇居东御苑 |\n| 10/3 下午、晚上 | 进场、等待、花火、分流返程 | 涩谷、SHIBUYA SKY、晚餐 |\n| 10/4 | 皇居 → 浅草 → 银座 | 浅草 → 晴空塔 → 银座 |\n| SHIBUYA SKY | 默认不安排；上午可替换购物 | 预约下午时段 |\n| 晴空塔 | 远眺，不登塔 | 可选登塔 |\n| 节奏 | 等候、散场更耗时，次日允许删皇居 | 市区参观与购物更从容 |\n\n---\n\n## 七、Day 11｜10/5 周一：直接去羽田\n\n**本节只适用于本版采用的 JL029／羽田早班回程。** 出发前再次对照电子机票；原稿 JL735 成田傍晚的路线不能套到这里。\n\n| 建议时间 | 安排 |\n|---|---|\n| 05:30—06:00 | 起床、最后检查行李，简单早餐。 |\n| **06:15 左右** | 退房，离开滨松町名铁酒店。 |\n| 06:15—07:00 左右 | 步行去东京单轨电车滨松町站，乘车至羽田机场第 3 航站楼；另留进站、上楼与候车时间。 |\n| 06:45—07:00 左右 | 目标抵达航站楼，办理值机、托运、安检。 |\n| 09:55 | 按前文 JL029 时间起飞；最终以电子机票及航司通知为准。 |\n\n滨松町名铁酒店至东京单轨电车滨松町站，官网参考步行约 **4 分钟**；清晨拖箱另留进站、上楼与候车时间，继续保留 **06:15 左右出发**的安排，别把列车行驶时间当作酒店到柜台的全部时间。[酒店交通][hotel-meitetsu] JAL 羽田国际线手续使用第 3 航站楼，仍应检查航司当天通知。[JAL 羽田信息][jal-hnd]\n\n10/4 晚上完成行李整理、确认交通和支付方式。**10/5 不安排芝公园、不去东京站补购物，也不去成田。**\n\n\n## 八、预算：把确定单价与未定项目分开\n\n### 1. 已有依据的交通单价\n\n金额为成人每人，普通纸票与 IC 可能有小额差异。**特急列车总价不能只用下面的基本运费。**\n\n| 项目 | 参考金额 | 是否已包括在其他项目中 |\n|---|---:|---|\n| 成田 → 镰仓普通 JR | 约 2,420 | 独立一笔，不另拆东京换乘费用。 |\n| 9/26 江之电一日券 | 800 | 当日适用乘车，不含餐饮。 |\n| 镰仓 → 小田原 JR | 约 810，沿用 review 参考，购票复核 | 不在箱根周游券内。 |\n| 箱根三日周游券 | 6,400 | 包括适用范围内的箱根交通，不再逐段重复相加。 |\n| 小田原 → 伊豆高原基本运费 | 1,470 | 乘踊り子另加特急费；从箱根转场只算一次。 |\n| 伊豆高原 → 热川 | 470 | 9/29 入住段。 |\n| 热川 ↔ 伊豆高原 | 往返 940 | 9/30；巴士另计。 |\n| 热川 ↔ 河津 | 往返 1,120 | 10/1 默认方案；七滝巴士另计。 |\n| 热川 ↔ 稻取 | 往返 560 | 仅选择 10/2 稻取替换方案时加入。 |\n| 伊豆高原巴士两日券 | 9 月销售价 1,800；10/1 起 2,150 | 选券后不再把已覆盖的单程巴士全加一次。 |\n\n依据：[机场查询][airport-fare]、[江之电][enoden-pass]、[箱根周游券][hakone-pass]、[伊豆急运价][izu-fare]、[东海巴士][tokai-pass]。镰仓到小田原的 810 日元是 review 的参考值，不是已购买票价。\n\n**尚未锁定的交通费用**：踊り子附加费、10/1 具体巴士、伊豆到品川的最终票价、东京市内和羽田交通、寄存柜及偶发出租车。路线与席别确定后统一补入，本文不把未定项目藏进一个看似精确的全程总价。\n\n### 2. 景点与可选项目\n\n| 项目 | 成人参考价 | 本版位置 |\n|---|---:|---|\n| 长谷寺 | 400 | 9/26 主线 |\n| 镰仓大佛 | 300；胎内另 50 | 9/26 主线／附加可选 |\n| 江之岛岩屋 | 500 | 与登塔取舍，不一定加入 |\n| 雕刻之森 | 网上 1,800；现场 2,000 | 9/27 主线 |\n| 大室山缆椅 | 往返 1,000 | 9/30 主线 |\n| 仙人掌动物公园 | 平日 2,800；周末及指定假期 3,000 | 9/30，按实际票种 |\n| 黒根岩 | 700 | 10/1 替换方案 |\n| 稻取雛之馆 | 500 | 10/2 替换方案 |\n| 多摩川花火单人椅席 | 6,500＋适用手续费 | A 版可选付费席 |\n| SHIBUYA SKY 网络成人票 | 15:00 前 2,700；15:00 起 3,400 | B 版默认下午，A 版上午可替换购物 |\n\n上述价格的官方链接见各日正文。**仅长谷寺、大佛外部、美术馆、大室山、动物公园五项合计约 6,300—6,500 日元／人**，按动物公园平日普通票、无额外体验计算。这个小计不是全程门票总额，不包含御苑、岩屋、登塔、烟花等其他选择，也未套用任何可叠加优惠。\n\n新宿御苑、江之岛灯塔、晴空塔等按最终到访项目与票种购票；不使用原稿里未经确认的旧价。餐饮、购物、住宿、温泉税、寄存和保险均不混入上述小计。\n\n### 3. 餐饮与现金的规划方式\n\n原稿注明箱根两晚、热川三晚包含早晚餐；实际先核对订单，不在外面再安排同一晚的固定餐厅。白天午餐给出行留余量，不为打卡店错过车。\n\n**现金可先按每位成人约 10,000—15,000 日元的备用额准备**，这是规划建议，不是实际必需支出。结合卡片能否使用和日常花费补充，不把所有寺庙、温泉、动物公园统称“只收现金”。交通卡余额、实体卡或手机支持情况在出发前自行确认。\n\n---\n\n## 九、行李、交通衔接与天气：现场用这一页\n\n### 1. 四个行李节点\n\n| 日期 | 默认安排 | 失败时怎么改 |\n|---|---|---|\n| **9/27 镰仓退房** | 问酒店是否可短时寄存，逛完取走 | 收费接受与否自行决定；不假设免费。 |\n| **9/27 箱根上山前** | 汤本站适用寄存设施，或先去酒店询问 | 有额外往返就缩短美术馆，不推迟到酒店的底线。 |\n| **9/29 伊豆高原** | 存箱子，轻装海岸短线 | 无合适柜位就去热川，海岸换到 10/1 或取消。 |\n| **10/2 进东京／稻取备选** | 默认到滨松町名铁酒店前台寄存；稻取版先问热川酒店 | 不拖大件去稻取散步；未解决行李就取消稻取。 |\n\n### 2. 需要临近乘车日期填写的交通表\n\n下面“计划／下一班”尚未锁定，不代表已查到或已订票。填写时同时核对日期、上下车站、方向与适用票券。\n\n| 日期 | 路段 | 当前安排 | 计划班次／下一班 |\n|---|---|---|---|\n| 9/25 | 空港第2ビル → 镰仓 | 出关后选车，17:01 直通是候选 | 当天按实际出关查询 |\n| 9/27 | 镰仓 → 大船 → 小田原 | 11:00 左右离开 | 待按日期复核 |\n| 9/29 | 小田原 → 伊豆高原 | 踊り子 1 号 10:01 → 11:02，或普通车 | 购票后填席位／普通车接续 |\n| 9/29 | 伊豆高原 ↔ 伊豆海洋公園 | 海岸巴士候选，也可用电车＋步行 | 去程：____；回程：____；下一班：____ |\n| 9/30 | 伊豆高原 ↔ シャボテン公園 | 大室山、动物公园 | 去程：____；回程：____；下一班：____ |\n| 10/1 | 河津 → 上入口；七滝 → 河津 | 仅默认七滝方案 | 去程：____；回程：____；下一班：____ |\n| 10/2 | 伊豆热川 → 品川 | 默认踊り子 2 号 10:32 → 12:40 | 购票后填席位；稻取版另查午后车 |\n| 10/5 | 滨松町 → 羽田 T3 | 以约 07:00 前到航站楼倒推 | 计划：____；备选：____ |\n\n查询入口：[JR 候选去伊豆列车][odoriko-1]／[JR 候选回东京列车][odoriko-2]／[东海巴士][tokai-search]／[东京单轨电车][monorail]。\n\n### 3. 只替换、不叠加的调整规则\n\n| 情况 | 优先处理 |\n|---|---|\n| 9/25 航班或入境延误 | 删除散步；先保证入住，接近截止时间提前联系酒店。 |\n| 9/26 江之岛超时 | 删登塔／岩屋、极乐寺短停，不再追固定海边日落。 |\n| 9/27 镰仓晚出发 | 缩短／取消美术馆。确实要补到 9/29，就把那天改为美术馆＋转场，海岸让给 10/1。 |\n| 9/28 箱根缆车或船停运 | 根据官方公告走能运行的部分，或提早回酒店。 |\n| 9/29 寄存失败或海岸不适合走 | 直接入住热川，海岸改日或取消。 |\n| 9/30 大室山天气差 | 与 10/1 互换或取消；重算巴士券，不自动换成危险的户外替代。 |\n| 10/2 决定去稻取 | 放弃早班特急和新宿御苑，东京只保留傍晚。 |\n| 10/3 不看烟花、天气正常 | 用东京 B 版。 |\n| 10/3 因恶劣天气取消烟花 | 选室内活动，不保证当天还有 SHIBUYA SKY 票，也不硬上屋顶。 |\n| 10/3 散场很晚 | 10/4 先删皇居，从浅草开始，晚上仍尽早整理行李。 |\n\n### 4. 导航时用这些日文名称\n\n| 中文 | 可复制的检索词 |\n|---|---|\n| 成田 T2 铁路站 | 空港第2ビル |\n| 镰仓／大船 | 鎌倉駅／大船駅 |\n| 镰仓高校前／长谷 | 鎌倉高校前駅／長谷駅 |\n| 箱根汤本／雕刻之森 | 箱根湯本駅／彫刻の森美術館 |\n| 早云山／大涌谷／桃源台 | 早雲山／大涌谷／桃源台 |\n| 元箱根港 | 元箱根港 |\n| 伊豆高原／热川／北川 | 伊豆高原駅／伊豆熱川駅／伊豆北川駅 |\n| 城崎海岸／门胁吊桥 | 城ヶ崎海岸／門脇つり橋 |\n| 大室山／动物公园巴士站 | 大室山／シャボテン公園 |\n| 河津七滝上入口／下游站 | 河津七滝遊歩道上入口／河津七滝 |\n| 稻取人偶馆 | 文化公園 雛の館 |\n| 滨松町名铁酒店 | 名鉄イン浜松町／Meitetsu Inn Hamamatsucho | \n| 酒店附近车站／出口 | 浜松町駅 北口／大門駅 A2出口（电梯走 A1出口） |\n| 烟花会场／分流站 | 二子玉川緑地運動場／用賀駅 |\n| 回程机场站 | 羽田空港第3ターミナル |\n\n---\n\n## 十、出发前确认清单\n\n### 先确认版本和选择\n\n- [ ] **实际回程确为 10/5 JL029、羽田出发**；核对时间和航站楼。\n- [ ] 东京住宿已按要求改为**滨松町名铁酒店（名鉄イン浜松町），10/2—10/5，共 3 晚**；出发前对照实际订单核实日期、房型、费用及退改条款。\n- [ ] 确认人数、房间数、早餐晚餐权益、入住／退房、取消条款，不依赖原稿摘要。\n- [ ] 接受 **9/27 早离开镰仓＋下午美术馆**，而不是同时保留中午鳗鱼饭。\n- [ ] 10/1 选河津、热海＋黒根岩、温泉休息版，或天气补位中的一套。\n- [ ] 10/2 选**早进东京**还是**稻取半日**。\n- [ ] 东京选 A 看烟花或 B 不看烟花；若订付费席，核实会场、连座与取票。\n\n### 再落实预订与出行\n\n- [ ] 购买并保存适用日期的列车票、箱根周游券；特急确认目的地车厢、席位和总价。\n- [ ] 按实际使用日期比较伊豆巴士两日券，注意 10/1 调价和连续两天规则。\n- [ ] 查好伊豆去程、回程和下一班巴士，截图保存，不用模糊班次规律。\n- [ ] 向酒店确认寄存、接驳、晚餐场次和晚到联系方式。\n- [ ] 需要时预订美术馆、SHIBUYA SKY、晴空塔和餐厅；未订项目不标“已确认”。\n- [ ] 采用烟花付费席时，到日本后按流程领取实体票，保存官方会场图。\n- [ ] 准备个人有效证件、订单、通讯、支付方式、备用现金和适合步行的鞋。\n- [ ] 带轻便雨具、外套、充电宝；每日根据次日天气和运行公告微调。\n- [ ] 10/4 晚上完成行李整理、核对羽田早晨交通，10/5 不留其他任务。\n\n---\n\n## 资料说明与核对入口\n\n**原始材料**：用户提供的《2026-09-16 日本旅行计划》；上一轮《Japan_Trip_Review_Changes_2026.md》；本次对话中已讨论的东京两版、JL736／JL029与机场交通；最新要求将东京酒店改为滨松町名铁酒店。\n\n**公开资料**：正文链接以铁路公司、巴士公司、酒店、景点、主办方或市区官方网站为主。机场普通 JR 费用另参考公开换乘查询。原有票价、开放日与交通限制沿用上一版整合时的核对结果，本次未重新核验；未查询实时余票、未替用户预订，具体车次和临时停运仍需出发前复核。\n\n**本次酒店更新的外部核对**：滨松町名铁酒店的日文名称、地址、电话、通常入住／退房时间、寄存说明、JR／单轨电车滨松町与大门站出口及步行时间、东京塔步行参考，依据其官方交通页及官方问答（2026 年 9 月 18 日查询）。这些是酒店公开信息，不代表已核验或变更实际预订。[酒店交通][hotel-meitetsu]／[官方问答][hotel-meitetsu-faq]\n\n**上一版整合已做的重要校准（本次沿用）**：东海巴士两日券从 2026/10/1 起的销售价格变化；大室山九月与十月营业时间不同；烟花官方用贺站分流路线约 30 分钟的参考；黒根岩并非只能现金付款。它们是外部核对内容，不是原稿已经确认的预订条件。\n\n**本版没有擅自补齐的事项**：实际东京订单、返程电子机票、同行人数、房间与餐饮权益、退改条款、大件寄存空位、巴士具体分钟及门票余量。所有时间取舍以“正常交通下可执行、延误时知道删什么”为原则。\n\n[hotel-kamakura]: https://plat-hostel-keikyu.com/hostel/kamakura-wave/\n[hotel-tenseien]: https://www.tenseien.co.jp/faq/?category=%E5%AE%BF%E6%B3%8A\n[hotel-atagawa]: https://www.itoenhotel.com/atagawa/access/\n[hotel-meitetsu]: https://www.m-inn.com/hamamatsucho/access_guide/\n[hotel-meitetsu-faq]: https://www.m-inn.com/hamamatsucho/faq/\n[airport-fare]: http function placeMatcher(places){
 const queries=new Map();for(const [query,aliases]of places)for(const alias of aliases)queries.set(alias,query);
 const pattern=[...queries.keys()].sort((a,b)=>b.length-a.length).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
 return {queries,pattern:new RegExp(pattern,'g')};
}

function placeQuery(name,node){
 const route=node.parentElement.closest('.route-box,.memo-card h4');
 if(name==='河津七滝'&&/回程查询\s*「河津七滝」/.test(node.parentElement.closest('p,li')?.textContent||''))return prosePlaces.queries.get('七滝回程站');
 return (route?routePlaces:prosePlaces).queries.get(name);
}
function linkPlaces(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
  return node.parentElement.closest('a,button,label,input,textarea,select,script,style,svg,pre,code,[contenteditable],.notes-panel,.provenance,.source-notice')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
 }});
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
  const {pattern}=node.parentElement.closest('.route-box,.memo-card h4')?routePlaces:prosePlaces;
  const text=node.nodeValue,fragment=document.createDocumentFragment();let end=0;
  pattern.lastIndex=0;
  for(const match of text.matchAll(pattern)){
   const name=match[0],start=match.index;
   // This branch stores luggage at the hotel, not at Atagawa Station.
   if(name==='热川'&&/^(寄存|取行李)/.test(text.slice(start+name.length)))continue;
   if((/^[A-Za-z0-9]/.test(name)&&/[A-Za-z0-9]/.test(text[start-1]||''))||(/[A-Za-z0-9]$/.test(name)&&/[A-Za-z0-9]/.test(text[start+name.length]||'')))continue;
   fragment.append(text.slice(end,start));
   const link=document.createElement('a');link.className='place-link';link.href=mapUrl(placeQuery(name,node));link.target='_blank';link.rel='noopener noreferrer';link.textContent=name;
   link.title='在 Google Maps 中打开：'+name;link.setAttribute('aria-label',link.title);fragment.append(link);end=start+name.length;
  }
  if(end){fragment.append(text.slice(end));node.replaceWith(fragment);}
 }
}
