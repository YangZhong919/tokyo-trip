\n\n**这天预留的是整个下午和晚上，不只是放烟花的一小时。** SHIBUYA SKY 不是必去；很想上就选上午，替换部分涩谷购物，不叠加下午或日落票。\n\n### 1. 观览位置：提前选定，不现场巡回找“穴场”\n\n| 选择 | 使用原则 |\n|---|---|\n| **付费观览席** | 先确认具体会场、入口、座位和取票方式。单人椅席当前标价 **6,500／人**，双人椅席 **14,000／对**，手续费另看订单；未核实时余票。 |\n| **一般观览区** | 只采用当年官方图标出的可入场区域，遵守站立区、通道与铺垫规则，不承诺随到随有好位置。 |\n| **原稿的几个公园** | 不把二子玉川公园、兵库岛、上野毛自然公园、等々力绿地一概当作“免费、空、人少、散场快”的保证。部分区域有收费观览安排或管制。 |\n\n票价和观览区以[世田谷官方售票说明][fireworks-price]、[大会座位说明][fireworks-seat]为准。购买两张单人票不等于已经保证连座，需看实际选座和票面。\n\n### 2. 入场与物品\n\n付费席当前说明 **15:00 起入场**，需按流程在 **7-Eleven 领取实体票**；不要只带订单截图。购买后变更、主动取消及大会取消后的退款，都按官方票规，不能默认免费退。[票券规则][fireworks-seat]\n\n一般区铺野餐垫须遵守**当日 14:00 以后**等规则，不早上铺满位置后离场逛街。准备饮水、便携食物、充电宝、轻便外套、垃圾袋；使用垫子和摄影器材不挡通道或他人视线。[现场规则][fireworks-manner]\n\n提前保存票面、会场图和返程路线；到场后不把手机网络始终通畅当成前提。\n\n### 3. 去程不要卡在开场前\n\n官方提示，临近开场时车站到会场可能耗时**超过 90 分钟**。因此本版 13:00 左右就从涩谷出发，不能把“16:30 到二子玉川站”当作稳妥方案。[会场交通][fireworks-venue]\n\n入场按当年开放入口和现场指引走；地图 App 的最短路径不一定能穿过管制区。不要临时横穿河流两岸，以免遇到桥面通行限制。[官方交通图][fireworks-map]\n\n### 4. 散场：把用贺站当作分流备选\n\n官方专门给出前往 **用賀駅／用贺站**的步行分流路线，参考约 **30 分钟**；拥堵、出场位置、体力会额外增加时间，不是保证半小时进站。[分流路线图][fireworks-map]\n\n可采用：\n\n**会场 → 按指引经吉沢口／華火橋口等适用出口 → 用贺站 → 田园都市线／直通半藏门线 → 青山一丁目 → 大江户线 → 大门站 A2 出口 → 步行约 2 分钟 → 滨松町名铁酒店。**\n\n车站至酒店的末段按新酒店位置更新；需要电梯时可用 A1 出口，步行约 3 分钟。[酒店交通][hotel-meitetsu]\n\n二子玉川站也可作为返程选项，但不要认为它距离近就一定最快。不要把出租车设为可靠的散场捷径，也不预订烟花结束后的固定时间餐厅、展望台或其他活动。[交通管制][fireworks-traffic]\n\n### 5. 当天取消怎么办\n\n官方会在当天早上 **07:00 前作出一次举办判断**，之后也可能因天气变化取消，仍要持续查看公告。[官方票券与取消说明][fireworks-seat]\n\n- **提前决定不看且天气适合户外**：改用后面的 B 版，重排皇居和涩谷。\n- **临时因恶劣天气取消**：改为涩谷室内商场、餐饮和休息；不是自动去屋顶展望台。\n- 已买 SHIBUYA SKY 或烟花票时，按各自票规处理，不假设当日能随意改票或临时买到日落场。", "html": "\u003cp\u003e官方已公布 \u003cstrong\u003e2026/10/3，18:00—19:00\u003c/strong\u003e 举办世田谷区多摩川花火大会，主会场为二子玉川绿地运动场，恶劣天气取消。\u003ca href=\"https://tamagawa-hanabi.com/about/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e大会信息\u003c/a\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:30—12:00\u003c/td\u003e\n\u003ctd\u003e涩谷十字路口、八公、街区和商场，轻装活动。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:00—13:00\u003c/td\u003e\n\u003ctd\u003e午餐，补水和简单食物，提前上厕所。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00 左右\u003c/td\u003e\n\u003ctd\u003e从涩谷乘田园都市线前往二子玉川。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—15:00\u003c/td\u003e\n\u003ctd\u003e按选定会场入口步行和排队，不临时换岸找位置。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:00—17:30\u003c/td\u003e\n\u003ctd\u003e付费席按规定入场，或在指定一般区等待、休息。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e18:00—19:00\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e花火大会。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:00—19:30 后\u003c/td\u003e\n\u003ctd\u003e按现场指引分散离场，视拥堵决定何时步行出发。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e21:00—22:00 左右\u003c/td\u003e\n\u003ctd\u003e作为回酒店的规划范围；严重拥堵时可能更晚。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e这天预留的是整个下午和晚上，不只是放烟花的一小时。\u003c/strong\u003e SHIBUYA SKY 不是必去；很想上就选上午，替换部分涩谷购物，不叠加下午或日落票。\u003c/p\u003e\n\u003ch3\u003e1. 观览位置：提前选定，不现场巡回找“穴场”\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e选择\u003c/th\u003e\n\u003cth\u003e使用原则\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e付费观览席\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e先确认具体会场、入口、座位和取票方式。单人椅席当前标价 \u003cstrong\u003e6,500／人\u003c/strong\u003e，双人椅席 \u003cstrong\u003e14,000／对\u003c/strong\u003e，手续费另看订单；未核实时余票。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e一般观览区\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e只采用当年官方图标出的可入场区域，遵守站立区、通道与铺垫规则，不承诺随到随有好位置。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e原稿的几个公园\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e不把二子玉川公园、兵库岛、上野毛自然公园、等々力绿地一概当作“免费、空、人少、散场快”的保证。部分区域有收费观览安排或管制。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e票价和观览区以\u003ca href=\"https://www.city.setagaya.lg.jp/02219/26491.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e世田谷官方售票说明\u003c/a\u003e、\u003ca href=\"https://tamagawa-hanabi.com/seat/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e大会座位说明\u003c/a\u003e为准。购买两张单人票不等于已经保证连座，需看实际选座和票面。\u003c/p\u003e\n\u003ch3\u003e2. 入场与物品\u003c/h3\u003e\n\u003cp\u003e付费席当前说明 \u003cstrong\u003e15:00 起入场\u003c/strong\u003e，需按流程在 \u003cstrong\u003e7-Eleven 领取实体票\u003c/strong\u003e；不要只带订单截图。购买后变更、主动取消及大会取消后的退款，都按官方票规，不能默认免费退。\u003ca href=\"https://tamagawa-hanabi.com/seat/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e票券规则\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e一般区铺野餐垫须遵守\u003cstrong\u003e当日 14:00 以后\u003c/strong\u003e等规则，不早上铺满位置后离场逛街。准备饮水、便携食物、充电宝、轻便外套、垃圾袋；使用垫子和摄影器材不挡通道或他人视线。\u003ca href=\"https://tamagawa-hanabi.com/manner/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e现场规则\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e提前保存票面、会场图和返程路线；到场后不把手机网络始终通畅当成前提。\u003c/p\u003e\n\u003ch3\u003e3. 去程不要卡在开场前\u003c/h3\u003e\n\u003cp\u003e官方提示，临近开场时车站到会场可能耗时\u003cstrong\u003e超过 90 分钟\u003c/strong\u003e。因此本版 13:00 左右就从涩谷出发，不能把“16:30 到二子玉川站”当作稳妥方案。\u003ca href=\"https://tamagawa-hanabi.com/venue/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e会场交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e入场按当年开放入口和现场指引走；地图 App 的最短路径不一定能穿过管制区。不要临时横穿河流两岸，以免遇到桥面通行限制。\u003ca href=\"https://tamagawa-hanabi.com/wp-content/uploads/2026/06/%E4%BA%A4%E9%80%9A%E8%A6%8F%E5%88%B6%E3%81%A8%E5%BE%92%E6%AD%A9%E3%83%AB%E3%83%BC%E3%83%88%E6%A1%88%E5%86%85%E5%9B%B3.pdf\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方交通图\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e4. 散场：把用贺站当作分流备选\u003c/h3\u003e\n\u003cp\u003e官方专门给出前往 \u003cstrong\u003e用賀駅／用贺站\u003c/strong\u003e的步行分流路线，参考约 \u003cstrong\u003e30 分钟\u003c/strong\u003e；拥堵、出场位置、体力会额外增加时间，不是保证半小时进站。\u003ca href=\"https://tamagawa-hanabi.com/wp-content/uploads/2026/06/%E4%BA%A4%E9%80%9A%E8%A6%8F%E5%88%B6%E3%81%A8%E5%BE%92%E6%AD%A9%E3%83%AB%E3%83%BC%E3%83%88%E6%A1%88%E5%86%85%E5%9B%B3.pdf\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e分流路线图\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e可采用：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e会场 → 按指引经吉沢口／華火橋口等适用出口 → 用贺站 → 田园都市线／直通半藏门线 → 青山一丁目 → 大江户线 → 大门站 A2 出口 → 步行约 2 分钟 → 滨松町名铁酒店。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e车站至酒店的末段按新酒店位置更新；需要电梯时可用 A1 出口，步行约 3 分钟。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e二子玉川站也可作为返程选项，但不要认为它距离近就一定最快。不要把出租车设为可靠的散场捷径，也不预订烟花结束后的固定时间餐厅、展望台或其他活动。\u003ca href=\"https://tamagawa-hanabi.com/traffic/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e交通管制\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e5. 当天取消怎么办\u003c/h3\u003e\n\u003cp\u003e官方会在当天早上 \u003cstrong\u003e07:00 前作出一次举办判断\u003c/strong\u003e，之后也可能因天气变化取消，仍要持续查看公告。\u003ca href=\"https://tamagawa-hanabi.com/seat/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方票券与取消说明\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e提前决定不看且天气适合户外\u003c/strong\u003e：改用后面的 B 版，重排皇居和涩谷。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e临时因恶劣天气取消\u003c/strong\u003e：改为涩谷室内商场、餐饮和休息；不是自动去屋顶展望台。\u003c/li\u003e\n\u003cli\u003e已买 SHIBUYA SKY 或烟花票时，按各自票规处理，不假设当日能随意改票或临时买到日落场。\u003c/li\u003e\n\u003c/ul\u003e\n", "plain": "官方已公布 2026/10/3，18:00—19:00 举办世田谷区多摩川花火大会，主会场为二子玉川绿地运动场，恶劣天气取消。 大会信息 建议时间 安排 09:30—12:00 涩谷十字路口、八公、街区和商场，轻装活动。 12:00—13:00 午餐，补水和简单食物，提前上厕所。 13:00 左右 从涩谷乘田园都市线前往二子玉川。 14:00—15:00 按选定会场入口步行和排队，不临时换岸找位置。 15:00—17:30 付费席按规定入场，或在指定一般区等待、休息。 18:00—19:00 花火大会。 19:00—19:30 后 按现场指引分散离场，视拥堵决定何时步行出发。 21:00—22:00 左右 作为回酒店的规划范围；严重拥堵时可能更晚。 这天预留的是整个下午和晚上，不只是放烟花的一小时。 SHIBUYA SKY 不是必去；很想上就选上午，替换部分涩谷购物，不叠加下午或日落票。 1. 观览位置：提前选定，不现场巡回找“穴场” 选择 使用原则 付费观览席 先确认具体会场、入口、座位和取票方式。单人椅席当前标价 6,500／人 ，双人椅席 14,000／对 ，手续费另看订单；未核实时余票。 一般观览区 只采用当年官方图标出的可入场区域，遵守站立区、通道与铺垫规则，不承诺随到随有好位置。 原稿的几个公园 不把二子玉川公园、兵库岛、上野毛自然公园、等々力绿地一概当作“免费、空、人少、散场快”的保证。部分区域有收费观览安排或管制。 票价和观览区以 世田谷官方售票说明 、 大会座位说明 为准。购买两张单人票不等于已经保证连座，需看实际选座和票面。 2. 入场与物品 付费席当前说明 15:00 起入场 ，需按流程在 7-Eleven 领取实体票 ；不要只带订单截图。购买后变更、主动取消及大会取消后的退款，都按官方票规，不能默认免费退。 票券规则 一般区铺野餐垫须遵守 当日 14:00 以后 等规则，不早上铺满位置后离场逛街。准备饮水、便携食物、充电宝、轻便外套、垃圾袋；使用垫子和摄影器材不挡通道或他人视线。 现场规则 提前保存票面、会场图和返程路线；到场后不把手机网络始终通畅当成前提。 3. 去程不要卡在开场前 官方提示，临近开场时车站到会场可能耗时 超过 90 分钟 。因此本版 13:00 左右就从涩谷出发，不能把“16:30 到二子玉川站”当作稳妥方案。 会场交通 入场按当年开放入口和现场指引走；地图 App 的最短路径不一定能穿过管制区。不要临时横穿河流两岸，以免遇到桥面通行限制。 官方交通图 4. 散场：把用贺站当作分流备选 官方专门给出前往 用賀駅／用贺站 的步行分流路线，参考约 30 分钟 ；拥堵、出场位置、体力会额外增加时间，不是保证半小时进站。 分流路线图 可采用： 会场 → 按指引经吉沢口／華火橋口等适用出口 → 用贺站 → 田园都市线／直通半藏门线 → 青山一丁目 → 大江户线 → 大门站 A2 出口 → 步行约 2 分钟 → 滨松町名铁酒店。 车站至酒店的末段按新酒店位置更新；需要电梯时可用 A1 出口，步行约 3 分钟。 酒店交通 二子玉川站也可作为返程选项，但不要认为它距离近就一定最快。不要把出租车设为可靠的散场捷径，也不预订烟花结束后的固定时间餐厅、展望台或其他活动。 交通管制 5. 当天取消怎么办 官方会在当天早上 07:00 前作出一次举办判断 ，之后也可能因天气变化取消，仍要持续查看公告。 官方票券与取消说明 提前决定不看且天气适合户外 ：改用后面的 B 版，重排皇居和涩谷。 临时因恶劣天气取消 ：改为涩谷室内商场、餐饮和休息；不是自动去屋顶展望台。 已买 SHIBUYA SKY 或烟花票时，按各自票规处理，不假设当日能随意改票或临时买到日落场。"}, {"id": "source-14", "title": "Day 10A｜10/4 周日：皇居 → 浅草 → 银座", "markdown": "**住：滨松町名铁酒店；今晚完成行李整理。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 09:00—10:15 | 皇居东御苑，选主要步道，不走遍全园。 |\n| 10:15—11:00 | 前往浅草。 |\n| 11:00—13:00 | 浅草寺、仲见世、午餐。 |\n| 13:00—13:30 | 隅田川边短走，远眺晴空塔。 |\n| 14:30—18:00 | 银座购物、晚餐。 |\n| 19:00—20:00 | 回酒店、整理行李、确认次日机场路线。 |\n\n宫内厅当前日历显示 **10/3、10/4 东御苑开放，10/2、10/5 休园**，临时安排仍需查看公告。[开放日历][imperial]\n\n**疲惫时的删减顺序：先删皇居，再减少浅草支线；保留回酒店收行李的时间。** 晴空塔这版只远眺，不登塔；东京塔外观已放到 10/2，不再重复跑。", "html": "\u003cp\u003e\u003cstrong\u003e住：滨松町名铁酒店；今晚完成行李整理。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:00—10:15\u003c/td\u003e\n\u003ctd\u003e皇居东御苑，选主要步道，不走遍全园。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:15—11:00\u003c/td\u003e\n\u003ctd\u003e前往浅草。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00—13:00\u003c/td\u003e\n\u003ctd\u003e浅草寺、仲见世、午餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—13:30\u003c/td\u003e\n\u003ctd\u003e隅田川边短走，远眺晴空塔。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:30—18:00\u003c/td\u003e\n\u003ctd\u003e银座购物、晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:00—20:00\u003c/td\u003e\n\u003ctd\u003e回酒店、整理行李、确认次日机场路线。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e宫内厅当前日历显示 \u003cstrong\u003e10/3、10/4 东御苑开放，10/2、10/5 休园\u003c/strong\u003e，临时安排仍需查看公告。\u003ca href=\"https://www.kunaicho.go.jp/visit/higashigyoen/gyoen-close.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e开放日历\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e疲惫时的删减顺序：先删皇居，再减少浅草支线；保留回酒店收行李的时间。\u003c/strong\u003e 晴空塔这版只远眺，不登塔；东京塔外观已放到 10/2，不再重复跑。\u003c/p\u003e\n", "plain": "住：滨松町名铁酒店；今晚完成行李整理。 建议时间 安排 09:00—10:15 皇居东御苑，选主要步道，不走遍全园。 10:15—11:00 前往浅草。 11:00—13:00 浅草寺、仲见世、午餐。 13:00—13:30 隅田川边短走，远眺晴空塔。 14:30—18:00 银座购物、晚餐。 19:00—20:00 回酒店、整理行李、确认次日机场路线。 宫内厅当前日历显示 10/3、10/4 东御苑开放，10/2、10/5 休园 ，临时安排仍需查看公告。 开放日历 疲惫时的删减顺序：先删皇居，再减少浅草支线；保留回酒店收行李的时间。 晴空塔这版只远眺，不登塔；东京塔外观已放到 10/2，不再重复跑。"}, {"id": "source-15", "title": "六、东京 B 版：不看烟花", "markdown": "**10/2 不变；10/3、10/4 用本节替换 A 版。**  \n把皇居移到 10/3 上午，10/4 才能给浅草、晴空塔和银座留出完整时段。", "html": "\u003cp\u003e\u003cstrong\u003e10/2 不变；10/3、10/4 用本节替换 A 版。\u003c/strong\u003e\u003cbr/\u003e\n把皇居移到 10/3 上午，10/4 才能给浅草、晴空塔和银座留出完整时段。\u003c/p\u003e\n", "plain": "10/2 不变；10/3、10/4 用本节替换 A 版。 把皇居移到 10/3 上午，10/4 才能给浅草、晴空塔和银座留出完整时段。"}, {"id": "source-16", "title": "Day 9B｜10/3 周六：皇居 → 涩谷 → SHIBUYA SKY", "markdown": "| 建议时间 | 安排 |\n|---|---|\n| 09:00—10:30 | 皇居东御苑。 |\n| 10:30—11:30 | 前往涩谷。 |\n| 11:30—15:30 | 午餐、街区、商场，中间留休息时间。 |\n| 16:00—17:30 | SHIBUYA SKY，按实际预约入场时间调整。 |\n| 18:00—19:30 | 晚餐，继续逛街或回酒店。 |\n| 20:00 左右 | 回酒店。 |\n\nSHIBUYA SKY 当前官方网络票通常销售未来**两周**的时段；网页售罄时不能默认窗口有票。成人网络票目前按入场时间区分：**15:00 前 2,700 日元，15:00 起 3,400 日元**；以购买页面为准。[官方门票][shibuya-sky]\n\n屋顶可能因降雨、强风等关闭，是否退改按票规。16 点左右只是本版的参观建议，不保证晴天、日落效果或一定有余票。\n\n**B 版不是完整暴雨预案。** 天气差时改为室内购物、吃饭和休息，不坚持屋顶或长距离露天散步。", "html": "\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:00—10:30\u003c/td\u003e\n\u003ctd\u003e皇居东御苑。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:30—11:30\u003c/td\u003e\n\u003ctd\u003e前往涩谷。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:30—15:30\u003c/td\u003e\n\u003ctd\u003e午餐、街区、商场，中间留休息时间。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—17:30\u003c/td\u003e\n\u003ctd\u003eSHIBUYA SKY，按实际预约入场时间调整。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e18:00—19:30\u003c/td\u003e\n\u003ctd\u003e晚餐，继续逛街或回酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e20:00 左右\u003c/td\u003e\n\u003ctd\u003e回酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eSHIBUYA SKY 当前官方网络票通常销售未来\u003cstrong\u003e两周\u003c/strong\u003e的时段；网页售罄时不能默认窗口有票。成人网络票目前按入场时间区分：\u003cstrong\u003e15:00 前 2,700 日元，15:00 起 3,400 日元\u003c/strong\u003e；以购买页面为准。\u003ca href=\"https://www.shibuya-scramble-square.com/sky/ticket/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方门票\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e屋顶可能因降雨、强风等关闭，是否退改按票规。16 点左右只是本版的参观建议，不保证晴天、日落效果或一定有余票。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eB 版不是完整暴雨预案。\u003c/strong\u003e 天气差时改为室内购物、吃饭和休息，不坚持屋顶或长距离露天散步。\u003c/p\u003e\n", "plain": "建议时间 安排 09:00—10:30 皇居东御苑。 10:30—11:30 前往涩谷。 11:30—15:30 午餐、街区、商场，中间留休息时间。 16:00—17:30 SHIBUYA SKY，按实际预约入场时间调整。 18:00—19:30 晚餐，继续逛街或回酒店。 20:00 左右 回酒店。 SHIBUYA SKY 当前官方网络票通常销售未来 两周 的时段；网页售罄时不能默认窗口有票。成人网络票目前按入场时间区分： 15:00 前 2,700 日元，15:00 起 3,400 日元 ；以购买页面为准。 官方门票 屋顶可能因降雨、强风等关闭，是否退改按票规。16 点左右只是本版的参观建议，不保证晴天、日落效果或一定有余票。 B 版不是完整暴雨预案。 天气差时改为室内购物、吃饭和休息，不坚持屋顶或长距离露天散步。"}, {"id": "source-17", "title": "Day 10B｜10/4 周日：浅草 → 晴空塔 → 银座", "markdown": "| 建议时间 | 安排 |\n|---|---|\n| 09:00—11:00 | 浅草寺、仲见世街区。 |\n| 11:00—11:30 | 前往晴空塔。 |\n| 11:30—13:30 | 晴空塔／Solamachi、午餐；登塔按预约时间。 |\n| 14:30—18:00 | 银座购物、晚餐。 |\n| 19:00—20:00 | 回酒店收行李，早点休息。 |\n\n**登晴空塔是可选，不是必须。** 已上过 SHIBUYA SKY、对第二个高处视角兴趣一般，就只逛商场、看外观。门票按到访日期与所选展望层核价，不沿用原稿的固定旧价格。\n\n### A、B 版的主要差别\n\n| 项目 | A：看烟花 | B：不看烟花 |\n|---|---|---|\n| 10/3 上午 | 涩谷 | 皇居东御苑 |\n| 10/3 下午、晚上 | 进场、等待、花火、分流返程 | 涩谷、SHIBUYA SKY、晚餐 |\n| 10/4 | 皇居 → 浅草 → 银座 | 浅草 → 晴空塔 → 银座 |\n| SHIBUYA SKY | 默认不安排；上午可替换购物 | 预约下午时段 |\n| 晴空塔 | 远眺，不登塔 | 可选登塔 |\n| 节奏 | 等候、散场更耗时，次日允许删皇居 | 市区参观与购物更从容 |", "html": "\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:00—11:00\u003c/td\u003e\n\u003ctd\u003e浅草寺、仲见世街区。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00—11:30\u003c/td\u003e\n\u003ctd\u003e前往晴空塔。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:30—13:30\u003c/td\u003e\n\u003ctd\u003e晴空塔／Solamachi、午餐；登塔按预约时间。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:30—18:00\u003c/td\u003e\n\u003ctd\u003e银座购物、晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:00—20:00\u003c/td\u003e\n\u003ctd\u003e回酒店收行李，早点休息。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e登晴空塔是可选，不是必须。\u003c/strong\u003e 已上过 SHIBUYA SKY、对第二个高处视角兴趣一般，就只逛商场、看外观。门票按到访日期与所选展望层核价，不沿用原稿的固定旧价格。\u003c/p\u003e\n\u003ch3\u003eA、B 版的主要差别\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e项目\u003c/th\u003e\n\u003cth\u003eA：看烟花\u003c/th\u003e\n\u003cth\u003eB：不看烟花\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/3 上午\u003c/td\u003e\n\u003ctd\u003e涩谷\u003c/td\u003e\n\u003ctd\u003e皇居东御苑\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/3 下午、晚上\u003c/td\u003e\n\u003ctd\u003e进场、等待、花火、分流返程\u003c/td\u003e\n\u003ctd\u003e涩谷、SHIBUYA SKY、晚餐\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/4\u003c/td\u003e\n\u003ctd\u003e皇居 → 浅草 → 银座\u003c/td\u003e\n\u003ctd\u003e浅草 → 晴空塔 → 银座\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSHIBUYA SKY\u003c/td\u003e\n\u003ctd\u003e默认不安排；上午可替换购物\u003c/td\u003e\n\u003ctd\u003e预约下午时段\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e晴空塔\u003c/td\u003e\n\u003ctd\u003e远眺，不登塔\u003c/td\u003e\n\u003ctd\u003e可选登塔\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e节奏\u003c/td\u003e\n\u003ctd\u003e等候、散场更耗时，次日允许删皇居\u003c/td\u003e\n\u003ctd\u003e市区参观与购物更从容\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n", "plain": "建议时间 安排 09:00—11:00 浅草寺、仲见世街区。 11:00—11:30 前往晴空塔。 11:30—13:30 晴空塔／Solamachi、午餐；登塔按预约时间。 14:30—18:00 银座购物、晚餐。 19:00—20:00 回酒店收行李，早点休息。 登晴空塔是可选，不是必须。 已上过 SHIBUYA SKY、对第二个高处视角兴趣一般，就只逛商场、看外观。门票按到访日期与所选展望层核价，不沿用原稿的固定旧价格。 A、B 版的主要差别 项目 A：看烟花 B：不看烟花 10/3 上午 涩谷 皇居东御苑 10/3 下午、晚上 进场、等待、花火、分流返程 涩谷、SHIBUYA SKY、晚餐 10/4 皇居 → 浅草 → 银座 浅草 → 晴空塔 → 银座 SHIBUYA SKY 默认不安排；上午可替换购物 预约下午时段 晴空塔 远眺，不登塔 可选登塔 节奏 等候、散场更耗时，次日允许删皇居 市区参观与购物更从容"}, {"id": "source-18", "title": "七、Day 11｜10/5 周一：直接去羽田", "markdown": "**本节只适用于本版采用的 JL029／羽田早班回程。** 出发前再次对照电子机票；原稿 JL735 成田傍晚的路线不能套到这里。\n\n| 建议时间 | 安排 |\n|---|---|\n| 05:30—06:00 | 起床、最后检查行李，简单早餐。 |\n| **06:15 左右** | 退房，离开滨松町名铁酒店。 |\n| 06:15—07:00 左右 | 步行去东京单轨电车滨松町站，乘车至羽田机场第 3 航站楼；另留进站、上楼与候车时间。 |\n| 06:45—07:00 左右 | 目标抵达航站楼，办理值机、托运、安检。 |\n| 09:55 | 按前文 JL029 时间起飞；最终以电子机票及航司通知为准。 |\n\n滨松町名铁酒店至东京单轨电车滨松町站，官网参考步行约 **4 分钟**；清晨拖箱另留进站、上楼与候车时间，继续保留 **06:15 左右出发**的安排，别把列车行驶时间当作酒店到柜台的全部时间。[酒店交通][hotel-meitetsu] JAL 羽田国际线手续使用第 3 航站楼，仍应检查航司当天通知。[JAL 羽田信息][jal-hnd]\n\n10/4 晚上完成行李整理、确认交通和支付方式。**10/5 不安排芝公园、不去东京站补购物，也不去成田。**", "html": "\u003cp\u003e\u003cstrong\u003e本节只适用于本版采用的 JL029／羽田早班回程。\u003c/strong\u003e 出发前再次对照电子机票；原稿 JL735 成田傍晚的路线不能套到这里。\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e05:30—06:00\u003c/td\u003e\n\u003ctd\u003e起床、最后检查行李，简单早餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e06:15 左右\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e退房，离开滨松町名铁酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e06:15—07:00 左右\u003c/td\u003e\n\u003ctd\u003e步行去东京单轨电车滨松町站，乘车至羽田机场第 3 航站楼；另留进站、上楼与候车时间。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e06:45—07:00 左右\u003c/td\u003e\n\u003ctd\u003e目标抵达航站楼，办理值机、托运、安检。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:55\u003c/td\u003e\n\u003ctd\u003e按前文 JL029 时间起飞；最终以电子机票及航司通知为准。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e滨松町名铁酒店至东京单轨电车滨松町站，官网参考步行约 \u003cstrong\u003e4 分钟\u003c/strong\u003e；清晨拖箱另留进站、上楼与候车时间，继续保留 \u003cstrong\u003e06:15 左右出发\u003c/strong\u003e的安排，别把列车行驶时间当作酒店到柜台的全部时间。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店交通\u003c/a\u003e JAL 羽田国际线手续使用第 3 航站楼，仍应检查航司当天通知。\u003ca href=\"https://www.jal.co.jp/jp/ja/inter/airport/hnd/info/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJAL 羽田信息\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e10/4 晚上完成行李整理、确认交通和支付方式。\u003cstrong\u003e10/5 不安排芝公园、不去东京站补购物，也不去成田。\u003c/strong\u003e\u003c/p\u003e\n", "plain": "本节只适用于本版采用的 JL029／羽田早班回程。 出发前再次对照电子机票；原稿 JL735 成田傍晚的路线不能套到这里。 建议时间 安排 05:30—06:00 起床、最后检查行李，简单早餐。 06:15 左右 退房，离开滨松町名铁酒店。 06:15—07:00 左右 步行去东京单轨电车滨松町站，乘车至羽田机场第 3 航站楼；另留进站、上楼与候车时间。 06:45—07:00 左右 目标抵达航站楼，办理值机、托运、安检。 09:55 按前文 JL029 时间起飞；最终以电子机票及航司通知为准。 滨松町名铁酒店至东京单轨电车滨松町站，官网参考步行约 4 分钟 ；清晨拖箱另留进站、上楼与候车时间，继续保留 06:15 左右出发 的安排，别把列车行驶时间当作酒店到柜台的全部时间。 酒店交通 JAL 羽田国际线手续使用第 3 航站楼，仍应检查航司当天通知。 JAL 羽田信息 10/4 晚上完成行李整理、确认交通和支付方式。 10/5 不安排芝公园、不去东京站补购物，也不去成田。"}, {"id": "source-19", "title": "八、预算：把确定单价与未定项目分开", "markdown": "### 1. 已有依据的交通单价\n\n金额为成人每人，普通纸票与 IC 可能有小额差异。**特急列车总价不能只用下面的基本运费。**\n\n| 项目 | 参考金额 | 是否已包括在其他项目中 |\n|---|---:|---|\n| 成田 → 镰仓普通 JR | 约 2,420 | 独立一笔，不另拆东京换乘费用。 |\n| 9/26 江之电一日券 | 800 | 当日适用乘车，不含餐饮。 |\n| 镰仓 → 小田原 JR | 约 810，沿用 review 参考，购票复核 | 不在箱根周游券内。 |\n| 箱根三日周游券 | 6,400 | 包括适用范围内的箱根交通，不再逐段重复相加。 |\n| 小田原 → 伊豆高原基本运费 | 1,470 | 乘踊り子另加特急费；从箱根转场只算一次。 |\n| 伊豆高原 → 热川 | 470 | 9/29 入住段。 |\n| 热川 ↔ 伊豆高原 | 往返 940 | 9/30；巴士另计。 |\n| 热川 ↔ 河津 | 往返 1,120 | 10/1 默认方案；七滝巴士另计。 |\n| 热川 ↔ 稻取 | 往返 560 | 仅选择 10/2 稻取替换方案时加入。 |\n| 伊豆高原巴士两日券 | 9 月销售价 1,800；10/1 起 2,150 | 选券后不再把已覆盖的单程巴士全加一次。 |\n\n依据：[机场查询][airport-fare]、[江之电][enoden-pass]、[箱根周游券][hakone-pass]、[伊豆急运价][izu-fare]、[东海巴士][tokai-pass]。镰仓到小田原的 810 日元是 review 的参考值，不是已购买票价。\n\n**尚未锁定的交通费用**：踊り子附加费、10/1 具体巴士、伊豆到品川的最终票价、东京市内和羽田交通、寄存柜及偶发出租车。路线与席别确定后统一补入，本文不把未定项目藏进一个看似精确的全程总价。\n\n### 2. 景点与可选项目\n\n| 项目 | 成人参考价 | 本版位置 |\n|---|---:|---|\n| 长谷寺 | 400 | 9/26 主线 |\n| 镰仓大佛 | 300；胎内另 50 | 9/26 主线／附加可选 |\n| 江之岛岩屋 | 500 | 与登塔取舍，不一定加入 |\n| 雕刻之森 | 网上 1,800；现场 2,000 | 9/27 主线 |\n| 大室山缆椅 | 往返 1,000 | 9/30 主线 |\n| 仙人掌动物公园 | 平日 2,800；周末及指定假期 3,000 | 9/30，按实际票种 |\n| 黒根岩 | 700 | 10/1 替换方案 |\n| 稻取雛之馆 | 500 | 10/2 替换方案 |\n| 多摩川花火单人椅席 | 6,500＋适用手续费 | A 版可选付费席 |\n| SHIBUYA SKY 网络成人票 | 15:00 前 2,700；15:00 起 3,400 | B 版默认下午，A 版上午可替换购物 |\n\n上述价格的官方链接见各日正文。**仅长谷寺、大佛外部、美术馆、大室山、动物公园五项合计约 6,300—6,500 日元／人**，按动物公园平日普通票、无额外体验计算。这个小计不是全程门票总额，不包含御苑、岩屋、登塔、烟花等其他选择，也未套用任何可叠加优惠。\n\n新宿御苑、江之岛灯塔、晴空塔等按最终到访项目与票种购票；不使用原稿里未经确认的旧价。餐饮、购物、住宿、温泉税、寄存和保险均不混入上述小计。\n\n### 3. 餐饮与现金的规划方式\n\n原稿注明箱根两晚、热川三晚包含早晚餐；实际先核对订单，不在外面再安排同一晚的固定餐厅。白天午餐给出行留余量，不为打卡店错过车。\n\n**现金可先按每位成人约 10,000—15,000 日元的备用额准备**，这是规划建议，不是实际必需支出。结合卡片能否使用和日常花费补充，不把所有寺庙、温泉、动物公园统称“只收现金”。交通卡余额、实体卡或手机支持情况在出发前自行确认。", "html": "\u003ch3\u003e1. 已有依据的交通单价\u003c/h3\u003e\n\u003cp\u003e金额为成人每人，普通纸票与 IC 可能有小额差异。\u003cstrong\u003e特急列车总价不能只用下面的基本运费。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e项目\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003e参考金额\u003c/th\u003e\n\u003cth\u003e是否已包括在其他项目中\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e成田 → 镰仓普通 JR\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 2,420\u003c/td\u003e\n\u003ctd\u003e独立一笔，不另拆东京换乘费用。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/26 江之电一日券\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e800\u003c/td\u003e\n\u003ctd\u003e当日适用乘车，不含餐饮。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓 → 小田原 JR\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 810，沿用 review 参考，购票复核\u003c/td\u003e\n\u003ctd\u003e不在箱根周游券内。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根三日周游券\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e6,400\u003c/td\u003e\n\u003ctd\u003e包括适用范围内的箱根交通，不再逐段重复相加。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e小田原 → 伊豆高原基本运费\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e1,470\u003c/td\u003e\n\u003ctd\u003e乘踊り子另加特急费；从箱根转场只算一次。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆高原 → 热川\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e470\u003c/td\u003e\n\u003ctd\u003e9/29 入住段。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e热川 ↔ 伊豆高原\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e往返 940\u003c/td\u003e\n\u003ctd\u003e9/30；巴士另计。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e热川 ↔ 河津\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e往返 1,120\u003c/td\u003e\n\u003ctd\u003e10/1 默认方案；七滝巴士另计。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e热川 ↔ 稻取\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e往返 560\u003c/td\u003e\n\u003ctd\u003e仅选择 10/2 稻取替换方案时加入。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆高原巴士两日券\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e9 月销售价 1,800；10/1 起 2,150\u003c/td\u003e\n\u003ctd\u003e选券后不再把已覆盖的单程巴士全加一次。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e依据：\u003ca href=\"https://ekitan.com/transit/route/sf-1998/st-1865\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e机场查询\u003c/a\u003e、\u003ca href=\"https://www.enoden.co.jp/tourism/ticket/noriorikun/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e江之电\u003c/a\u003e、\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e箱根周游券\u003c/a\u003e、\u003ca href=\"https://www.izukyu.co.jp/fares/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e伊豆急运价\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/ito_kanko_freepass.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东海巴士\u003c/a\u003e。镰仓到小田原的 810 日元是 review 的参考值，不是已购买票价。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e尚未锁定的交通费用\u003c/strong\u003e：踊り子附加费、10/1 具体巴士、伊豆到品川的最终票价、东京市内和羽田交通、寄存柜及偶发出租车。路线与席别确定后统一补入，本文不把未定项目藏进一个看似精确的全程总价。\u003c/p\u003e\n\u003ch3\u003e2. 景点与可选项目\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e项目\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003e成人参考价\u003c/th\u003e\n\u003cth\u003e本版位置\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e长谷寺\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e400\u003c/td\u003e\n\u003ctd\u003e9/26 主线\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓大佛\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e300；胎内另 50\u003c/td\u003e\n\u003ctd\u003e9/26 主线／附加可选\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e江之岛岩屋\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e500\u003c/td\u003e\n\u003ctd\u003e与登塔取舍，不一定加入\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e雕刻之森\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e网上 1,800；现场 2,000\u003c/td\u003e\n\u003ctd\u003e9/27 主线\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e大室山缆椅\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e往返 1,000\u003c/td\u003e\n\u003ctd\u003e9/30 主线\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e仙人掌动物公园\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e平日 2,800；周末及指定假期 3,000\u003c/td\u003e\n\u003ctd\u003e9/30，按实际票种\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e黒根岩\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e700\u003c/td\u003e\n\u003ctd\u003e10/1 替换方案\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e稻取雛之馆\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e500\u003c/td\u003e\n\u003ctd\u003e10/2 替换方案\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e多摩川花火单人椅席\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e6,500＋适用手续费\u003c/td\u003e\n\u003ctd\u003eA 版可选付费席\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSHIBUYA SKY 网络成人票\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e15:00 前 2,700；15:00 起 3,400\u003c/td\u003e\n\u003ctd\u003eB 版默认下午，A 版上午可替换购物\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e上述价格的官方链接见各日正文。\u003cstrong\u003e仅长谷寺、大佛外部、美术馆、大室山、动物公园五项合计约 6,300—6,500 日元／人\u003c/strong\u003e，按动物公园平日普通票、无额外体验计算。这个小计不是全程门票总额，不包含御苑、岩屋、登塔、烟花等其他选择，也未套用任何可叠加优惠。\u003c/p\u003e\n\u003cp\u003e新宿御苑、江之岛灯塔、晴空塔等按最终到访项目与票种购票；不使用原稿里未经确认的旧价。餐饮、购物、住宿、温泉税、寄存和保险均不混入上述小计。\u003c/p\u003e\n\u003ch3\u003e3. 餐饮与现金的规划方式\u003c/h3\u003e\n\u003cp\u003e原稿注明箱根两晚、热川三晚包含早晚餐；实际先核对订单，不在外面再安排同一晚的固定餐厅。白天午餐给出行留余量，不为打卡店错过车。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e现金可先按每位成人约 10,000—15,000 日元的备用额准备\u003c/strong\u003e，这是规划建议，不是实际必需支出。结合卡片能否使用和日常花费补充，不把所有寺庙、温泉、动物公园统称“只收现金”。交通卡余额、实体卡或手机支持情况在出发前自行确认。\u003c/p\u003e\n", "plain": "1. 已有依据的交通单价 金额为成人每人，普通纸票与 IC 可能有小额差异。 特急列车总价不能只用下面的基本运费。 项目 参考金额 是否已包括在其他项目中 成田 → 镰仓普通 JR 约 2,420 独立一笔，不另拆东京换乘费用。 9/26 江之电一日券 800 当日适用乘车，不含餐饮。 镰仓 → 小田原 JR 约 810，沿用 review 参考，购票复核 不在箱根周游券内。 箱根三日周游券 6,400 包括适用范围内的箱根交通，不再逐段重复相加。 小田原 → 伊豆高原基本运费 1,470 乘踊り子另加特急费；从箱根转场只算一次。 伊豆高原 → 热川 470 9/29 入住段。 热川 ↔ 伊豆高原 往返 940 9/30；巴士另计。 热川 ↔ 河津 往返 1,120 10/1 默认方案；七滝巴士另计。 热川 ↔ 稻取 往返 560 仅选择 10/2 稻取替换方案时加入。 伊豆高原巴士两日券 9 月销售价 1,800；10/1 起 2,150 选券后不再把已覆盖的单程巴士全加一次。 依据： 机场查询 、 江之电 、 箱根周游券 、 伊豆急运价 、 东海巴士 。镰仓到小田原的 810 日元是 review 的参考值，不是已购买票价。 尚未锁定的交通费用 ：踊り子附加费、10/1 具体巴士、伊豆到品川的最终票价、东京市内和羽田交通、寄存柜及偶发出租车。路线与席别确定后统一补入，本文不把未定项目藏进一个看似精确的全程总价。 2. 景点与可选项目 项目 成人参考价 本版位置 长谷寺 400 9/26 主线 镰仓大佛 300；胎内另 50 9/26 主线／附加可选 江之岛岩屋 500 与登塔取舍，不一定加入 雕刻之森 网上 1,800；现场 2,000 9/27 主线 大室山缆椅 往返 1,000 9/30 主线 仙人掌动物公园 平日 2,800；周末及指定假期 3,000 9/30，按实际票种 黒根岩 700 10/1 替换方案 稻取雛之馆 500 10/2 替换方案 多摩川花火单人椅席 6,500＋适用手续费 A 版可选付费席 SHIBUYA SKY 网络成人票 15:00 前 2,700；15:00 起 3,400 B 版默认下午，A 版上午可替换购物 上述价格的官方链接见各日正文。 仅长谷寺、大佛外部、美术馆、大室山、动物公园五项合计约 6,300—6,500 日元／人 ，按动物公园平日普通票、无额外体验计算。这个小计不是全程门票总额，不包含御苑、岩屋、登塔、烟花等其他选择，也未套用任何可叠加优惠。 新宿御苑、江之岛灯塔、晴空塔等按最终到访项目与票种购票；不使用原稿里未经确认的旧价。餐饮、购物、住宿、温泉税、寄存和保险均不混入上述小计。 3. 餐饮与现金的规划方式 原稿注明箱根两晚、热川三晚包含早晚餐；实际先核对订单，不在外面再安排同一晚的固定餐厅。白天午餐给出行留余量，不为打卡店错过车。 现金可先按每位成人约 10,000—15,000 日元的备用额准备 ，这是规划建议，不是实际必需支出。结合卡片能否使用和日常花费补充，不把所有寺庙、温泉、动物公园统称“只收现金”。交通卡余额、实体卡或手机支持情况在出发前自行确认。"}, {"id": "source-20", "title": "九、行李、交通衔接与天气：现场用这一页", "markdown": "### 1. 四个行李节点\n\n| 日期 | 默认安排 | 失败时怎么改 |\n|---|---|---|\n| **9/27 镰仓退房** | 问酒店是否可短时寄存，逛完取走 | 收费接受与否自行决定；不假设免费。 |\n| **9/27 箱根上山前** | 汤本站适用寄存设施，或先去酒店询问 | 有额外往返就缩短美术馆，不推迟到酒店的底线。 |\n| **9/29 伊豆高原** | 存箱子，轻装海岸短线 | 无合适柜位就去热川，海岸换到 10/1 或取消。 |\n| **10/2 进东京／稻取备选** | 默认到滨松町名铁酒店前台寄存；稻取版先问热川酒店 | 不拖大件去稻取散步；未解决行李就取消稻取。 |\n\n### 2. 需要临近乘车日期填写的交通表\n\n下面“计划／下一班”尚未锁定，不代表已查到或已订票。填写时同时核对日期、上下车站、方向与适用票券。\n\n| 日期 | 路段 | 当前安排 | 计划班次／下一班 |\n|---|---|---|---|\n| 9/25 | 空港第2ビル → 镰仓 | 出关后选车，17:01 直通是候选 | 当天按实际出关查询 |\n| 9/27 | 镰仓 → 大船 → 小田原 | 11:00 左右离开 | 待按日期复核 |\n| 9/29 | 小田原 → 伊豆高原 | 踊り子 1 号 10:01 → 11:02，或普通车 | 购票后填席位／普通车接续 |\n| 9/29 | 伊豆高原 ↔ 伊豆海洋公園 | 海岸巴士候选，也可用电车＋步行 | 去程：____；回程：____；下一班：____ |\n| 9/30 | 伊豆高原 ↔ シャボテン公園 | 大室山、动物公园 | 去程：____；回程：____；下一班：____ |\n| 10/1 | 河津 → 上入口；七滝 → 河津 | 仅默认七滝方案 | 去程：____；回程：____；下一班：____ |\n| 10/2 | 伊豆热川 → 品川 | 默认踊り子 2 号 10:32 → 12:40 | 购票后填席位；稻取版另查午后车 |\n| 10/5 | 滨松町 → 羽田 T3 | 以约 07:00 前到航站楼倒推 | 计划：____；备选：____ |\n\n查询入口：[JR 候选去伊豆列车][odoriko-1]／[JR 候选回东京列车][odoriko-2]／[东海巴士][tokai-search]／[东京单轨电车][monorail]。\n\n### 3. 只替换、不叠加的调整规则\n\n| 情况 | 优先处理 |\n|---|---|\n| 9/25 航班或入境延误 | 删除散步；先保证入住，接近截止时间提前联系酒店。 |\n| 9/26 江之岛超时 | 删登塔／岩屋、极乐寺短停，不再追固定海边日落。 |\n| 9/27 镰仓晚出发 | 缩短／取消美术馆。确实要补到 9/29，就把那天改为美术馆＋转场，海岸让给 10/1。 |\n| 9/28 箱根缆车或船停运 | 根据官方公告走能运行的部分，或提早回酒店。 |\n| 9/29 寄存失败或海岸不适合走 | 直接入住热川，海岸改日或取消。 |\n| 9/30 大室山天气差 | 与 10/1 互换或取消；重算巴士券，不自动换成危险的户外替代。 |\n| 10/2 决定去稻取 | 放弃早班特急和新宿御苑，东京只保留傍晚。 |\n| 10/3 不看烟花、天气正常 | 用东京 B 版。 |\n| 10/3 因恶劣天气取消烟花 | 选室内活动，不保证当天还有 SHIBUYA SKY 票，也不硬上屋顶。 |\n| 10/3 散场很晚 | 10/4 先删皇居，从浅草开始，晚上仍尽早整理行李。 |\n\n### 4. 导航时用这些日文名称\n\n| 中文 | 可复制的检索词 |\n|---|---|\n| 成田 T2 铁路站 | 空港第2ビル |\n| 镰仓／大船 | 鎌倉駅／大船駅 |\n| 镰仓高校前／长谷 | 鎌倉高校前駅／長谷駅 |\n| 箱根汤本／雕刻之森 | 箱根湯本駅／彫刻の森美術館 |\n| 早云山／大涌谷／桃源台 | 早雲山／大涌谷／桃源台 |\n| 元箱根港 | 元箱根港 |\n| 伊豆高原／热川／北川 | 伊豆高原駅／伊豆熱川駅／伊豆北川駅 |\n| 城崎海岸／门胁吊桥 | 城ヶ崎海岸／門脇つり橋 |\n| 大室山／动物公园巴士站 | 大室山／シャボテン公園 |\n| 河津七滝上入口／下游站 | 河津七滝遊歩道上入口／河津七滝 |\n| 稻取人偶馆 | 文化公園 雛の館 |\n| 滨松町名铁酒店 | 名鉄イン浜松町／Meitetsu Inn Hamamatsucho | \n| 酒店附近车站／出口 | 浜松町駅 北口／大門駅 A2出口（电梯走 A1出口） |\n| 烟花会场／分流站 | 二子玉川緑地運動場／用賀駅 |\n| 回程机场站 | 羽田空港第3ターミナル |", "html": "\u003ch3\u003e1. 四个行李节点\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e日期\u003c/th\u003e\n\u003cth\u003e默认安排\u003c/th\u003e\n\u003cth\u003e失败时怎么改\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/27 镰仓退房\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e问酒店是否可短时寄存，逛完取走\u003c/td\u003e\n\u003ctd\u003e收费接受与否自行决定；不假设免费。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/27 箱根上山前\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e汤本站适用寄存设施，或先去酒店询问\u003c/td\u003e\n\u003ctd\u003e有额外往返就缩短美术馆，不推迟到酒店的底线。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/29 伊豆高原\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e存箱子，轻装海岸短线\u003c/td\u003e\n\u003ctd\u003e无合适柜位就去热川，海岸换到 10/1 或取消。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/2 进东京／稻取备选\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e默认到滨松町名铁酒店前台寄存；稻取版先问热川酒店\u003c/td\u003e\n\u003ctd\u003e不拖大件去稻取散步；未解决行李就取消稻取。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch3\u003e2. 需要临近乘车日期填写的交通表\u003c/h3\u003e\n\u003cp\u003e下面“计划／下一班”尚未锁定，不代表已查到或已订票。填写时同时核对日期、上下车站、方向与适用票券。\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e日期\u003c/th\u003e\n\u003cth\u003e路段\u003c/th\u003e\n\u003cth\u003e当前安排\u003c/th\u003e\n\u003cth\u003e计划班次／下一班\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/25\u003c/td\u003e\n\u003ctd\u003e空港第2ビル → 镰仓\u003c/td\u003e\n\u003ctd\u003e出关后选车，17:01 直通是候选\u003c/td\u003e\n\u003ctd\u003e当天按实际出关查询\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/27\u003c/td\u003e\n\u003ctd\u003e镰仓 → 大船 → 小田原\u003c/td\u003e\n\u003ctd\u003e11:00 左右离开\u003c/td\u003e\n\u003ctd\u003e待按日期复核\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/29\u003c/td\u003e\n\u003ctd\u003e小田原 → 伊豆高原\u003c/td\u003e\n\u003ctd\u003e踊り子 1 号 10:01 → 11:02，或普通车\u003c/td\u003e\n\u003ctd\u003e购票后填席位／普通车接续\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/29\u003c/td\u003e\n\u003ctd\u003e伊豆高原 ↔ 伊豆海洋公園\u003c/td\u003e\n\u003ctd\u003e海岸巴士候选，也可用电车＋步行\u003c/td\u003e\n\u003ctd\u003e去程：\u003cstrong\u003e\u003cstrong\u003e；回程：\u003c/strong\u003e\u003c/strong\u003e；下一班：____\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/30\u003c/td\u003e\n\u003ctd\u003e伊豆高原 ↔ シャボテン公園\u003c/td\u003e\n\u003ctd\u003e大室山、动物公园\u003c/td\u003e\n\u003ctd\u003e去程：\u003cstrong\u003e\u003cstrong\u003e；回程：\u003c/strong\u003e\u003c/strong\u003e；下一班：____\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/1\u003c/td\u003e\n\u003ctd\u003e河津 → 上入口；七滝 → 河津\u003c/td\u003e\n\u003ctd\u003e仅默认七滝方案\u003c/td\u003e\n\u003ctd\u003e去程：\u003cstrong\u003e\u003cstrong\u003e；回程：\u003c/strong\u003e\u003c/strong\u003e；下一班：____\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/2\u003c/td\u003e\n\u003ctd\u003e伊豆热川 → 品川\u003c/td\u003e\n\u003ctd\u003e默认踊り子 2 号 10:32 → 12:40\u003c/td\u003e\n\u003ctd\u003e购票后填席位；稻取版另查午后车\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/5\u003c/td\u003e\n\u003ctd\u003e滨松町 → 羽田 T3\u003c/td\u003e\n\u003ctd\u003e以约 07:00 前到航站楼倒推\u003c/td\u003e\n\u003ctd\u003e计划：\u003cstrong\u003e\u003cstrong\u003e；备选：\u003c/strong\u003e\u003c/strong\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e查询入口：\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098941.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 候选去伊豆列车\u003c/a\u003e／\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098921.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 候选回东京列车\u003c/a\u003e／\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东海巴士\u003c/a\u003e／\u003ca href=\"https://www.tokyo-monorail.co.jp/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东京单轨电车\u003c/a\u003e。\u003c/p\u003e\n\u003ch3\u003e3. 只替换、不叠加的调整规则\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e情况\u003c/th\u003e\n\u003cth\u003e优先处理\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/25 航班或入境延误\u003c/td\u003e\n\u003ctd\u003e删除散步；先保证入住，接近截止时间提前联系酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/26 江之岛超时\u003c/td\u003e\n\u003ctd\u003e删登塔／岩屋、极乐寺短停，不再追固定海边日落。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/27 镰仓晚出发\u003c/td\u003e\n\u003ctd\u003e缩短／取消美术馆。确实要补到 9/29，就把那天改为美术馆＋转场，海岸让给 10/1。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/28 箱根缆车或船停运\u003c/td\u003e\n\u003ctd\u003e根据官方公告走能运行的部分，或提早回酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/29 寄存失败或海岸不适合走\u003c/td\u003e\n\u003ctd\u003e直接入住热川，海岸改日或取消。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/30 大室山天气差\u003c/td\u003e\n\u003ctd\u003e与 10/1 互换或取消；重算巴士券，不自动换成危险的户外替代。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/2 决定去稻取\u003c/td\u003e\n\u003ctd\u003e放弃早班特急和新宿御苑，东京只保留傍晚。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/3 不看烟花、天气正常\u003c/td\u003e\n\u003ctd\u003e用东京 B 版。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/3 因恶劣天气取消烟花\u003c/td\u003e\n\u003ctd\u003e选室内活动，不保证当天还有 SHIBUYA SKY 票，也不硬上屋顶。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/3 散场很晚\u003c/td\u003e\n\u003ctd\u003e10/4 先删皇居，从浅草开始，晚上仍尽早整理行李。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch3\u003e4. 导航时用这些日文名称\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e中文\u003c/th\u003e\n\u003cth\u003e可复制的检索词\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e成田 T2 铁路站\u003c/td\u003e\n\u003ctd\u003e空港第2ビル\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓／大船\u003c/td\u003e\n\u003ctd\u003e鎌倉駅／大船駅\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓高校前／长谷\u003c/td\u003e\n\u003ctd\u003e鎌倉高校前駅／長谷駅\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根汤本／雕刻之森\u003c/td\u003e\n\u003ctd\u003e箱根湯本駅／彫刻の森美術館\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e早云山／大涌谷／桃源台\u003c/td\u003e\n\u003ctd\u003e早雲山／大涌谷／桃源台\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e元箱根港\u003c/td\u003e\n\u003ctd\u003e元箱根港\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆高原／热川／北川\u003c/td\u003e\n\u003ctd\u003e伊豆高原駅／伊豆熱川駅／伊豆北川駅\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e城崎海岸／门胁吊桥\u003c/td\u003e\n\u003ctd\u003e城ヶ崎海岸／門脇つり橋\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e大室山／动物公园巴士站\u003c/td\u003e\n\u003ctd\u003e大室山／シャボテン公園\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e河津七滝上入口／下游站\u003c/td\u003e\n\u003ctd\u003e河津七滝遊歩道上入口／河津七滝\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e稻取人偶馆\u003c/td\u003e\n\u003ctd\u003e文化公園 雛の館\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e滨松町名铁酒店\u003c/td\u003e\n\u003ctd\u003e名鉄イン浜松町／Meitetsu Inn Hamamatsucho\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e酒店附近车站／出口\u003c/td\u003e\n\u003ctd\u003e浜松町駅 北口／大門駅 A2出口（电梯走 A1出口）\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e烟花会场／分流站\u003c/td\u003e\n\u003ct : "先确认版本和选择 [ ] 实际回程确为 10/5 JL029、羽田出发 ；核对时间和航站楼。 [ ] 东京住宿已按要求改为 滨松町名铁酒店（名鉄イン浜松町），10/2—10/5，共 3 晚 ；出发前对照实际订单核实日期、房型、费用及退改条款。 [ ] 确认人数、房间数、早餐晚餐权益、入住／退房、取消条款，不依赖原稿摘要。 [ ] 接受 9/27 早离开镰仓＋下午美术馆 ，而不是同时保留中午鳗鱼饭。 [ ] 10/1 选河津、热海＋黒根岩、温泉休息版，或天气补位中的一套。 [ ] 10/2 选 早进东京 还是 稻取半日 。 [ ] 东京选 A 看烟花或 B 不看烟花；若订付费席，核实会场、连座与取票。 再落实预订与出行 [ ] 购买并保存适用日期的列车票、箱根周游券；特急确认目的地车厢、席位和总价。 [ ] 按实际使用日期比较伊豆巴士两日券，注意 10/1 调价和连续两天规则。 [ ] 查好伊豆去程、回程和下一班巴士，截图保存，不用模糊班次规律。 [ ] 向酒店确认寄存、接驳、晚餐场次和晚到联系方式。 [ ] 需要时预订美术馆、SHIBUYA SKY、晴空塔和餐厅；未订项目不标“已确认”。 [ ] 采用烟花付费席时，到日本后按流程领取实体票，保存官方会场图。 [ ] 准备个人有效证件、订单、通讯、支付方式、备用现金和适合步行的鞋。 [ ] 带轻便雨具、外套、充电宝；每日根据次日天气和运行公告微调。 [ ] 10/4 晚上完成行李整理、核对羽田早晨交通，10/5 不留其他任务。"}, {"id": "source-22", "title": "资料说明与核对入口", "markdown": "**原始材料**：用户提供的《2026-09-16 日本旅行计划》；上一轮《Japan_Trip_Review_Changes_2026.md》；本次对话中已讨论的东京两版、JL736／JL029与机场交通；最新要求将东京酒店改为滨松町名铁酒店。\n\n**公开资料**：正文链接以铁路公司、巴士公司、酒店、景点、主办方或市区官方网站为主。机场普通 JR 费用另参考公开换乘查询。原有票价、开放日与交通限制沿用上一版整合时的核对结果，本次未重新核验；未查询实时余票、未替用户预订，具体车次和临时停运仍需出发前复核。\n\n**本次酒店更新的外部核对**：滨松町名铁酒店的日文名称、地址、电话、通常入住／退房时间、寄存说明、JR／单轨电车滨松町与大门站出口及步行时间、东京塔步行参考，依据其官方交通页及官方问答（2026 年 9 月 18 日查询）。这些是酒店公开信息，不代表已核验或变更实际预订。[酒店交通][hotel-meitetsu]／[官方问答][hotel-meitetsu-faq]\n\n**上一版整合已做的重要校准（本次沿用）**：东海巴士两日券从 2026/10/1 起的销售价格变化；大室山九月与十月营业时间不同；烟花官方用贺站分流路线约 30 分钟的参考；黒根岩并非只能现金付款。它们是外部核对内容，不是原稿已经确认的预订条件。\n\n**本版没有擅自补齐的事项**：实际东京订单、返程电子机票、同行人数、房间与餐饮权益、退改条款、大件寄存空位、巴士具体分钟及门票余量。所有时间取舍以“正常交通下可执行、延误时知道删什么”为原则。", "html": "\u003cp\u003e\u003cstrong\u003e原始材料\u003c/strong\u003e：用户提供的《2026-09-16 日本旅行计划》；上一轮《Japan_Trip_Review_Changes_2026.md》；本次对话中已讨论的东京两版、JL736／JL029与机场交通；最新要求将东京酒店改为滨松町名铁酒店。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e公开资料\u003c/strong\u003e：正文链接以铁路公司、巴士公司、酒店、景点、主办方或市区官方网站为主。机场普通 JR 费用另参考公开换乘查询。原有票价、开放日与交通限制沿用上一版整合时的核对结果，本次未重新核验；未查询实时余票、未替用户预订，具体车次和临时停运仍需出发前复核。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e本次酒店更新的外部核对\u003c/strong\u003e：滨松町名铁酒店的日文名称、地址、电话、通常入住／退房时间、寄存说明、JR／单轨电车滨松町与大门站出口及步行时间、东京塔步行参考，依据其官方交通页及官方问答（2026 年 9 月 18 日查询）。这些是酒店公开信息，不代表已核验或变更实际预订。\u003ca href=\"https://www.m-inn.com/hamama 间数量与“两人预算”也不完全一致，因此本文不推算同行人数，不汇总房费，不复制取消期限。\n\n### 一眼看完整行程\n\n| 日期 | 当日主线 | 当晚住宿 | 主要取舍 |\n|---|---|---|---|\n| **9/25 周五** | 成田落地 → 普通 JR → 镰仓入住 | 镰仓 | 纯交通日。 |\n| **9/26 周六** | 镰仓高校前 → 江之岛 → 长谷寺、大佛 → 海边 | 镰仓 | 岩屋、登塔不全部叠加。 |\n| **9/27 周日** | 鹤冈八幡宫、小町通 → 11:00 左右出发 → 雕刻之森 | 箱根天成园 | 放弃原来 12:00 的镰仓鳗鱼午餐。 |\n| **9/28 周一** | 箱根环线：大涌谷 → 芦之湖 → 箱根神社 | 箱根天成园 | 留温泉与晚餐时间。 |\n| **9/29 周二** | 箱根 → 伊豆高原寄存 → 城崎海岸短线 → 热川 | 伊豆热川 | 不先去热川放箱子再折返。 |\n| **9/30 周三** | 大室山＋仙人掌动物公园 | 伊豆热川 | 两个相邻景点用完整白天。 |\n| **10/1 周四** | 默认河津七滝；或热海＋黒根岩／温泉休息版 | 伊豆热川 | 只选一套，也作为天气调整日。 |\n| **10/2 周五** | 默认早进东京 → 新宿御苑、新宿 → 东京塔外观 | 滨松町名铁酒店 | 稻取半日是替换方案。 |\n| **10/3 周六·A** | 涩谷半日 → 提前进场 → 多摩川花火 | 滨松町名铁酒店 | 整个下午、晚上留给烟花。 |\n| **10/4 周日·A** | 皇居东御苑 → 浅草 → 银座 | 滨松町名铁酒店 | 晴空塔只远眺，疲惫时删皇居。 |\n| **10/3 周六·B** | 皇居东御苑 → 涩谷 → SHIBUYA SKY | 滨松町名铁酒店 | 不去二子玉川。 |\n| **10/4 周日·B** | 浅草 → 晴空塔／Solamachi → 银座 | 滨松町名铁酒店 | 登塔可选，晚上整理行李。 |\n| **10/5 周一** | 06:15 左右出发 → 羽田 T3 → JL029 | — | 纯返程日。 |\n\n东京住宿统一为滨松町名铁酒店。A、B 是同两天的两个版本，不是多出来的行程。", "html": "\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e项目\u003c/th\u003e\n\u003cth\u003e本版采用\u003c/th\u003e\n\u003cth\u003e与其他材料的冲突／边界\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e去程\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e9/25 JL736，香港 → 成田\u003c/strong\u003e；前文时间 10:30 → 15:55\u003c/td\u003e\n\u003ctd\u003e航班号由本人确认，时间沿用前文，最终看电子机票。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e回程\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e10/5 JL029，羽田 → 香港\u003c/strong\u003e；前文时间 09:55 → 13:30\u003c/td\u003e\n\u003ctd\u003e原始 Markdown 写的是 JL735、成田 18:20 起飞。本版不混用那个方案。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓住宿\u003c/td\u003e\n\u003ctd\u003eplat hostel keikyu kamakura wave，9/25—9/27\u003c/td\u003e\n\u003ctd\u003e沿用原住宿。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根住宿\u003c/td\u003e\n\u003ctd\u003e天成园，9/27—9/29\u003c/td\u003e\n\u003ctd\u003e沿用原住宿，原稿注明含早晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆住宿\u003c/td\u003e\n\u003ctd\u003e伊东园酒店热川，9/29—10/2\u003c/td\u003e\n\u003ctd\u003e沿用原住宿，原稿注明含早晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京住宿\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e滨松町名铁酒店（Meitetsu Inn Hamamatsucho），10/2—10/5\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e按最新要求更新；不再采用旧版东京酒店。房型、费用、餐食和退改条款以实际订单为准。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京游玩\u003c/td\u003e\n\u003ctd\u003e新宿、涩谷、浅草、银座等；10/3—10/4 分两版\u003c/td\u003e\n\u003ctd\u003e不采用原始 Markdown 的 10/4 DisneySea、龟户往返路线和成田返程。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/2 上午\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e默认直接进东京\u003c/strong\u003e，稻取是互斥替换方案\u003c/td\u003e\n\u003ctd\u003e保留稻取就放弃当天新宿御苑，不把两套时间表拼在一起。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e东京酒店按最新要求采用滨松町名铁酒店，回程仍须复核电子机票。\u003c/strong\u003e 本次仅更新行程文档，不代表已变更、取消或核实任何酒店订单。原稿房间数量与“两人预算”也不完全一致，因此本文不推算同行人数，不汇总房费，不复制取消期限。\u003c/p\u003e\n\u003ch3\u003e一眼看完整行程\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e日期\u003c/th\u003e\n\u003cth\u003e当日主线\u003c/th\u003e\n\u003cth\u003e当晚住宿\u003c/th\u003e\n\u003cth\u003e主要取舍\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/25 周五\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e成田落地 → 普通 JR → 镰仓入住\u003c/td\u003e\n\u003ctd\u003e镰仓\u003c/td\u003e\n\u003ctd\u003e纯交通日。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/26 周六\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e镰仓高校前 → 江之岛 → 长谷寺、大佛 → 海边\u003c/td\u003e\n\u003ctd\u003e镰仓\u003c/td\u003e\n\u003ctd\u003e岩屋、登塔不全部叠加。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/27 周日\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e鹤冈八幡宫、小町通 → 11:00 左右出发 → 雕刻之森\u003c/td\u003e\n\u003ctd\u003e箱根天成园\u003c/td\u003e\n\u003ctd\u003e放弃原来 12:00 的镰仓鳗鱼午餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/28 周一\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e箱根环线：大涌谷 → 芦之湖 → 箱根神社\u003c/td\u003e\n\u003ctd\u003e箱根天成园\u003c/td\u003e\n\u003ctd\u003e留温泉与晚餐时间。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/29 周二\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e箱根 → 伊豆高原寄存 → 城崎海岸短线 → 热川\u003c/td\u003e\n\u003ctd\u003e伊豆热川\u003c/td\u003e\n\u003ctd\u003e不先去热川放箱子再折返。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/30 周三\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e大室山＋仙人掌动物公园\u003c/td\u003e\n\u003ctd\u003e伊豆热川\u003c/td\u003e\n\u003ctd\u003e两个相邻景点用完整白天。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/1 周四\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e默认河津七滝；或热海＋黒根岩／温泉休息版\u003c/td\u003e\n\u003ctd\u003e伊豆热川\u003c/td\u003e\n\u003ctd\u003e只选一套，也作为天气调整日。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/2 周五\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e默认早进东京 → 新宿御苑、新宿 → 东京塔外观\u003c/td\u003e\n\u003ctd\u003e滨松町名铁酒店\u003c/td\u003e\n\u003ctd\u003e稻取半日是替换方案。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/3 周六·A\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e涩谷半日 → 提前进场 → 多摩川花火\u003c/td\u003e\n\u003ctd\u003e滨松町名铁酒店\u003c/td\u003e\n\u003ctd\u003e整个下午、晚上留给烟花。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/4 周日·A\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e皇居东御苑 → 浅草 → 银座\u003c/td\u003e\n\u003ctd\u003e滨松町名铁酒店\u003c/td\u003e\n\u003ctd\u003e晴空塔只远眺，疲惫时删皇居。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/3 周六·B\u003c/strong\u
