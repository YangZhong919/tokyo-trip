 return `<div class="page-head"><div><div class="eyebrow">YOUR AUTUMN, WELL PLANNED.</div><h1>${U.headline}</h1><p>${U.overviewSubtitle}</p></div><span class="tag">${icon('globe')}${U.allLocal}</span></div><section class="hero"><div class="hero-copy"><div class="eyebrow">AUTUMN JOURNEY &nbsp; / &nbsp; 2026.09.25 - 10.05</div><h1>${U.heroTitle}</h1><p>${U.heroSub}</p><div class="hero-actions"><button class="btn btn-light" data-day="1">${U.startExploring}${icon('arrow')}</button><button class="btn btn-ghost" data-view="checklist">${U.seeChecklist}</button></div></div>${heroArt()}<span class="hero-bottom">11 DAYS &nbsp; / &nbsp; 10 NIGHTS &nbsp; / &nbsp; 4 STAYS</span></section><div class="trip-meta"><span class="tag">${icon('calendar')}11 &#22825; 10 &#26202;</span><span class="tag">${icon('train')}&#20844;&#20849;&#20132;&#36890;&#20026;&#20027;</span><span class="tag">${icon('bed')}&#28392;&#26494;&#30010;&#21517;&#38081;&#37202;&#24215;&#29256;</span><span class="tag tag-peach">${icon('plane')}NRT IN / HND OUT</span></div><section class="regions" aria-label="${U.routeLabel}">${D.regions.map(r=>`<button class="region-card" data-day="${r.day}"><span class="region-icon">${icon(r.icon)}</span><span><span class="region-name">${r.zh}<small>${r.nights}</small></span><span class="region-dates">${r.dates}</span></span><span class="region-desc"><span>${r.desc}</span><span>${r.en}</span></span></button>`).join('')}</section>${planToggle(true)}<div class="overview-grid"><section><div class="section-top"><div><h2>${U.dayList}</h2><p>${U.dayListSub}</p></div><button class="icon-btn" data-action="today" aria-label="${U.gotoToday}" title="${U.gotoToday}">${icon('calendar')}</button></div>${allDays().map(d=>{const change=d.variants?D.specialChoices[d.key].labels[state.choices[d.key]]:'';return `<button class="day-row ${state.done[d.num]?'done':''}" data-day="${d.num}" data-region="${regionId(d)}"><span class="day-row-date">${d.date}<small>${d.week}</small></span><span class="day-row-line"></span><span class="day-row-content"><span class="day-row-title">${d.title}</span><span class="day-row-desc" style="display:block">${change?`${U.selected} ${change} &middot; ${activeRoute(d)}`:d.desc}</span></span><span class="day-row-badge">${d.region}</span>${icon(state.done[d.num]?'check':'chevron')}</button>`}).join('')}</section><aside class="overview-aside">${flightCard()}<section class="panel"><h3>${icon('clock')}${U.important}</h3>${D.important.map(it=>`<div class="alert-item"><span class="alert-date">${it.date}</span><div><button class="alert-title" data-day="${it.day}" style="padding:0;text-align:left">${it.title}</button><div class="alert-text">${it.text}</div></div></div>`).join('')}</section><section class="panel"><h3>${icon('checklist')}${U.prepare}</h3><div class="prep-number"><span data-check-count>${checkedCount()}</span><small>/ ${D.checks.length}</small></div><div class="progress-track"><div data-check-progress class="progress-fill" style="width:${checkedCount()/D.checks.length*100}%"></div></div><button class="btn btn-outline" data-view="checklist" style="width:100%">${U.checkAll}${icon('arrow')}</button><p class="small-note">${U.localOnly}</p></section></aside></div><div class="source-notice">${U.sourceNotice}</div>`;
}
function datesMarkup(){return `<div class="date-strip" aria-label="${U.dateLabel}">${allDays().map(d=>`<button class="date-btn ${state.day===d.num?'active':''}" data-day="${d.num}" aria-pressed="${state.day===d.num}">${d.date}<small>${d.region} &middot; ${d.week}</small>${state.done[d.num]?'<span class="day-dot"></span>':''}</button>`).join('')}</div>`;}
function termsMarkup(d){return `<section class="panel"><h3>${icon('pin')}&#26085;&#25991;&#26816;&#32034;&#35789;</h3>${d.terms.map(([name,query])=>{
 const destination=prosePlaces.queries.get(name==='七滝回程站'?name:query)||query+' 日本';
 const href=esc(mapUrl(destination)),label=esc('在 Google Maps 中打开：'+name);
 return `<div class="term-item"><div class="term-main"><small><a class="place-link" href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${label}">${esc(name)}</a></small><span><a class="place-link" href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${label}">${esc(query)}</a></span></div><button class="icon-btn" data-copy="${esc(query)}" aria-label="${U.copyName}: ${esc(query)}" title="${U.copyName}">${icon('copy')}</button><a class="icon-btn" href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${label}" title="${label}">${icon('external')}</a></div>`;
 }).join('')}<p class="small-note">${U.external}</p></section>`;}
function dayHotel(d){const h=hotel(d.hotel);if(!h)return `<section class="panel"><h3>${icon('plane')}${U.inbound}</h3><p class="day-hotel-title">HND T3 &rarr; HKG</p><div class="day-hotel-en">JL029 &middot; 09:55 &rarr; 13:30</div><p class="day-hotel-access">${U.retire}</p></section>`;return `<section class="panel"><h3>${icon('bed')}${U.stayTonight}</h3><div class="day-hotel-title">${h.name}</div><div class="day-hotel-en">${h.official}</div><p class="day-hotel-access">${h.access}</p><div style="display:flex;gap:5px;flex-wrap:wrap"><a class="btn btn-outline" href="${esc(mapUrl(h.jp+' '+h.address))}" target="_blank" rel="noopener noreferrer">${icon('pin')}${U.hotelMap}</a>${hotelBookingButton(h)}<button class="btn btn-ghost" data-view="hotels">${U.fullInfo}</button></div></section>`;}
function dayView(){const d=getDay(state.day),part=activeDayData(d),choice=D.specialChoices[d.key];return `${titleBlock(U.daysTitle,U.daysSubtitle,'DAY BY DAY')}${datesMarkup()}${d.num===9||d.num===10?planToggle(true):''}<div class="day-heading"><div class="day-heading-top"><span class="day-number">DAY ${String(d.num).padStart(2,'0')} / 11</span><span class="tag tag-green">${d.date} &middot; ${d.week}</span><span class="tag">${d.region}</span>${d.num===9||d.num===10?`<span class="tag tag-peach">${state.plan==='A'?U.planA:U.planB}</span>`:''}</div><h2>${d.title}</h2><div class="route-box">${icon('route')}<span>${activeRoute(d)}</span></div></div>${choice?`<div class="choice-card"><h3>${U.choice}</h3><div class="segmented" role="group" aria-label="${U.choice}">${choice.labels.map((l,i)=>`<button data-choice="${d.key}" data-choice-index="${i}" class="${state.choices[d.key]===i?'active':''}" aria-pressed="${state.choices[d.key]===i}">${l}</button>`).join('')}</div><p class="choice-hint">${choice.hints[state.choices[d.key]]} ${U.choiceNote}</p></div>`:''}<div class="day-columns"><div>${bookingPanel(dayBookingEntries(d))}${part.timeline.length?`<section class="timeline-card"><div class="timeline-head"><h3>${U.schedule}</h3><small>${U.suggested}</small></div>${part.timeline.map(r=>`<div class="timeline-row"><div class="timeline-time">${r.time}</div><div class="timeline-text">${r.text}</div></div>`).join('')}</section>`:''}<details class="details-box" open><summary>${U.details}${icon('chevron')}</summary><div class="prose">${part.html}</div></details><div class="day-end"><button class="btn btn-outline" data-day="${Math.max(1,d.num-1)}" ${d.num===1?'disabled':''}>${icon('arrow-left')}${U.prevDay}</button><button class="finish-day ${state.done[d.num]?'checked':''}" data-action="done-day">${icon(state.done[d.num]?'check-circle':'circle')}${state.done[d.num]?U.doneDayYes:U.doneDay}</button><button class="btn btn-dark" data-day="${Math.min(11,d.num+1)}" ${d.num===11?'disabled':''}>${U.nextDay}${icon('arrow')}</button></div></div><aside class="day-side"><div class="focus-box"><h4>${icon('alert')}${U.safe}</h4>${d.focus}</div>${dayHotel(d)}${termsMarkup(d)}<section class="panel notes-panel"><h3>${icon('edit')}${U.dayNote}</h3><textarea class="notes-box" id="day-note" data-note-key="${noteKey(d)}" placeholder="${U.notePlaceholder}" aria-label="${U.dayNote}">${esc(state.notes[noteKey(d)]||'')}</textarea><p class="small-note" id="note-status">${U.localOnly}</p></section></aside></div>`;}
function hotelsView(){return `${titleBlock(U.hotelsTitle,U.hotelsSubtitle,'STAY A LITTLE LONGER')}<div class="hotel-grid">${D.hotels.map(h=>`<article class="hotel-card ${h.id}"><div class="hotel-banner"><div class="eyebrow">${h.region} &nbsp; / &nbsp; ${h.dates}</div><span class="hotel-nights">${h.nights} &#26202;</span><h2>${h.name}</h2><p>${h.official}</p></div><div class="hotel-body"><div class="hotel-info-row">${icon('pin')}<span>${h.address}</span></div><div class="hotel-info-row">${icon('clock')}<span>${h.arrival}</span></div><div class="hotel-info-row">${icon('train')}<span>${h.access}</span></div><p class="hotel-tip">${h.tip}</p><div class="hotel-actions"><a class="btn btn-dark" href="${esc(mapUrl(h.jp+' '+h.address))}" target="_blank" rel="noopener noreferrer">${icon('pin')}${U.hotelMap}</a>${hotelBookingButton(h)}<button class="btn btn-outline" data-copy="${esc(h.jp)}">${icon('copy')}${U.copyName}</button><a class="btn btn-ghost" href="tel:${h.phone}">${icon('phone')}${h.phone}</a></div><div class="small-note"><a href="${esc(D.refs[h.ref])}" target="_blank" rel="noopener noreferrer">&#37202;&#24215;&#23448;&#26041;&#20449;&#24687; ${icon('external')}</a></div></div></article>`).join('')}</div><details class="details-box"><summary>${U.hotelSource}${icon('chevron')}</summary><div class="prose">${D.chapters.hotels.hotelHtml}</div></details><div class="source-notice">${U.hotelOrder} ${U.sourceNotice}</div>`;}
function transportView(){return `${titleBlock(U.transportTitle,U.transportSubtitle,'ON THE WAY')}${bookingPanel(transportBookingIds,'交通票券购买','先查看适用区间，再选择乘车日期与票种。')}<section class="transport-card"><h2 class="chapter-title">${icon('ticket')}${U.tickets}</h2><div class="prose">${D.chapters.tickets.html}</div></section><details class="details-box"><summary>${U.izuDirection}${icon('chevron')}</summary><div class="prose">${D.chapters.izu.html}</div></details><section class="transport-card"><h2 class="chapter-title">${icon('coin')}${U.budget}</h2><div class="prose">${D.chapters.budget.html}</div></section><section class="transport-card"><h2 class="chapter-title">${icon('edit')}${U.transitMemo}</h2><p class="muted" style="font-size:12px">${U.transitMemoSub}</p><div class="memo-list">${D.transit.map(t=>`<div class="memo-card"><div class="memo-date">${t.date}</div><h4>${t.route}</h4><p>${t.current}<br>${t.hint}</p><textarea data-transit-key="${t.id}" placeholder="${U.transitPlaceholder}" aria-label="${esc(t.date+' '+t.route)}">${esc(state.transit[t.id]||'')}</textarea></div>`).join('')}</div><p class="small-note">${U.localOnly}</p></section><details class="details-box"><summary>${U.onTheRoad}${icon('chevron')}</summary><div class="prose">${D.chapters.road.html}</div></details>`;}
function checklistView(){const groups=[...new Set(D.checks.map(c=>c.group))];return `${titleBlock(U.checkTitle,U.checkSubtitle,'BEFORE YOU GO')}<section class="check-summary"><div><h2>${U.progressLabel}</h2><p>${U.localOnly}</p><div class="progress-track"><div class="progress-fill" data-check-progress style="width:${checkedCount()/D.checks.length*100}%"></div></div></div><div class="check-summary-count"><span data-check-count>${checkedCount()}</span><small>/ ${D.checks.length}</small></div></section>${groups.map(g=>`<section class="check-group"><h2>${g}</h2>${D.checks.filter(c=>c.group===g).map(c=>`<label class="check-item ${state.checks[c.id]?'checked':''}"><input type="checkbox" data-check-id="${c.id}" ${state.checks[c.id]?'checked':''}><span class="prose">${c.html}</span></label>`).join('')}</section>`).join('')}<section class="backup-panel"><div class="backup-actions">${btn(U.backup,'backup','btn-dark','download')}${btn(U.restore,'restore','btn-outline','upload')}${btn(U.exportNotes,'notes','btn-outline','edit')}${btn(U.reset,'reset','btn-ghost','reset')}</div><p>${U.backupNote}</p></section><p class="source-notice">${U.sourceNotice}</p>`;}
function sourceView(){return `${titleBlock(U.sourceTitle,U.sourceSubtitle,'THE COMPLETE ITINERARY')}${bookingDirectory()}<div class="source-layout"><aside class="toc-box"><h3>${U.toc}</h3><nav>${D.sections.map(s=>`<button class="toc-link" data-source-anchor="${s.id}">${s.title}</button>`).join('')}</nav><button class="btn btn-outline" data-action="download-md" style="margin-top:14px;font-size:10px">${icon('download')}${U.download}</button></aside><article class="source-document"><p class="provenance">${U.sourceLabel}<br>${esc(D.sourceName)}</p><div class="prose">${D.introHtml}</div>${D.sections.map(s=>`<section class="source-section prose" id="${s.id}"><h2>${s.title}</h2>${s.html}</section>`).join('')}</article></div>`;}
function updateProgress(){const n=checkedCount();document.querySelectorAll('[data-check-count]').forEach(e=>e.textContent=n);document.querySelectorAll('[data-check-progress]').forEach(e=>e.style.width=(n/D.checks.length*100)+'%');}
function render(){
 const funcs={overview,days:dayView,hotels:hotelsView,transport:transportView,checklist:checklistView,source:sourceView};
 const content=document.getElementById('content');content.innerHTML=(!storageWorks?`<div class="storage-warning">${U.notSaved}</div>`:'')+funcs[state.view]();
 linkPlaces(content);
 if(['days','hotels','transport','source'].includes(state.view))content.querySelector('.view-intro').insertAdjacentHTML('afterend',`<p class="maps-hint">${icon('pin')}带下划线的地点可点击，在 Google Maps 中打开。</p>`);
 content.classList.remove('view-enter');void content.offsetWidth;content.classList.add('view-enter');
 document.querySelectorAll('.nav-item').forEach(e=>{const active=e.dataset.view===state.view;e.classList.toggle('active',active);if(active)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current');});
 const label=U[navs.find(n=>n[0]===state.view)[1]];document.getElementById('crumb').textContent=label;document.title=(state.view==='days'?getDay(state.day).date+' / ':'')+label+' | '+U.brand;
 updateProgress();
 if(state.view==='days')requestAnimationFrame(()=>{const current=document.querySelector('.date-btn.active'),strip=document.querySelector('.date-strip');if(current&&strip)strip.scrollTo({left:Math.max(0,current.offsetLeft-strip.offsetLeft-strip.clientWidth/2+current.clientWidth/2),behavior:'instant'});});
}
function navigate(view,day,anchor){state.view=view;if(day)state.day=Math.max(1,Math.min(11,Number(day)));save();render();try{history.replaceState(null,'',view==='days'?'#day-'+state.day:anchor?'#'+anchor:'#'+view);}catch(e){}if(anchor)requestAnimationFrame(()=>scrollToSource(anchor));else window.scrollTo({top:0,behavior:'instant'});}
function scrollToSource(id){const e=document.getElementById(id);if(e){e.scrollIntoView({behavior:'smooth',block:'start'});e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse');}}
function downloadFile(name,content,type){const b=new Blob([content],{type});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(t);t.focus();t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw new Error('copy');}showToast(U.copied);}catch(e){showToast(U.copyFail);}}
function searchText(query){const target=document.getElementById('search-results'),helper=document.getElementById('search-help');query=query.trim();if(!query){target.innerHTML='';helper.textContent=U.searchHelp;return;}const q=query.toLocaleLowerCase();const found=D.sections.filter(s=>(s.title+' '+s.plain).toLocaleLowerCase().includes(q));helper.textContent=found.length+' '+U.results;const highlight=str=>{const pos=str.toLocaleLowerCase().indexOf(q);return pos<0?esc(str):esc(str.slice(0,pos))+'<mark>'+esc(str.slice(pos,pos+query.length))+'</mark>'+esc(str.slice(pos+query.length));};target.innerHTML=found.length?found.map(s=>{const p=s.plain.toLocaleLowerCase().indexOf(q),start=Math.max(0,p-45),snippet=(start?'... ':'')+s.plain.slice(start,start+150)+' ...';return `<button class="search-result" data-search-result="${s.id}"><h4>${highlight(s.title)}</h4><p>${highlight(snippet)}</p></button>`;}).join(''):`<p class="search-helper">${U.noResults}</p>`;}
function buildPrint(){const selected=allDays();document.getElementById('print-content').innerHTML=`<header class="print-cover"><p class="eyebrow">JAPAN / AUTUMN 2026</p><h1>${U.brand}</h1><p>2026.09.25 - 10.05 &nbsp; / &nbsp; 11 &#22825; 10 &#26202;</p><p>${U.sourceLabel}</p><p>${state.plan==='A'?U.planA:U.planB} &nbsp; | &nbsp; 10/1 ${D.specialChoices['7'].labels[state.choices['7']]} &nbsp; | &nbsp; 10/2 ${D.specialChoices['8'].labels[state.choices['8']]}</p><p class="print-source-note">${U.sourceNotice}</p></header><section class="prose">${D.chapters.hotels.hotelHtml}</section>${selected.map(d=>`<section class="print-day"><p class="eyebrow">DAY ${d.num} / ${d.date} ${d.week}</p><h2>${d.title}</h2><p class="print-dim">${activeRoute(d)}</p><div class="prose">${activeDayData(d).fullHtml}</div>${state.notes[noteKey(d)]?`<div class="print-note"><strong>${U.dayNote}</strong><br>${esc(state.notes[noteKey(d)])}</div>`:''}</section>`).join('')}<section class="print-day"><h2>${U.navChecklist}</h2>${D.checks.map(c=>`<div class="print-check"><span>${state.checks[c.id]?'&#9745;':'&#9744;'}</span><span class="prose">${c.html}</span></div>`).join('')}</section>`;}
function exportNotes(){let lines=['# '+U.exportTitle,'','- '+U.sourceLabel,'- '+(state.plan==='A'?U.planA:U.planB),'- 10/1: '+D.specialChoices['7'].labels[state.choices['7']],'- 10/2: '+D.specialChoices['8'].labels[state.choices['8']],'',U.localOnly,''];for(const d of allDays()){lines.push('## '+d.date+' '+d.title,'',activeRoute(d),'',state.notes[noteKey(d)]||U.noNotes,'');}lines.push('## '+U.transitMemo,'');for(const t of D.transit){if(state.transit[t.id])lines.push('### '+t.date+' '+t.route,'',state.transit[t.id],'');}lines.push('## '+U.navChecklist,'');D.checks.forEach(c=>lines.push('- ['+(state.checks[c.id]?'x':' ')+'] '+c.text));downloadFile('Japan_Trip_My_Notes.md',lines.join('\n'),'text/markdown;charset=utf-8');}
function openSearch(){document.getElementById('search-dialog').showModal();setTimeout(()=>document.getElementById('search-input').focus(),60);}
function handleAction(action){
 if(action==='search')openSearch();
 if(action==='close-search')document.getElementById('search-dialog').close();
 if(action==='download-md')downloadFile(D.sourceName,D.sourceMarkdown,'text/markdown;charset=utf-8');
 if(action==='print'){buildPrint();window.print();}
 if(action==='today'){const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const d=D.days.find(d=>d.iso===today);navigate('days',d?d.num:today<'2026-09-25'?1:11);if(!d)showToast(today<'2026-09-25'?U.coming:U.past);}
 if(action==='done-day'){state.done[state.day]=!state.done[state.day];save();render();}
 if(action==='backup')downloadFile('Japan_Trip_Backup.json',JSON.stringify({schema:'japan-trip-v1',source:D.sourceName,sourceSha256:D.sourceSha256,exportedAt:new Date().toISOString(),state},null,2),'application/json;charset=utf-8');
 if(action==='restore')document.getElementById('import-file').click();
 if(action==='notes')exportNotes();
 if(action==='reset'&&confirm(U.resetConfirm)){state=structuredClone(defaults);state.view='checklist';save();render();}
}
initShell();
const startHash=location.hash.slice(1);if(/^day-(?:[1-9]|10|11)$/.test(startHash)){state.view='days';state.day=Number(startHash.slice(4));}else if(navs.some(n=>n[0]===startHash))state.view=startHash;else if(/^source-\d+$/.test(startHash))state.view='source';
render();if(/^source-\d+$/.test(startHash))requestAnimationFrame(()=>scrollToSource(startHash));
document.addEventListener('click',e=>{
 const el=e.target.closest('button,a');if(!el)return;
 if(el.dataset.view){e.preventDefault();navigate(el.dataset.view);return;}
 if(el.dataset.day){e.preventDefault();navigate('days',el.dataset.day);return;}
 if(el.dataset.plan){state.plan=el.dataset.plan;save();render();return;}
 if(el.dataset.choice){state.choices[el.dataset.choice]=Number(el.dataset.choiceIndex);save();render();return;}
 if(el.dataset.action){e.preventDefault();handleAction(el.dataset.action);return;}
 if(el.dataset.copy){copyText(el.dataset.copy);return;}
 if(el.dataset.sourceAnchor){scrollToSource(el.dataset.sourceAnchor);return;}
 if(el.dataset.searchResult){document.getElementById('search-dialog').close();navigate('source',null,el.dataset.searchResult);return;}
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='search-input')searchText(el.value);if(el.dataset.noteKey){state.notes[el.dataset.noteKey]=el.value;save();const status=document.getElementById('note-status');if(status)status.textContent=storageWorks?U.noteSaved:U.notSaved;}if(el.dataset.transitKey){state.transit[el.dataset.transitKey]=el.value;save();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.checkId){state.checks[el.dataset.checkId]=el.checked;el.closest('.check-item').classList.toggle('checked',el.checked);save();updateProgress();}});
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw new Error('size');const parsed=JSON.parse(await file.text());if(parsed.schema!=='japan-trip-v1'||!parsed.state||typeof parsed.state!=='object')throw new Error('format');state=validateState(parsed.state);state.view='checklist';save();render();showToast(U.importSuccess);}catch(err){showToast(U.importFail);}e.target.value='';});
document.getElementById('search-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close();});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}});
window.addEventListener('beforeprint',buildPrint);
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(/^day-(?:[1-9]|10|11)$/.test(h))navigate('days',Number(h.slice(4)));else if(navs.some(n=>n[0]===h))navigate(h);});
</script>
</body></html>
