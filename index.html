ion": "东京", "name": "滨松町名铁酒店", "official": "Meitetsu Inn Hamamatsucho", "jp": "名鉄イン浜松町", "dates": "10/2 — 10/5", "nights": 3, "address": "〒105-0013 东京都港区浜松町 1-19-14", "arrival": "通常 15:00 入住 · 10:00 退房，具体按订单", "access": "滨松町北口约 4 分钟；大门 A2 约 2 分钟，电梯走 A1 约 3 分钟。", "tip": "入住日至退房日可向前台寄存；早到不代表能提前进房。", "phone": "+81-3-5472-3434", "ref": "hotel-meitetsu"}], "regions": [{"id": "kamakura", "zh": "镰仓", "en": "KAMAKURA", "nights": "2 晚", "dates": "9/25–9/27", "desc": "电车 · 古寺 · 湘南海岸", "day": 1, "icon": "train"}, {"id": "hakone", "zh": "箱根", "en": "HAKONE", "nights": "2 晚", "dates": "9/27–9/29", "desc": "火山 · 美术馆 · 温泉", "day": 3, "icon": "mountain"}, {"id": "izu", "zh": "伊豆", "en": "IZU", "nights": "3 晚", "dates": "9/29–10/2", "desc": "断崖 · 大室山 · 溪谷", "day": 5, "icon": "waves"}, {"id": "tokyo", "zh": "东京", "en": "TOKYO", "nights": "3 晚", "dates": "10/2–10/5", "desc": "城市漫步 · 夜景 · 花火", "day": 8, "icon": "tower"}], "specialChoices": {"7": {"labels": ["河津七滝", "热海＋黒根岩", "温泉休息"], "routes": ["热川 → 河津站 → 七滝步道 → 河津站 → 热川", "热川 → 热海 → 来宫神社 / 商店街 → 伊豆北川 → 黒根岩 → 热川", "热川 → 北川温泉 → 热川休息"], "hints": ["七滝上入口与回程站不是同一站，先核对巴士。", "往返电车较长，不加热海城。", "不去热海或河津；海岸补位仅作为替换。"]}, "8": {"labels": ["早进东京", "稻取半日"], "routes": ["伊豆热川 → 品川 → 滨松町北口 → 酒店寄存 → 新宿 → 东京塔", "热川寄存 → 稻取雛之馆 → 热川取行李 → 东京酒店 → 东京塔外观"], "hints": ["10:32 特急仅为候选；御苑 16:00 停止入园。", "不乘 10:32 早班特急，不安排新宿御苑。"]}}, "important": [{"date": "9/25", "title": "22:30 前入住", "text": "镰仓旅馆最晚入住时间；航班延误时提前联系。", "day": 1}, {"date": "10/3", "title": "烟花留出整个下午", "text": "看烟花版 13:00 左右从涩谷出发，散场不赶预约。", "day": 9}, {"date": "10/5", "title": "06:15 左右出发", "text": "滨松町 → 羽田 T3；早班 JL029，不去成田。", "day": 11}], "sections": [{"id": "source-0", "title": "一、先统一版本，避免拿错酒店和机场", "markdown": "| 项目 | 本版采用 | 与其他材料的冲突／边界 |\n|---|---|---|\n| 去程 | **9/25 JL736，香港 → 成田**；前文时间 10:30 → 15:55 | 航班号由本人确认，时间沿用前文，最终看电子机票。 |\n| 回程 | **10/5 JL029，羽田 → 香港**；前文时间 09:55 → 13:30 | 原始 Markdown 写的是 JL735、成田 18:20 起飞。本版不混用那个方案。 |\n| 镰仓住宿 | plat hostel keikyu kamakura wave，9/25—9/27 | 沿用原住宿。 |\n| 箱根住宿 | 天成园，9/27—9/29 | 沿用原住宿，原稿注明含早晚餐。 |\n| 伊豆住宿 | 伊东园酒店热川，9/29—10/2 | 沿用原住宿，原稿注明含早晚餐。 |\n| 东京住宿 | **滨松町名铁酒店（Meitetsu Inn Hamamatsucho），10/2—10/5** | 按最新要求更新；不再采用旧版东京酒店。房型、费用、餐食和退改条款以实际订单为准。 |\n| 东京游玩 | 新宿、涩谷、浅草、银座等；10/3—10/4 分两版 | 不采用原始 Markdown 的 10/4 DisneySea、龟户往返路线和成田返程。 |\n| 10/2 上午 | **默认直接进东京**，稻取是互斥替换方案 | 保留稻取就放弃当天新宿御苑，不把两套时间表拼在一起。 |\n\n**东京酒店按最新要求采用滨松町名铁酒店，回程仍须复核电子机票。** 本次仅更新行程文档，不代表已变更、取消或核实任何酒店订单。原稿房间数量与“两人预算”也不完全一致，因此本文不推算同行人数，不汇总房费，不复制取消期限。\n\n### 一眼看完整行程\n\n| 日期 | 当日主线 | 当晚住宿 | 主要取舍 |\n|---|---|---|---|\n| **9/25 周五** | 成田落地 → 普通 JR → 镰仓入住 | 镰仓 | 纯交通日。 |\n| **9/26 周六** | 镰仓高校前 → 江之岛 → 长谷寺、大佛 → 海边 | 镰仓 | 岩屋、登塔不全部叠加。 |\n| **9/27 周日** | 鹤冈八幡宫、小町通 → 11:00 左右出发 → 雕刻之森 | 箱根天成园 | 放弃原来 12:00 的镰仓鳗鱼午餐。 |\n| **9/28 周一** | 箱根环线：大涌谷 → 芦之湖 → 箱根神社 | 箱根天成园 | 留温泉与晚餐时间。 |\n| **9/29 周二** | 箱根 → 伊豆高原寄存 → 城崎海岸短线 → 热川 | 伊豆热川 | 不先去热川放箱子再折返。 |\n| **9/30 周三** | 大室山＋仙人掌动物公园 | 伊豆热川 | 两个相邻景点用完整白天。 |\n| **10/1 周四** | 默认河津七滝；或热海＋黒根岩／温泉休息版 | 伊豆热川 | 只选一套，也作为天气调整日。 |\n| **10/2 周五** | 默认早进东京 → 新宿御苑、新宿 → 东京塔外观 | 滨松町名铁酒店 | 稻取半日是替换方案。 |\n| **10/3 周六·A** | 涩谷半日 → 提前进场 → 多摩川花火 | 滨松町名铁酒店 | 整个下午、晚上留给烟花。 |\n| **10/4 周日·A** | 皇居东御苑 → 浅草 → 银座 | 滨松町名铁酒店 | 晴空塔只远眺，疲惫时删皇居。 |\n| **10/3 周六·B** | 皇居东御苑 → 涩谷 → SHIBUYA SKY | 滨松町名铁酒店 | 不去二子玉川。 |\n| **10/4 周日·B** | 浅草 → 晴空塔／Solamachi → 银座 | 滨松町名铁酒店 | 登塔可选，晚上整理行李。 |\n| **10/5 周一** | 06:15 左右出发 → 羽田 T3 → JL029 | — | 纯返程日。 |\n\n东京住宿统一为滨松町名铁酒店。A、B 是同两天的两个版本，不是多出来的行程。", "html": "\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e项目\u003c/th\u003e\n\u003cth\u003e本版采用\u003c/th\u003e\n\u003cth\u003e与其他材料的冲突／边界\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e去程\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e9/25 JL736，香港 → 成田\u003c/strong\u003e；前文时间 10:30 → 15:55\u003c/td\u003e\n\u003ctd\u003e航班号由本人确认，时间沿用前文，最终看电子机票。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e回程\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e10/5 JL029，羽田 → 香港\u003c/strong\u003e；前文时间 09:55 → 13:30\u003c/td\u003e\n\u003ctd\u003e原始 Markdown 写的是 JL735、成田 18:20 起飞。本版不混用那个方案。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓住宿\u003c/td\u003e\n\u003ctd\u003eplat hostel keikyu kamakura wave，9/25—9/27\u003c/td\u003e\n\u003ctd\u003e沿用原住宿。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根住宿\u003c/td\u003e\n\u003ctd\u003e天成园，9/27—9/29\u003c/td\u003e\n\u003ctd\u003e沿用原住宿，原稿注明含早晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆住宿\u003c/td\u003e\n\u003ctd\u003e伊东园酒店热川，9/29—10/2\u003c/td\u003e\n\u003ctd\u003e沿用原住宿，原稿注明含早晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京住宿\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e滨松町名铁酒店（Meitetsu Inn Hamamatsucho），10/2—10/5\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e按最新要求更新；不再采用旧版东京酒店。房型、费用、餐食和退改条款以实际订单为准。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京游玩\u003c/td\u003e\n\u003ctd\u003e新宿、涩谷、浅草、银座等；10/3—10/4 分两版\u003c/td\u003e\n\u003ctd\u003e不采用原始 Markdown 的 10/4 DisneySea、龟户往返路线和成田返程。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10/2 上午\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e默认直接进东京\u003c/strong\u003e，稻取是互斥替换方案\u003c/td\u003e\n\u003ctd\u003e保留稻取就放弃当天新宿御苑，不把两套时间表拼在一起。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e东京酒店按最新要求采用滨松町名铁酒店，回程仍须复核电子机票。\u003c/strong\u003e 本次仅更新行程文档，不代表已变更、取消或核实任何酒店订单。原稿房间数量与“两人预算”也不完全一致，因此本文不推算同行人数，不汇总房费，不复制取消期限。\u003c/p\u003e\n\u003ch3\u003e一眼看完整行程\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e日期\u003c/th\u003e\n\u003cth\u003e当日主线\u003c/th\u003e\n\u003cth\u003e当晚住宿\u003c/th\u003e\n\u003cth\u003e主要取舍\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/25 周五\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e成田落地 → 普通 JR → 镰仓入住\u003c/td\u003e\n\u003ctd\u003e镰仓\u003c/td\u003e\n\u003ctd\u003e纯交通日。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/26 周六\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e镰仓高校前 → 江之岛 → 长谷寺、大佛 → 海边\u003c/td\u003e\n\u003ctd\u003e镰仓\u003c/td\u003e\n\u003ctd\u003e岩屋、登塔不全部叠加。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/27 周日\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e鹤冈八幡宫、小町通 → 11:00 左右出发 → 雕刻之森\u003c/td\u003e\n\u003ctd\u003e箱根天成园\u003c/td\u003e\n\u003ctd\u003e放弃原来 12:00 的镰仓鳗鱼午餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/28 周一\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e箱根环线：大涌谷 → 芦之湖 → 箱根神社\u003c/td\u003e\n\u003ctd\u003e箱根天成园\u003c/td\u003e\n\u003ctd\u003e留温泉与晚餐时间。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/29 周二\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e箱根 → 伊豆高原寄存 → 城崎海岸短线 → 热川\u003c/td\u003e\n\u003ctd\u003e伊豆热川\u003c/td\u003e\n\u003ctd\u003e不先去热川放箱子再折返。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e9/30 周三\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e大室山＋仙人掌动物公园\u003c/td\u003e\n\u003ctd\u003e伊豆热川\u003c/td\u003e\n\u003ctd\u003e两个相邻景点用完整白天。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/1 周四\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e默认河津七滝；或热海＋黒根岩／温泉休息版\u003c/td\u003e\n\u003ctd\u003e伊豆热川\u003c/td\u003e\n\u003ctd\u003e只选一套，也作为天气调整日。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/2 周五\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e默认早进东京 → 新宿御苑、新宿 → 东京塔外观\u003c/td\u003e\n\u003ctd\u003e滨松町名铁酒店\u003c/td\u003e\n\u003ctd\u003e稻取半日是替换方案。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/3 周六·A\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e涩谷半日 → 提前进场 → 多摩川花火\u003c/td\u003e\n\u003ctd\u003e滨松町名铁酒店\u003c/td\u003e\n\u003ctd\u003e整个下午、晚上留给烟花。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/4 周日·A\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e皇居东御苑 → 浅草 → 银座\u003c/td\u003e\n\u003ctd\u003e滨松町名铁酒店\u003c/td\u003e\n\u003ctd\u003e晴空塔只远眺，疲惫时删皇居。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/3 周六·B\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e皇居东御苑 → 涩谷 → SHIBUYA SKY\u003c/td\u003e\n\u003ctd\u003e滨松町名铁酒店\u003c/td\u003e\n\u003ctd\u003e不去二子玉川。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/4 周日·B\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e浅草 → 晴空塔／Solamachi → 银座\u003c/td\u003e\n\u003ctd\u003e滨松町名铁酒店\u003c/td\u003e\n\u003ctd\u003e登塔可选，晚上整理行李。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e10/5 周一\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e06:15 左右出发 → 羽田 T3 → JL029\u003c/td\u003e\n\u003ctd\u003e—\u003c/td\u003e\n\u003ctd\u003e纯返程日。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e东京住宿统一为滨松町名铁酒店。A、B 是同两天的两个版本，不是多出来的行程。\u003c/p\u003e\n", "plain": "项目 本版采用 与其他材料的冲突／边界 去程 9/25 JL736，香港 → 成田 ；前文时间 10:30 → 15:55 航班号由本人确认，时间沿用前文，最终看电子机票。 回程 10/5 JL029，羽田 → 香港 ；前文时间 09:55 → 13:30 原始 Markdown 写的是 JL735、成田 18:20 起飞。本版不混用那个方案。 镰仓住宿 plat hostel keikyu kamakura wave，9/25—9/27 沿用原住宿。 箱根住宿 天成园，9/27—9/29 沿用原住宿，原稿注明含早晚餐。 伊豆住宿 伊东园酒店热川，9/29—10/2 沿用原住宿，原稿注明含早晚餐。 东京住宿 滨松町名铁酒店（Meitetsu Inn Hamamatsucho），10/2—10/5 按最新要求更新；不再采用旧版东京酒店。房型、费用、餐食和退改条款以实际订单为准。 东京游玩 新宿、涩谷、浅草、银座等；10/3—10/4 分两版 不采用原始 Markdown 的 10/4 DisneySea、龟户往返路线和成田返程。 10/2 上午 默认直接进东京 ，稻取是互斥替换方案 保留稻取就放弃当天新宿御苑，不把两套时间表拼在一起。 东京酒店按最新要求采用滨松町名铁酒店，回程仍须复核电子机票。 本次仅更新行程文档，不代表已变更、取消或核实任何酒店订单。原稿房间数量与“两人预算”也不完全一致，因此本文不推算同行人数，不汇总房费，不复制取消期限。 一眼看完整行程 日期 当日主线 当晚住宿 主要取舍 9/25 周五 成田落地 → 普通 JR → 镰仓入住 镰仓 纯交通日。 9/26 周六 镰仓高校前 → 江之岛 → 长谷寺、大佛 → 海边 镰仓 岩屋、登塔不全部叠加。 9/27 周日 鹤冈八幡宫、小町通 → 11:00 左右出发 → 雕刻之森 箱根天成园 放弃原来 12:00 的镰仓鳗鱼午餐。 9/28 周一 箱根环线：大涌谷 → 芦之湖 → 箱根神社 箱根天成园 留温泉与晚餐时间。 9/29 周二 箱根 → 伊豆高原寄存 → 城崎海岸短线 → 热川 伊豆热川 不先去热川放箱子再折返。 9/30 周三 大室山＋仙人掌动物公园 伊豆热川 两个相邻景点用完整白天。 10/1 周四 默认河津七滝；或热海＋黒根岩／温泉休息版 伊豆热川 只选一套，也作为天气调整日。 10/2 周五 默认早进东京 → 新宿御苑、新宿 → 东京塔外观 滨松町名铁酒店 稻取半日是替换方案。 10/3 周六·A 涩谷半日 → 提前进场 → 多摩川花火 滨松町名铁酒店 整个下午、晚上留给烟花。 10/4 周日·A 皇居东御苑 → 浅草 → 银座 滨松町名铁酒店 晴空塔只远眺，疲惫时删皇居。 10/3 周六·B 皇居东御苑 → 涩谷 → SHIBUYA SKY 滨松町名铁酒店 不去二子玉川。 10/4 周日·B 浅草 → 晴空塔／Solamachi → 银座 滨松町名铁酒店 登塔可选，晚上整理行李。 10/5 周一 06:15 左右出发 → 羽田 T3 → JL029 — 纯返程日。 东京住宿统一为滨松町名铁酒店。A、B 是同两天的两个版本，不是多出来的行程。"}, {"id": "source-1", "title": "二、住宿、行李与交通票券", "markdown": "### 1. 住宿信息和关键时间\n\n| 地点 | 酒店与地址 | 关键时间／交通 | 联系方式 |\n|---|---|---|---|\n| 镰仓 | **plat hostel keikyu kamakura wave**；镰仓市由比ヶ浜 2-2-39 | 入住 **16:00—22:30**，退房 11:00；镰仓站步行约 5 分钟，海滩约 10 分钟；寄存存在收费项目。 | +81-467-81-5005 |\n| 箱根 | **Hakone Yumoto Onsen Tenseien／箱根汤本温泉 天成园**；箱根町湯本 682 | 入住 15:00，退房 10:00；含晚餐方案注意 **18:00 前入住**，晚到提前联系。汤本站步行约 12 分钟。 | 原稿记录 +81-460-83-8511，出发前对照订单。 |\n| 伊豆 | **Itoen Hotel Atagawa／伊東園ホテル熱川**；东伊豆町奈良本 1267-2 | 车站步行约 10 分钟。原稿订单摘要写退房 10:00，官网通常为 11:00；本版安排更早离开，实际按订单执行。 | +81-557-23-2200 |\n| 东京 | **滨松町名铁酒店／Meitetsu Inn Hamamatsucho（名鉄イン浜松町）**；〒105-0013 东京都港区浜松町 1-19-14 | 通常 **15:00 入住、10:00 退房**，具体按订单。JR 滨松町北口步行约 **4 分钟**；大门站 **A2 出口约 2 分钟**；带大件行李可走 **A1 电梯出口约 3 分钟**。 | +81-3-5472-3434 |\n\n公开资料：[镰仓酒店][hotel-kamakura]、[天成园问答][hotel-tenseien]、[热川酒店][hotel-atagawa]、[滨松町名铁酒店交通][hotel-meitetsu]与[酒店问答][hotel-meitetsu-faq]。箱根、伊豆“含早晚餐”来自原稿，不是本轮重新核验的订房权益；具体餐次到店确认。\n\n**滨松町名铁酒店行李安排**：官方说明可在入住日至退房日期间于前台寄存行李。因此 10/2 提前抵达仍按“先寄存、再游玩”安排，不把提前到达写成一定可以提前进房；大件数量、贵重物品与具体取件要求向前台确认。[官方问答][hotel-meitetsu-faq]\n\n**热川酒店当前接驳：**\n\n- **车站 → 酒店**：13:30、14:00、14:30、15:00、15:30、16:00、16:30。\n- **酒店 → 车站**：09:15、09:55、10:35、11:15。\n- 出发前再核对。错过 16:30 不代表回不了酒店，而是需要步行或另行安排出租车；拖箱、下雨时留更多余量。[接驳信息][hotel-atagawa]\n\n### 2. 票券选择：按路线买，不为了回本绕路\n\n| 路段 | 本版选择 | 费用与边界 |\n|---|---|---|\n| 成田 → 镰仓 | **普通 JR 优先**，出关后选合适接续 | 查询参考约 **2,420／人**；不默认 N’EX，也不为等直通车长时间空等。 |\n| 9/26 江之电 | 普通一日券「のりおりくん」 | **800／人**；乘车少时再与单程票比较，餐饮另付。 |\n| 9/27—9/29 箱根 | 小田原出发**三日周游券** | **6,400／人**；按 9/27 起用购买。镰仓到小田原、伊豆铁路、美术馆门票另计。 |\n| 9/29—9/30 伊豆高原巴士 | 单程票与两日券比较后决定 | 两日券目前 **1,800／人**；**2026/10/1 起销售价格调至 2,150**。不因酒店在票区外就否定它。 |\n| 箱根 → 伊豆、伊豆 → 东京 | 普通车可选；踊り子是少换乘方案 | **基本运费＋特急附加费**，不能只拿基本运费预算特急。 |\n| 东京市内 | 默认 IC 卡按次乘车 | 路线含不同运营公司，不强行套地铁券。 |\n\n资料：[机场参考][airport-fare]、[江之电一日券][enoden-pass]、[箱根周游券][hakone-pass]、[东海巴士券与调价][tokai-pass]。\n\n**巴士两日券这样算**：比较两天实际巴士费用，加上确实能用的景点优惠，再与票价比较。热川往返伊豆高原的铁路不包含；改为步行去海岸或两次使用不连续两天时重新算，不预设一定划算。\n\n**美食券不作为默认。** 2,500 日元套餐的一日乘车券加四张兑换券，不等于四顿饭；一份商品可能用多张，周末还有限制。原文“省约 2,300 日元”的算法不再使用。[套餐说明][enoden-food]", "html": "\u003ch3\u003e1. 住宿信息和关键时间\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e地点\u003c/th\u003e\n\u003cth\u003e酒店与地址\u003c/th\u003e\n\u003cth\u003e关键时间／交通\u003c/th\u003e\n\u003cth\u003e联系方式\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e镰仓\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eplat hostel keikyu kamakura wave\u003c/strong\u003e；镰仓市由比ヶ浜 2-2-39\u003c/td\u003e\n\u003ctd\u003e入住 \u003cstrong\u003e16:00—22:30\u003c/strong\u003e，退房 11:00；镰仓站步行约 5 分钟，海滩约 10 分钟；寄存存在收费项目。\u003c/td\u003e\n\u003ctd\u003e+81-467-81-5005\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eHakone Yumoto Onsen Tenseien／箱根汤本温泉 天成园\u003c/strong\u003e；箱根町湯本 682\u003c/td\u003e\n\u003ctd\u003e入住 15:00，退房 10:00；含晚餐方案注意 \u003cstrong\u003e18:00 前入住\u003c/strong\u003e，晚到提前联系。汤本站步行约 12 分钟。\u003c/td\u003e\n\u003ctd\u003e原稿记录 +81-460-83-8511，出发前对照订单。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003eItoen Hotel Atagawa／伊東園ホテル熱川\u003c/strong\u003e；东伊豆町奈良本 1267-2\u003c/td\u003e\n\u003ctd\u003e车站步行约 10 分钟。原稿订单摘要写退房 10:00，官网通常为 11:00；本版安排更早离开，实际按订单执行。\u003c/td\u003e\n\u003ctd\u003e+81-557-23-2200\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e滨松町名铁酒店／Meitetsu Inn Hamamatsucho（名鉄イン浜松町）\u003c/strong\u003e；〒105-0013 东京都港区浜松町 1-19-14\u003c/td\u003e\n\u003ctd\u003e通常 \u003cstrong\u003e15:00 入住、10:00 退房\u003c/strong\u003e，具体按订单。JR 滨松町北口步行约 \u003cstrong\u003e4 分钟\u003c/strong\u003e；大门站 \u003cstrong\u003eA2 出口约 2 分钟\u003c/strong\u003e；带大件行李可走 \u003cstrong\u003eA1 电梯出口约 3 分钟\u003c/strong\u003e。\u003c/td\u003e\n\u003ctd\u003e+81-3-5472-3434\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e公开资料：\u003ca href=\"https://plat-hostel-keikyu.com/hostel/kamakura-wave/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e镰仓酒店\u003c/a\u003e、\u003ca href=\"https://www.tenseien.co.jp/faq/?category=%E5%AE%BF%E6%B3%8A\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e天成园问答\u003c/a\u003e、\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e热川酒店\u003c/a\u003e、\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e滨松町名铁酒店交通\u003c/a\u003e与\u003ca href=\"https://www.m-inn.com/hamamatsucho/faq/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店问答\u003c/a\u003e。箱根、伊豆“含早晚餐”来自原稿，不是本轮重新核验的订房权益；具体餐次到店确认。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e滨松町名铁酒店行李安排\u003c/strong\u003e：官方说明可在入住日至退房日期间于前台寄存行李。因此 10/2 提前抵达仍按“先寄存、再游玩”安排，不把提前到达写成一定可以提前进房；大件数量、贵重物品与具体取件要求向前台确认。\u003ca href=\"https://www.m-inn.com/hamamatsucho/faq/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方问答\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e热川酒店当前接驳：\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e车站 → 酒店\u003c/strong\u003e：13:30、14:00、14:30、15:00、15:30、16:00、16:30。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e酒店 → 车站\u003c/strong\u003e：09:15、09:55、10:35、11:15。\u003c/li\u003e\n\u003cli\u003e出发前再核对。错过 16:30 不代表回不了酒店，而是需要步行或另行安排出租车；拖箱、下雨时留更多余量。\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e接驳信息\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e2. 票券选择：按路线买，不为了回本绕路\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e路段\u003c/th\u003e\n\u003cth\u003e本版选择\u003c/th\u003e\n\u003cth\u003e费用与边界\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e成田 → 镰仓\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e普通 JR 优先\u003c/strong\u003e，出关后选合适接续\u003c/td\u003e\n\u003ctd\u003e查询参考约 \u003cstrong\u003e2,420／人\u003c/strong\u003e；不默认 N’EX，也不为等直通车长时间空等。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/26 江之电\u003c/td\u003e\n\u003ctd\u003e普通一日券「のりおりくん」\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e800／人\u003c/strong\u003e；乘车少时再与单程票比较，餐饮另付。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/27—9/29 箱根\u003c/td\u003e\n\u003ctd\u003e小田原出发\u003cstrong\u003e三日周游券\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e6,400／人\u003c/strong\u003e；按 9/27 起用购买。镰仓到小田原、伊豆铁路、美术馆门票另计。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e9/29—9/30 伊豆高原巴士\u003c/td\u003e\n\u003ctd\u003e单程票与两日券比较后决定\u003c/td\u003e\n\u003ctd\u003e两日券目前 \u003cstrong\u003e1,800／人\u003c/strong\u003e；\u003cstrong\u003e2026/10/1 起销售价格调至 2,150\u003c/strong\u003e。不因酒店在票区外就否定它。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e箱根 → 伊豆、伊豆 → 东京\u003c/td\u003e\n\u003ctd\u003e普通车可选；踊り子是少换乘方案\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e基本运费＋特急附加费\u003c/strong\u003e，不能只拿基本运费预算特急。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e东京市内\u003c/td\u003e\n\u003ctd\u003e默认 IC 卡按次乘车\u003c/td\u003e\n\u003ctd\u003e路线含不同运营公司，不强行套地铁券。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e资料：\u003ca href=\"https://ekitan.com/transit/route/sf-1998/st-1865\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e机场参考\u003c/a\u003e、\u003ca href=\"https://www.enoden.co.jp/tourism/ticket/noriorikun/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e江之电一日券\u003c/a\u003e、\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e箱根周游券\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/ito_kanko_freepass.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东海巴士券与调价\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e巴士两日券这样算\u003c/strong\u003e：比较两天实际巴士费用，加上确实能用的景点优惠，再与票价比较。热川往返伊豆高原的铁路不包含；改为步行去海岸或两次使用不连续两天时重新算，不预设一定划算。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e美食券不作为默认。\u003c/strong\u003e 2,500 日元套餐的一日乘车券加四张兑换券，不等于四顿饭；一份商品可能用多张，周末还有限制。原文“省约 2,300 日元”的算法不再使用。\u003ca href=\"https://www.enoden.co.jp/tabemeguri-ticket/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e套餐说明\u003c/a\u003e\u003c/p\u003e\n", "plain": "1. 住宿信息和关键时间 地点 酒店与地址 关键时间／交通 联系方式 镰仓 plat hostel keikyu kamakura wave ；镰仓市由比ヶ浜 2-2-39 入住 16:00—22:30 ，退房 11:00；镰仓站步行约 5 分钟，海滩约 10 分钟；寄存存在收费项目。 +81-467-81-5005 箱根 Hakone Yumoto Onsen Tenseien／箱根汤本温泉 天成园 ；箱根町湯本 682 入住 15:00，退房 10:00；含晚餐方案注意 18:00 前入住 ，晚到提前联系。汤本站步行约 12 分钟。 原稿记录 +81-460-83-8511，出发前对照订单。 伊豆 Itoen Hotel Atagawa／伊東園ホテル熱川 ；东伊豆町奈良本 1267-2 车站步行约 10 分钟。原稿订单摘要写退房 10:00，官网通常为 11:00；本版安排更早离开，实际按订单执行。 +81-557-23-2200 东京 滨松町名铁酒店／Meitetsu Inn Hamamatsucho（名鉄イン浜松町） ；〒105-0013 东京都港区浜松町 1-19-14 通常 15:00 入住、10:00 退房 ，具体按订单。JR 滨松町北口步行约 4 分钟 ；大门站 A2 出口约 2 分钟 ；带大件行李可走 A1 电梯出口约 3 分钟 。 +81-3-5472-3434 公开资料： 镰仓酒店 、 天成园问答 、 热川酒店 、 滨松町名铁酒店交通 与 酒店问答 。箱根、伊豆“含早晚餐”来自原稿，不是本轮重新核验的订房权益；具体餐次到店确认。 滨松町名铁酒店行李安排 ：官方说明可在入住日至退房日期间于前台寄存行李。因此 10/2 提前抵达仍按“先寄存、再游玩”安排，不把提前到达写成一定可以提前进房；大件数量、贵重物品与具体取件要求向前台确认。 官方问答 热川酒店当前接驳： 车站 → 酒店 ：13:30、14:00、14:30、15:00、15:30、16:00、16:30。 酒店 → 车站 ：09:15、09:55、10:35、11:15。 出发前再核对。错过 16:30 不代表回不了酒店，而是需要步行或另行安排出租车；拖箱、下雨时留更多余量。 接驳信息 2. 票券选择：按路线买，不为了回本绕路 路段 本版选择 费用与边界 成田 → 镰仓 普通 JR n\u003ctd\u003e东京\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e滨松町名铁酒店／Meitetsu Inn Hamamatsucho（名鉄イン浜松町）\u003c/strong\u003e；〒105-0013 东京都港区浜松町 1-19-14\u003c/td\u003e\n\u003ctd\u003e通常 \u003cstrong\u003e15:00 入住、10:00 退房\u003c/strong\u003e，具体按订单。JR 滨松町北口步行约 \u003cstrong\u003e4 分钟\u003c/strong\u003e；大门站 \u003cstrong\u003eA2 出口约 2 分钟\u003c/strong\u003e；带大件行李可走 \u003cstrong\u003eA1 电梯出口约 3 分钟\u003c/strong\u003e。\u003c/td\u003e\n\u003ctd\u003e+81-3-5472-3434\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e公开资料：\u003ca href=\"https://plat-hostel-keikyu.com/hostel/kamakura-wave/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e镰仓酒店\u003c/a\u003e、\u003ca href=\"https://www.tenseien.co.jp/faq/?category=%E5%AE%BF%E6%B3%8A\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e天成园问答\u003c/a\u003e、\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e热川酒店\u003c/a\u003e、\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e滨松町名铁酒店交通\u003c/a\u003e与\u003ca href=\"https://www.m-inn.com/hamamatsucho/faq/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店问答\u003c/a\u003e。箱根、伊豆“含早晚餐”来自原稿，不是本轮重新核验的订房权益；具体餐次到店确认。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e滨松町名铁酒店行李安排\u003c/strong\u003e：官方说明可在入住日至退房日期间于前台寄存行李。因此 10/2 提前抵达仍按“先寄存、再游玩”安排，不把提前到达写成一定可以提前进房；大件数量、贵重物品与具体取件要求向前台确认。\u003ca href=\"https://www.m-inn.com/hamamatsucho/faq/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方问答\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e热川酒店当前接驳：\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e车站 → 酒店\u003c/strong\u003e：13:30、14:00、14:30、15:00、15:30、16:00、16:30。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e酒店 → 车站\u003c/strong\u003e：09:15、09:55、10:35、11:15。\u003c/li\u003e\n\u003cli\u003e出发前再核对。错过 16:30 不代表回不了酒店，而是需要步行或另行安排出租车；拖箱、下雨时留更多余量。\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e接驳信息\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n"}, {"id": "source-2", "title": "三、9/25—9/28：镰仓与箱根", "markdown": "", "html": "", "plain": ""}, {"id": "source-3", "title": "Day 1｜9/25 周五：成田落地，直接去镰仓", "markdown": "**住：plat hostel keikyu kamakura wave**  \n**主线：JL736 → 成田 T2／空港第2ビル站 → JR → 镰仓站 → 步行入住。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 15:55 | 按前文时间抵达成田，下机、入境、取行李。 |\n| 17:00—18:15 左右 | 根据实际出关时间乘车，不预设 17:00 一定办完。 |\n| 19:30—21:00 左右 | 正常接续下的酒店抵达规划范围；延误及时联系酒店。 |\n| 入住后 | 简单晚餐／便利店补给，休息；海滩散步不是必做项目。 |\n\n**普通 JR 有直通镰仓的班次，不必固定在东京换车。** 当前九月平日时刻表中，**空港第2ビル 17:01 出发，久里浜方向，约 19:25 到镰仓**。途中线路名称变化，但同一列车直通时不用下车。[JR 官方候选车次][airport-jr]\n\n前面查询也出现过 **18:04 出发、约 20:30 到镰仓**的接续，可作为较晚出关时的查询目标；必须输入 9/25 日期复核，不只记住截图时间。[路线查询][airport-fare]\n\n售票时直接说明终点 **鎌倉／Kamakura**。普通车不保证有座。N’EX 只在疲惫、行李不便或接续明显更好时升级；到大船仍要换车，途中经过北镰仓，并不是一站到镰仓。[JR 站序][airport-jr]\n\n到镰仓站后正常步行去酒店，不默认打车。酒店到海滩约 10 分钟，并非“楼下就是沙滩”。**22:30 是最晚入住要求**，不要与前台其他服务时段混淆。[酒店信息][hotel-kamakura]\n\n**删减规则：**晚到只办入住、吃饭。预计逼近 22:30 时提前电话沟通，不自行假设酒店会等到深夜。", "html": "\u003cp\u003e\u003cstrong\u003e住：plat hostel keikyu kamakura wave\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：JL736 → 成田 T2／空港第2ビル站 → JR → 镰仓站 → 步行入住。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:55\u003c/td\u003e\n\u003ctd\u003e按前文时间抵达成田，下机、入境、取行李。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e17:00—18:15 左右\u003c/td\u003e\n\u003ctd\u003e根据实际出关时间乘车，不预设 17:00 一定办完。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:30—21:00 左右\u003c/td\u003e\n\u003ctd\u003e正常接续下的酒店抵达规划范围；延误及时联系酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e入住后\u003c/td\u003e\n\u003ctd\u003e简单晚餐／便利店补给，休息；海滩散步不是必做项目。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e普通 JR 有直通镰仓的班次，不必固定在东京换车。\u003c/strong\u003e 当前九月平日时刻表中，\u003cstrong\u003e空港第2ビル 17:01 出发，久里浜方向，约 19:25 到镰仓\u003c/strong\u003e。途中线路名称变化，但同一列车直通时不用下车。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/110/114361.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方候选车次\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e前面查询也出现过 \u003cstrong\u003e18:04 出发、约 20:30 到镰仓\u003c/strong\u003e的接续，可作为较晚出关时的查询目标；必须输入 9/25 日期复核，不只记住截图时间。\u003ca href=\"https://ekitan.com/transit/route/sf-1998/st-1865\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e路线查询\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e售票时直接说明终点 \u003cstrong\u003e鎌倉／Kamakura\u003c/strong\u003e。普通车不保证有座。N’EX 只在疲惫、行李不便或接续明显更好时升级；到大船仍要换车，途中经过北镰仓，并不是一站到镰仓。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/110/114361.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 站序\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e到镰仓站后正常步行去酒店，不默认打车。酒店到海滩约 10 分钟，并非“楼下就是沙滩”。\u003cstrong\u003e22:30 是最晚入住要求\u003c/strong\u003e，不要与前台其他服务时段混淆。\u003ca href=\"https://plat-hostel-keikyu.com/hostel/kamakura-wave/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店信息\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**删减规则：**晚到只办入住、吃饭。预计逼近 22:30 时提前电话沟通，不自行假设酒店会等到深夜。\u003c/p\u003e\n", "plain": "住：plat hostel keikyu kamakura wave 主线：JL736 → 成田 T2／空港第2ビル站 → JR → 镰仓站 → 步行入住。 建议时间 安排 15:55 按前文时间抵达成田，下机、入境、取行李。 17:00—18:15 左右 根据实际出关时间乘车，不预设 17:00 一定办完。 19:30—21:00 左右 正常接续下的酒店抵达规划范围；延误及时联系酒店。 入住后 简单晚餐／便利店补给，休息；海滩散步不是必做项目。 普通 JR 有直通镰仓的班次，不必固定在东京换车。 当前九月平日时刻表中， 空港第2ビル 17:01 出发，久里浜方向，约 19:25 到镰仓 。途中线路名称变化，但同一列车直通时不用下车。 JR 官方候选车次 前面查询也出现过 18:04 出发、约 20:30 到镰仓 的接续，可作为较晚出关时的查询目标；必须输入 9/25 日期复核，不只记住截图时间。 路线查询 售票时直接说明终点 鎌倉／Kamakura 。普通车不保证有座。N’EX 只在疲惫、行李不便或接续明显更好时升级；到大船仍要换车，途中经过北镰仓，并不是一站到镰仓。 JR 站序 到镰仓站后正常步行去酒店，不默认打车。酒店到海滩约 10 分钟，并非“楼下就是沙滩”。 22:30 是最晚入住要求 ，不要与前台其他服务时段混淆。 酒店信息 **删减规则：**晚到只办入住、吃饭。预计逼近 22:30 时提前电话沟通，不自行假设酒店会等到深夜。"}, {"id": "source-4", "title": "Day 2｜9/26 周六：江之电海岸线与镰仓寺庙", "markdown": "**住：镰仓**  \n**主线：镰仓高校前 → 江之岛 → 长谷寺 → 镰仓大佛 → 由比滨。**\n\n保留原稿“上午先去高校前和江之岛、下午回长谷”的喜好，但缩减岛内支线，不把餐券店设为必须抵达的节点。\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00—08:40 | 酒店附近早餐，轻装出门。 |\n| 08:40—09:30 | 江之电去镰仓高校前，平交道和海边短停。 |\n| 09:30—10:15 | 去江之岛站，步行上岛；包括站外步行。 |\n| 10:15—12:45 | 神社、街区、岛上午餐，登塔或岩屋最多选一个。 |\n| 12:45—14:00 | 离岛、候车、乘江之电回长谷。 |\n| 14:00—15:15 | 长谷寺境内和见晴台。 |\n| 15:30—16:15 | 镰仓大佛；胎内参观按开放、排队情况决定。 |\n| 16:30—17:30 | 海岸散步；天气不好或疲惫就直接回酒店。 |\n| 18:00 后 | 镰仓站／酒店附近晚餐。 |\n\n**岛上默认：神社和街区＋午餐，有余量再登塔。** 偏爱岩屋就用它替换登塔，并减少其他支线，不同时完成三宫全程、岩屋、灯塔和离岛午餐。\n\n岩屋成人 **500 日元**，开放受季节和临时状况影响；不承诺某个潮位、富士山一定可见或固定日落机位。[岩屋信息][enoshima-iwaya]\n\n长谷寺当前 **08:00 开放、16:30 停止入场、17:00 闭山，成人 400 日元**。大佛参拜 **300**，胎内另 **50 日元**。[长谷寺][hasedera]／[高德院][daibutsu]\n\n**超时先删：登塔／岩屋、极乐寺短停、固定日落机位。** 下午先完成寺庙，不为拍照错过入场。极乐寺不作为必下车项目；拍平交道时不进入轨道或车道。\n\n**餐饮处理：**review 已指出 BREEZE BIRD 不能按 08:45 早餐安排，ミンナミ食堂周六兑券、ヨリドコロ日落后兑券也不适配原路线。本版早餐以按时吃到为先，午餐留江之岛，晚餐在镰仓附近；那些店只保留为候选，不为兑券绕路。", "html": "\u003cp\u003e\u003cstrong\u003e住：镰仓\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：镰仓高校前 → 江之岛 → 长谷寺 → 镰仓大佛 → 由比滨。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e保留原稿“上午先去高校前和江之岛、下午回长谷”的喜好，但缩减岛内支线，不把餐券店设为必须抵达的节点。\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00—08:40\u003c/td\u003e\n\u003ctd\u003e酒店附近早餐，轻装出门。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:40—09:30\u003c/td\u003e\n\u003ctd\u003e江之电去镰仓高校前，平交道和海边短停。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:30—10:15\u003c/td\u003e\n\u003ctd\u003e去江之岛站，步行上岛；包括站外步行。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:15—12:45\u003c/td\u003e\n\u003ctd\u003e神社、街区、岛上午餐，登塔或岩屋最多选一个。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:45—14:00\u003c/td\u003e\n\u003ctd\u003e离岛、候车、乘江之电回长谷。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—15:15\u003c/td\u003e\n\u003ctd\u003e长谷寺境内和见晴台。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:30—16:15\u003c/td\u003e\n\u003ctd\u003e镰仓大佛；胎内参观按开放、排队情况决定。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:30—17:30\u003c/td\u003e\n\u003ctd\u003e海岸散步；天气不好或疲惫就直接回酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e18:00 后\u003c/td\u003e\n\u003ctd\u003e镰仓站／酒店附近晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e岛上默认：神社和街区＋午餐，有余量再登塔。\u003c/strong\u003e 偏爱岩屋就用它替换登塔，并减少其他支线，不同时完成三宫全程、岩屋、灯塔和离岛午餐。\u003c/p\u003e\n\u003cp\u003e岩屋成人 \u003cstrong\u003e500 日元\u003c/strong\u003e，开放受季节和临时状况影响；不承诺某个潮位、富士山一定可见或固定日落机位。\u003ca href=\"https://www.fujisawa-kanko.jp/spot/enoshima/17.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e岩屋信息\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e长谷寺当前 \u003cstrong\u003e08:00 开放、16:30 停止入场、17:00 闭山，成人 400 日元\u003c/strong\u003e。大佛参拜 \u003cstrong\u003e300\u003c/strong\u003e，胎内另 \u003cstrong\u003e50 日元\u003c/strong\u003e。\u003ca href=\"https://www.hasedera.jp/guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e长谷寺\u003c/a\u003e／\u003ca href=\"https://www.kotoku-in.jp/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e高德院\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e超时先删：登塔／岩屋、极乐寺短停、固定日落机位。\u003c/strong\u003e 下午先完成寺庙，不为拍照错过入场。极乐寺不作为必下车项目；拍平交道时不进入轨道或车道。\u003c/p\u003e\n\u003cp\u003e**餐饮处理：**review 已指出 BREEZE BIRD 不能按 08:45 早餐安排，ミンナミ食堂周六兑券、ヨリドコロ日落后兑券也不适配原路线。本版早餐以按时吃到为先，午餐留江之岛，晚餐在镰仓附近；那些店只保留为候选，不为兑券绕路。\u003c/p\u003e\n", "plain": "住：镰仓 主线：镰仓高校前 → 江之岛 → 长谷寺 → 镰仓大佛 → 由比滨。 保留原稿“上午先去高校前和江之岛、下午回长谷”的喜好，但缩减岛内支线，不把餐券店设为必须抵达的节点。 建议时间 安排 08:00—08:40 酒店附近早餐，轻装出门。 08:40—09:30 江之电去镰仓高校前，平交道和海边短停。 09:30—10:15 去江之岛站，步行上岛；包括站外步行。 10:15—12:45 神社、街区、岛上午餐，登塔或岩屋最多选一个。 12:45—14:00 离岛、候车、乘江之电回长谷。 14:00—15:15 长谷寺境内和见晴台。 15:30—16:15 镰仓大佛；胎内参观按开放、排队情况决定。 16:30—17:30 海岸散步；天气不好或疲惫就直接回酒店。 18:00 后 镰仓站／酒店附近晚餐。 岛上默认：神社和街区＋午餐，有余量再登塔。 偏爱岩屋就用它替换登塔，并减少其他支线，不同时完成三宫全程、岩屋、灯塔和离岛午餐。 岩屋成人 500 日元 ，开放受季节和临时状况影响；不承诺某个潮位、富士山一定可见或固定日落机位。 岩屋信息 长谷寺当前 08:00 开放、16:30 停止入场、17:00 闭山，成人 400 日元 。大佛参拜 300 ，胎内另 50 日元 。 长谷寺 ／ 高德院 超时先删：登塔／岩屋、极乐寺短停、固定日落机位。 下午先完成寺庙，不为拍照错过入场。极乐寺不作为必下车项目；拍平交道时不进入轨道或车道。 **餐饮处理：**review 已指出 BREEZE BIRD 不能按 08:45 早餐安排，ミンナミ食堂周六兑券、ヨリドコロ日落后兑券也不适配原路线。本版早餐以按时吃到为先，午餐留江之岛，晚餐在镰仓附近；那些店只保留为候选，不为兑券绕路。"}, {"id": "source-5", "title": "Day 3｜9/27 周日：镰仓收尾，下午雕刻之森", "markdown": "**住：箱根天成园**  \n**主线：鹤冈八幡宫 → 小町通 → 镰仓 → 大船 → 小田原 → 箱根汤本 → 雕刻之森 → 天成园。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00 左右 | 退房或与酒店确认寄存，费用按规定。 |\n| 08:30—09:45 | 鹤冈八幡宫、段葛一带。 |\n| 10:00—10:30 | 小町通、买手信，不长时间排队用餐。 |\n| 10:30—11:00 | 取行李，到镰仓站。 |\n| 11:00 左右 | 经大船换 JR 东海道线去小田原。 |\n| 12:00—13:00 | 周游券、去箱根汤本、简餐与寄存，按实际接续调整。 |\n| 13:00—14:00 | 登山电车上山，步行入馆。 |\n| 14:00—16:00 | 雕刻之森美术馆。 |\n| 16:00—17:15 | 下山、取行李、到天成园。 |\n| 晚上 | 按酒店安排吃自助晚餐，之后泡汤。 |\n\n**这一版不保留 12:00「鰻のおかむら」午餐，也不承诺 15:00 已在酒店泡汤。** 想吃鳗鱼，可保留翌日元箱根长谷川为候选。这项取舍是为了留住美术馆，并释放 9/29 的时间。\n\n优先用箱根汤本站可用寄存设施；无合适柜位时先去酒店询问寄存，再上山，**相应缩短或取消美术馆**。不保证寄存免费，也不预设大件柜有空位。\n\n雕刻之森 **09:00—17:00，16:30 最后入馆**；成人现场 **2,000**、网上 **1,800 日元**。汤本上山留约 35—45 分钟车程，再加候车和步行，不是五分钟。[美术馆][hakone-museum]\n\n含晚餐方案注意天成园 **18:00 前入住**；预计晚到提前联系。延误时宁可早点离馆，也不拿酒店晚餐作赌注。[天成园问答][hotel-tenseien]", "html": "\u003cp\u003e\u003cstrong\u003e住：箱根天成园\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：鹤冈八幡宫 → 小町通 → 镰仓 → 大船 → 小田原 → 箱根汤本 → 雕刻之森 → 天成园。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00 左右\u003c/td\u003e\n\u003ctd\u003e退房或与酒店确认寄存，费用按规定。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—09:45\u003c/td\u003e\n\u003ctd\u003e鹤冈八幡宫、段葛一带。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:00—10:30\u003c/td\u003e\n\u003ctd\u003e小町通、买手信，不长时间排队用餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:30—11:00\u003c/td\u003e\n\u003ctd\u003e取行李，到镰仓站。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00 左右\u003c/td\u003e\n\u003ctd\u003e经大船换 JR 东海道线去小田原。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:00—13:00\u003c/td\u003e\n\u003ctd\u003e周游券、去箱根汤本、简餐与寄存，按实际接续调整。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—14:00\u003c/td\u003e\n\u003ctd\u003e登山电车上山，步行入馆。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—16:00\u003c/td\u003e\n\u003ctd\u003e雕刻之森美术馆。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—17:15\u003c/td\u003e\n\u003ctd\u003e下山、取行李、到天成园。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e晚上\u003c/td\u003e\n\u003ctd\u003e按酒店安排吃自助晚餐，之后泡汤。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e这一版不保留 12:00「鰻のおかむら」午餐，也不承诺 15:00 已在酒店泡汤。\u003c/strong\u003e 想吃鳗鱼，可保留翌日元箱根长谷川为候选。这项取舍是为了留住美术馆，并释放 9/29 的时间。\u003c/p\u003e\n\u003cp\u003e优先用箱根汤本站可用寄存设施；无合适柜位时先去酒店询问寄存，再上山，\u003cstrong\u003e相应缩短或取消美术馆\u003c/strong\u003e。不保证寄存免费，也不预设大件柜有空位。\u003c/p\u003e\n\u003cp\u003e雕刻之森 \u003cstrong\u003e09:00—17:00，16:30 最后入馆\u003c/strong\u003e；成人现场 \u003cstrong\u003e2,000\u003c/strong\u003e、网上 \u003cstrong\u003e1,800 日元\u003c/strong\u003e。汤本上山留约 35—45 分钟车程，再加候车和步行，不是五分钟。\u003ca href=\"https://www.hakone-oam.or.jp/info/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e美术馆\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e含晚餐方案注意天成园 \u003cstrong\u003e18:00 前入住\u003c/strong\u003e；预计晚到提前联系。延误时宁可早点离馆，也不拿酒店晚餐作赌注。\u003ca href=\"https://www.tenseien.co.jp/faq/?category=%E5%AE%BF%E6%B3%8A\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e天成园问答\u003c/a\u003e\u003c/p\u003e\n", "plain": "住：箱根天成园 主线：鹤冈八幡宫 → 小町通 → 镰仓 → 大船 → 小田原 → 箱根汤本 → 雕刻之森 → 天成园。 建议时间 安排 08:00 左右 退房或与酒店确认寄存，费用按规定。 08:30—09:45 鹤冈八幡宫、段葛一带。 10:00—10:30 小町通、买手信，不长时间排队用餐。 10:30—11:00 取行李，到镰仓站。 11:00 左右 经大船换 JR 东海道线去小田原。 12:00—13:00 周游券、去箱根汤本、简餐与寄存，按实际接续调整。 13:00—14:00 登山电车上山，步行入馆。 14:00—16:00 雕刻之森美术馆。 16:00—17:15 下山、取行李、到天成园。 晚上 按酒店安排吃自助晚餐，之后泡汤。 这一版不保留 12:00「鰻のおかむら」午餐，也不承诺 15:00 已在酒店泡汤。 想吃鳗鱼，可保留翌日元箱根长谷川为候选。这项取舍是为了留住美术馆，并释放 9/29 的时间。 优先用箱根汤本站可用寄存设施；无合适柜位时先去酒店询问寄存，再上山， 相应缩短或取消美术馆 。不保证寄存免费，也不预设大件柜有空位。 雕刻之森 09:00—17:00，16:30 最后入馆 ；成人现场 2,000 、网上 1,800 日元 。汤本上山留约 35—45 分钟车程，再加候车和步行，不是五分钟。 美术馆 含晚餐方案注意天成园 18:00 前入住 ；预计晚到提前联系。延误时宁可早点离馆，也不拿酒店晚餐作赌注。 天成园问答"}, {"id": "source-6", "title": "Day 4｜9/28 周一：箱根环线与温泉", "markdown": "**住：箱根天成园**  \n**主线：汤本 → 强罗 → 早云山 → 大涌谷 → 桃源台 → 元箱根港 → 箱根神社 → 汤本。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00 前后 | 早餐，查看缆车、游船运行公告。 |\n| 08:30—10:00 | 登山电车到强罗、缆车到早云山、空中缆车到大涌谷。 |\n| 10:00—11:00 | 大涌谷观景、黑蛋等简单体验。 |\n| 11:00—12:15 | 去桃源台，候船、乘海贼船，按当天停靠顺序。 |\n| 12:15—14:15 | **元箱根港**下船，午餐、箱根神社和湖边。 |\n| 14:15—15:30 | 鸟居拍照或散步，随后候车回汤本；排队过长就不等。 |\n| 16:00—17:00 左右 | 回酒店，休息、泡汤。 |\n| 晚上 | 酒店晚餐。 |\n\n神社与**元箱根港**衔接，官方参考步行约 10 分钟。不去箱根关所、旧街道时，不特地在箱根町下船再折返。[神社交通][hakone-shrine]\n\n湖边回汤本巴士按**约 35—60 分钟排程余量**考虑，另留候车与拥堵时间。上车核对运营公司、线路和周游券覆盖范围。[周游券][hakone-pass]\n\n午餐保留 **鳗鱼长谷川元箱根本店**为候选，定位在元箱根码头附近；尚未预约，满位则换就近午餐。[餐厅官网][hakone-eel]\n\n不加入已闭馆的小王子博物馆，不重复美术馆，也不把“覆盖八类交通”理解成“必须坐完八种”。缆车、游船停运时按当天公告缩减，**不预设一定有免费替代巴士**；天气不好早点回酒店即可。", "html": "\u003cp\u003e\u003cstrong\u003e住：箱根天成园\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：汤本 → 强罗 → 早云山 → 大涌谷 → 桃源台 → 元箱根港 → 箱根神社 → 汤本。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00 前后\u003c/td\u003e\n\u003ctd\u003e早餐，查看缆车、游船运行公告。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—10:00\u003c/td\u003e\n\u003ctd\u003e登山电车到强罗、缆车到早云山、空中缆车到大涌谷。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:00—11:00\u003c/td\u003e\n\u003ctd\u003e大涌谷观景、黑蛋等简单体验。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00—12:15\u003c/td\u003e\n\u003ctd\u003e去桃源台，候船、乘海贼船，按当天停靠顺序。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:15—14:15\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e元箱根港\u003c/strong\u003e下船，午餐、箱根神社和湖边。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:15—15:30\u003c/td\u003e\n\u003ctd\u003e鸟居拍照或散步，随后候车回汤本；排队过长就不等。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—17:00 左右\u003c/td\u003e\n\u003ctd\u003e回酒店，休息、泡汤。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e晚上\u003c/td\u003e\n\u003ctd\u003e酒店晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e神社与\u003cstrong\u003e元箱根港\u003c/strong\u003e衔接，官方参考步行约 10 分钟。不去箱根关所、旧街道时，不特地在箱根町下船再折返。\u003ca href=\"https://hakonejinja.or.jp/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e神社交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e湖边回汤本巴士按\u003cstrong\u003e约 35—60 分钟排程余量\u003c/strong\u003e考虑，另留候车与拥堵时间。上车核对运营公司、线路和周游券覆盖范围。\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e周游券\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e午餐保留 \u003cstrong\u003e鳗鱼长谷川元箱根本店\u003c/strong\u003e为候选，定位在元箱根码头附近；尚未预约，满位则换就近午餐。\u003ca href=\"https://www.unagi-hasegawa-hakone.com/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e餐厅官网\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e不加入已闭馆的小王子博物馆，不重复美术馆，也不把“覆盖八类交通”理解成“必须坐完八种”。缆车、游船停运时按当天公告缩减，\u003cstrong\u003e不预设一定有免费替代巴士\u003c/strong\u003e；天气不好早点回酒店即可。\u003c/p\u003e\n", "plain": "住：箱根天成园 主线：汤本 → 强罗 → 早云山 → 大涌谷 → 桃源台 → 元箱根港 → 箱根神社 → 汤本。 建议时间 安排 08:00 前后 早餐，查看缆车、游船运行公告。 08:30—10:00 登山电车到强罗、缆车到早云山、空中缆车到大涌谷。 10:00—11:00 大涌谷观景、黑蛋等简单体验。 11:00—12:15 去桃源台，候船、乘海贼船，按当天停靠顺序。 12:15—14:15 元箱根港 下船，午餐、箱根神社和湖边。 14:15—15:30 鸟居拍照或散步，随后候车回汤本；排队过长就不等。 16:00—17:00 左右 回酒店，休息、泡汤。 晚上 酒店晚餐。 神社与 元箱根港 衔接，官方参考步行约 10 分钟。不去箱根关所、旧街道时，不特地在箱根町下船再折返。 神社交通 湖边回汤本巴士按 约 35—60 分钟排程余量 考虑，另留候车与拥堵时间。上车核对运营公司、线路和周游券覆盖范围。 周游券 午餐保留 鳗鱼长谷川元箱根本店 为候选，定位在元箱根码头附近；尚未预约，满位则换就近午餐。 餐厅官网 不加入已闭馆的小王子博物馆，不重复美术馆，也不把“覆盖八类交通”理解成“必须坐完八种”。缆车、游船停运时按当天公告缩减， 不预设一定有免费替代巴士 ；天气不好早点回酒店即可。"}, {"id": "source-7", "title": "四、9/29—10/2：伊豆与进东京的衔接", "markdown": "### 先记住伊豆的方向\n\n以下是**主要站点示意，不是完整站表**：\n\n```text\n北\n热海\n  │ JR 伊东线\n伊东\n  │ 伊豆急行线\n城崎海岸\n伊豆高原\n伊豆大川\n伊豆北川\n伊豆热川【酒店】\n片濑白田\n伊豆稻取\n河津\n南\n```\n\n**伊豆高原在热川北边，稻取、河津在热川南边。** 热海到热川不是 20 分钟，热川到伊豆高原也不是一站三分钟。\n\n| 普通电车路段 | 排程参考，不含候车／步行 | 当前成人单程普通纸票 |\n|---|---:|---:|\n| 伊豆热川 ↔ 热海 | 约 65—80 分钟 | 1,520 |\n| 伊豆热川 ↔ 伊豆高原 | 约 15—25 分钟 | 470 |\n| 伊豆热川 ↔ 伊豆北川 | 短程，按实际班次衔接 | 190 |\n| 伊豆热川 ↔ 伊豆稻取 | 约 10—15 分钟 | 280 |\n| 伊豆热川 ↔ 河津 | 约 20—30 分钟 | 560 |\n\n票价依据[伊豆急官方运价表][izu-fare]；IC 价格可能略有差异。时间沿用 review 的规划区间，不是所有车次相同，也不能套用成特急时间。", "html": "\u003ch3\u003e先记住伊豆的方向\u003c/h3\u003e\n\u003cp\u003e以下是\u003cstrong\u003e主要站点示意，不是完整站表\u003c/strong\u003e：\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e北\n热海\n  │ JR 伊东线\n伊东\n  │ 伊豆急行线\n城崎海岸\n伊豆高原\n伊豆大川\n伊豆北川\n伊豆热川【酒店】\n片濑白田\n伊豆稻取\n河津\n南\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003e伊豆高原在热川北边，稻取、河津在热川南边。\u003c/strong\u003e 热海到热川不是 20 分钟，热川到伊豆高原也不是一站三分钟。\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e普通电车路段\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003e排程参考，不含候车／步行\u003c/th\u003e\n\u003cth style=\"text-align:right\"\u003e当前成人单程普通纸票\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 热海\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 65—80 分钟\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e1,520\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 伊豆高原\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 15—25 分钟\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e470\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 伊豆北川\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e短程，按实际班次衔接\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e190\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 伊豆稻取\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 10—15 分钟\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e280\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e伊豆热川 ↔ 河津\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e约 20—30 分钟\u003c/td\u003e\n\u003ctd style=\"text-align:right\"\u003e560\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e票价依据\u003ca href=\"https://www.izukyu.co.jp/fares/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e伊豆急官方运价表\u003c/a\u003e；IC 价格可能略有差异。时间沿用 review 的规划区间，不是所有车次相同，也不能套用成特急时间。\u003c/p\u003e\n", "plain": "先记住伊豆的方向 以下是 主要站点示意，不是完整站表 ： 北\n热海\n  │ JR 伊东线\n伊东\n  │ 伊豆急行线\n城崎海岸\n伊豆高原\n伊豆大川\n伊豆北川\n伊豆热川【酒店】\n片濑白田\n伊豆稻取\n河津\n南 伊豆高原在热川北边，稻取、河津在热川南边。 热海到热川不是 20 分钟，热川到伊豆高原也不是一站三分钟。 普通电车路段 排程参考，不含候车／步行 当前成人单程普通纸票 伊豆热川 ↔ 热海 约 65—80 分钟 1,520 伊豆热川 ↔ 伊豆高原 约 15—25 分钟 470 伊豆热川 ↔ 伊豆北川 短程，按实际班次衔接 190 伊豆热川 ↔ 伊豆稻取 约 10—15 分钟 280 伊豆热川 ↔ 河津 约 20—30 分钟 560 票价依据 伊豆急官方运价表 ；IC 价格可能略有差异。时间沿用 review 的规划区间，不是所有车次相同，也不能套用成特急时间。"}, {"id": "source-8", "title": "Day 5｜9/29 周二：转场伊豆，城崎海岸短线", "markdown": "**住：伊东园酒店热川**  \n**主线：天成园退房 → 小田原 → 伊豆高原寄存 → 城崎海岸 → 伊豆高原取行李 → 热川。**\n\n### 两种进伊豆的方式\n\n**少换乘版，优先查询候选车次：**\n\n\u003e **踊り子 1 号：小田原 10:01 → 伊豆高原 11:02。**  \n\u003e 当前 JR 公布时刻，不代表已买票或保证有座。[JR 官方车次][odoriko-1]\n\n建议约 **08:45 离开天成园**，预留到小田原、进站、找站台和买票时间。注意连接不同目的地车厢的情况：**去伊豆高原要坐「伊豆急下田」方向车厢，不是「修善寺」方向。** 以票面车厢和现场显示为准。\n\n**省钱版：小田原 → 热海 → 伊东／伊豆高原的普通电车接续。**\n\n目标在 **12:00 前后到伊豆高原**，按当天换乘查实际抵达时间，不能把普通车写成与特急同样用时。小田原到伊豆高原普通纸票参考 **1,470 日元**；特急另付附加费。汤本到小田原按周游券适用范围乘坐，不重复计费。[伊豆急运价][izu-fare]／[箱根周游券][hakone-pass]\n\n### 以 11 点左右到伊豆高原为基础的安排\n\n| 建议时间 | 安排 |\n|---|---|\n| 11:00—11:45 | 寄存行李、简餐、确认海岸往返交通。 |\n| 11:45—14:00 | 前往海岸，游览门胁吊桥、灯塔周边和一段步道。 |\n| 14:00—15:00 | 回伊豆高原站取行李。 |\n| 15:00—16:15 | 电车去伊豆热川，按到站时间衔接酒店接驳。 |\n| 16:00—17:00 左右 | 入住、休息，按酒店场次吃晚餐。 |\n\n### 先存好行李，再去海岸\n\n伊豆高原站设有寄存柜，但**不保证到站时有适合大件行李的空位**。[站内设施][izu-kogen-station]\n\n寄存失败、明显晚到或天气不适合走海岸时，直接去热川酒店。城崎海岸改为 **10/1 的替换项目**，不硬塞回大室山和动物公园那一天。\n\n### 海岸交通要选对站\n\n**巴士候选：伊豆高原站 →「伊豆海洋公園」→ 按现场步道前往门胁吊桥。** 下车后仍有步行，不是公交直接停在吊桥上；发车、步道入口与回程路线按官方查询及现场信息确认。[东海巴士查询][tokai-search]\n\n**不等巴士的备选：电车到「城ヶ崎海岸」站，再步行去海岸。** 官网车站到景区参考约 **35 分钟**，往返步行必须单独计入，不能当成“站口就是海”。[海岸交通][jogasaki]\n\n今天只走短线，不按九公里全线徒步安排。门胁灯塔按现场开放参观，不再沿用原稿“灯塔 300 日元”的预算。\n\n**删减规则：**普通车接续导致较晚到达时，缩短停留；约 12:30 后才解决好行李和午餐，就重新评估是否取消海岸，不牺牲入住与晚餐。", "html": "\u003cp\u003e\u003cstrong\u003e住：伊东园酒店热川\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：天成园退房 → 小田原 → 伊豆高原寄存 → 城崎海岸 → 伊豆高原取行李 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\u003ch3\u003e两种进伊豆的方式\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e少换乘版，优先查询候选车次：\u003c/strong\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e踊り子 1 号：小田原 10:01 → 伊豆高原 11:02。\u003c/strong\u003e\u003cbr/\u003e\n当前 JR 公布时刻，不代表已买票或保证有座。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098941.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方车次\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e建议约 \u003cstrong\u003e08:45 离开天成园\u003c/strong\u003e，预留到小田原、进站、找站台和买票时间。注意连接不同目的地车厢的情况：\u003cstrong\u003e去伊豆高原要坐「伊豆急下田」方向车厢，不是「修善寺」方向。\u003c/strong\u003e 以票面车厢和现场显示为准。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e省钱版：小田原 → 热海 → 伊东／伊豆高原的普通电车接续。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e目标在 \u003cstrong\u003e12:00 前后到伊豆高原\u003c/strong\u003e，按当天换乘查实际抵达时间，不能把普通车写成与特急同样用时。小田原到伊豆高原普通纸票参考 \u003cstrong\u003e1,470 日元\u003c/strong\u003e；特急另付附加费。汤本到小田原按周游券适用范围乘坐，不重复计费。\u003ca href=\"https://www.izukyu.co.jp/fares/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e伊豆急运价\u003c/a\u003e／\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e箱根周游券\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e以 11 点左右到伊豆高原为基础的安排\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00—11:45\u003c/td\u003e\n\u003ctd\u003e寄存行李、简餐、确认海岸往返交通。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:45—14:00\u003c/td\u003e\n\u003ctd\u003e前往海岸，游览门胁吊桥、灯塔周边和一段步道。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—15:00\u003c/td\u003e\n\u003ctd\u003e回伊豆高原站取行李。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:00—16:15\u003c/td\u003e\n\u003ctd\u003e电车去伊豆热川，按到站时间衔接酒店接驳。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—17:00 左右\u003c/td\u003e\n\u003ctd\u003e入住、休息，按酒店场次吃晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch3\u003e先存好行李，再去海岸\u003c/h3\u003e\n\u003cp\u003e伊豆高原站设有寄存柜，但\u003cstrong\u003e不保证到站时有适合大件行李的空位\u003c/strong\u003e。\u003ca href=\"https://www.izukyu.co.jp/train/station_detail.php?station=%E4%BC%8A%E8%B1%86%E9%AB%98%E5%8E%9F%E9%A7%85\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e站内设施\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e寄存失败、明显晚到或天气不适合走海岸时，直接去热川酒店。城崎海岸改为 \u003cstrong\u003e10/1 的替换项目\u003c/strong\u003e，不硬塞回大室山和动物公园那一天。\u003c/p\u003e\n\u003ch3\u003e海岸交通要选对站\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e巴士候选：伊豆高原站 →「伊豆海洋公園」→ 按现场步道前往门胁吊桥。\u003c/strong\u003e 下车后仍有步行，不是公交直接停在吊桥上；发车、步道入口与回程路线按官方查询及现场信息确认。\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东海巴士查询\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e不等巴士的备选：电车到「城ヶ崎海岸」站，再步行去海岸。\u003c/strong\u003e 官网车站到景区参考约 \u003cstrong\u003e35 分钟\u003c/strong\u003e，往返步行必须单独计入，不能当成“站口就是海”。\u003ca href=\"https://itospa.com/spot/detail_54002.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e海岸交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e今天只走短线，不按九公里全线徒步安排。门胁灯塔按现场开放参观，不再沿用原稿“灯塔 300 日元”的预算。\u003c/p\u003e\n\u003cp\u003e**删减规则：**普通车接续导致较晚到达时，缩短停留；约 12:30 后才解决好行李和午餐，就重新评估是否取消海岸，不牺牲入住与晚餐。\u003c/p\u003e\n", "plain": "住：伊东园酒店热川 主线：天成园退房 → 小田原 → 伊豆高原寄存 → 城崎海岸 → 伊豆高原取行李 → 热川。 两种进伊豆的方式 少换乘版，优先查询候选车次： 踊り子 1 号：小田原 10:01 → 伊豆高原 11:02。 当前 JR 公布时刻，不代表已买票或保证有座。 JR 官方车次 建议约 08:45 离开天成园 ，预留到小田原、进站、找站台和买票时间。注意连接不同目的地车厢的情况： 去伊豆高原要坐「伊豆急下田」方向车厢，不是「修善寺」方向。 以票面车厢和现场显示为准。 省钱版：小田原 → 热海 → 伊东／伊豆高原的普通电车接续。 目标在 12:00 前后到伊豆高原 ，按当天换乘查实际抵达时间，不能把普通车写成与特急同样用时。小田原到伊豆高原普通纸票参考 1,470 日元 ；特急另付附加费。汤本到小田原按周游券适用范围乘坐，不重复计费。 伊豆急运价 ／ 箱根周游券 以 11 点左右到伊豆高原为基础的安排 建议时间 安排 11:00—11:45 寄存行李、简餐、确认海岸往返交通。 11:45—14:00 前往海岸，游览门胁吊桥、灯塔周边和一段步道。 14:00—15:00 回伊豆高原站取行李。 15:00—16:15 电车去伊豆热川，按到站时间衔接酒店接驳。 16:00—17:00 左右 入住、休息，按酒店场次吃晚餐。 先存好行李，再去海岸 伊豆高原站设有寄存柜，但 不保证到站时有适合大件行李的空位 。 站内设施 寄存失败、明显晚到或天气不适合走海岸时，直接去热川酒店。城崎海岸改为 10/1 的替换项目 ，不硬塞回大室山和动物公园那一天。 海岸交通要选对站 巴士候选：伊豆高原站 →「伊豆海洋公園」→ 按现场步道前往门胁吊桥。 下车后仍有步行，不是公交直接停在吊桥上；发车、步道入口与回程路线按官方查询及现场信息确认。 东海巴士查询 不等巴士的备选：电车到「城ヶ崎海岸」站，再步行去海岸。 官网车站到景区参考约 35 分钟 ，往返步行必须单独计入，不能当成“站口就是海”。 海岸交通 今天只走短线，不按九公里全线徒步安排。门胁灯塔按现场开放参观，不再沿用原稿“灯塔 300 日元”的预算。 **删减规则：**普通车接续导致较晚到达时，缩短停留；约 12:30 后才解决好行李和午餐，就重新评估是否取消海岸，不牺牲入住与晚餐。"}, {"id": "source-9", "title": "Day 6｜9/30 周三：大室山＋仙人掌动物公园", "markdown": "**住：伊豆热川**  \n**主线：热川 → 伊豆高原 → 巴士「シャボテン公園」→ 大室山 → 仙人掌动物公园 → 热川。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00—09:00 | 早餐、看大室山运行公告、查回程巴士。 |\n| 09:00—10:30 | 去伊豆高原转巴士；可使用酒店 09:15 接驳。 |\n| 10:30—11:45 | 大室山缆椅、山顶环行和拍照。 |\n| 11:45—12:30 | 午餐。 |\n| 12:30—15:00 | 动物公园，按兴趣选区域，不排满所有互动。 |\n| 15:00—17:00 | 巴士、电车返程；有酒店接驳则乘，错过则步行或另行安排。 |\n| 晚上 | 酒店晚餐和温泉。 |\n\n大室山成人往返缆椅 **1,000 日元**，山顶绕行约 20—30 分钟，另算排队和拍照。官网区分季节：**3—9 月通常营业至 17:00，10—2 月通常至 16:00**，实际受天气影响。挪到 10/1 时不能套用九月时间。[营业与费用][omuro]\n\n动物公园当前成人普通票为**平日 2,800、周末及指定假期 3,000 日元**；额外体验另计。九月底以参观动物和植物为主，不把“水豚泡温泉”作为一定能看到的节目。[动物公园票价][shaboten]\n\n**去回程查明确站名：伊豆高原駅／シャボテン公園。** 不用“每小时 :45、:59”猜班次。酒店 16:30 接驳末班不是游览的绝对截止线，但必须知道后面怎么回去，且不影响晚餐。[巴士查询][tokai-search]／[酒店接驳][hotel-atagawa]\n\n**天气调整：**可与 10/1 对调，把较好的风况和能见度留给大室山。若强风、暴雨或步道封闭，就减少户外活动，不能自动改去海岸或瀑布。换日后同时重查巴士券有效期、营业时间与晚餐衔接。", "html": "\u003cp\u003e\u003cstrong\u003e住：伊豆热川\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：热川 → 伊豆高原 → 巴士「シャボテン公園」→ 大室山 → 仙人掌动物公园 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00—09:00\u003c/td\u003e\n\u003ctd\u003e早餐、看大室山运行公告、查回程巴士。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:00—10:30\u003c/td\u003e\n\u003ctd\u003e去伊豆高原转巴士；可使用酒店 09:15 接驳。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:30—11:45\u003c/td\u003e\n\u003ctd\u003e大室山缆椅、山顶环行和拍照。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:45—12:30\u003c/td\u003e\n\u003ctd\u003e午餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:30—15:00\u003c/td\u003e\n\u003ctd\u003e动物公园，按兴趣选区域，不排满所有互动。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:00—17:00\u003c/td\u003e\n\u003ctd\u003e巴士、电车返程；有酒店接驳则乘，错过则步行或另行安排。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e晚上\u003c/td\u003e\n\u003ctd\u003e酒店晚餐和温泉。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e大室山成人往返缆椅 \u003cstrong\u003e1,000 日元\u003c/strong\u003e，山顶绕行约 20—30 分钟，另算排队和拍照。官网区分季节：\u003cstrong\u003e3—9 月通常营业至 17:00，10—2 月通常至 16:00\u003c/strong\u003e，实际受天气影响。挪到 10/1 时不能套用九月时间。\u003ca href=\"https://omuroyama.com/hours_fare/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e营业与费用\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e动物公园当前成人普通票为\u003cstrong\u003e平日 2,800、周末及指定假期 3,000 日元\u003c/strong\u003e；额外体验另计。九月底以参观动物和植物为主，不把“水豚泡温泉”作为一定能看到的节目。\u003ca href=\"https://izushaboten.com/news/entrance-fee/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e动物公园票价\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e去回程查明确站名：伊豆高原駅／シャボテン公園。\u003c/strong\u003e 不用“每小时 :45、:59”猜班次。酒店 16:30 接驳末班不是游览的绝对截止线，但必须知道后面怎么回去，且不影响晚餐。\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e巴士查询\u003c/a\u003e／\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店接驳\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**天气调整：**可与 10/1 对调，把较好的风况和能见度留给大室山。若强风、暴雨或步道封闭，就减少户外活动，不能自动改去海岸或瀑布。换日后同时重查巴士券有效期、营业时间与晚餐衔接。\u003c/p\u003e\n", "plain": "住：伊豆热川 主线：热川 → 伊豆高原 → 巴士「シャボテン公園」→ 大室山 → 仙人掌动物公园 → 热川。 建议时间 安排 08:00—09:00 早餐、看大室山运行公告、查回程巴士。 09:00—10:30 去伊豆高原转巴士；可使用酒店 09:15 接驳。 10:30—11:45 大室山缆椅、山顶环行和拍照。 11:45—12:30 午餐。 12:30—15:00 动物公园，按兴趣选区域，不排满所有互动。 15:00—17:00 巴士、电车返程；有酒店接驳则乘，错过则步行或另行安排。 晚上 酒店晚餐和温泉。 大室山成人往返缆椅 1,000 日元 ，山顶绕行约 20—30 分钟，另算排队和拍照。官网区分季节： 3—9 月通常营业至 17:00，10—2 月通常至 16:00 ，实际受天气影响。挪到 10/1 时不能套用九月时间。 营业与费用 动物公园当前成人普通票为 平日 2,800、周末及指定假期 3,000 日元 ；额外体验另计。九月底以参观动物和植物为主，不把“水豚泡温泉”作为一定能看到的节目。 动物公园票价 去回程查明确站名：伊豆高原駅／シャボテン公園。 不用“每小时 :45、:59”猜班次。酒店 16:30 接驳末班不是游览的绝对截止线，但必须知道后面怎么回去，且不影响晚餐。 巴士查询 ／ 酒店接驳 **天气调整：**可与 10/1 对调，把较好的风况和能见度留给大室山。若强风、暴雨或步道封闭，就减少户外活动，不能自动改去海岸或瀑布。换日后同时重查巴士券有效期、营业时间与晚餐衔接。"}, {"id": "source-10", "title": "Day 7｜10/1 周四：伊豆弹性日，三套只选一套", "markdown": "### 默认：河津七滝，下午回热川\n\n**主线：热川 → 河津站 → 巴士 → 七滝步道 → 河津站 → 热川。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:30—10:15 | 离开酒店，电车到河津，再按已查好的巴士进山。 |\n| 10:15—12:45 | 溪谷和瀑布步道，留台阶、拍照、休息时间。 |\n| 12:45—13:30 | 简餐，地点不能影响回程巴士。 |\n| 13:30—15:30 | 巴士、电车返回；接续不佳时顺延。 |\n| 15:30—16:30 左右 | 回酒店休息，晚上吃酒店晚餐。 |\n\n计划从上游往下游走时，去程可查询 **「河津七滝遊歩道上入口」**，回程查询 **「河津七滝」**，不是同一站。上入口按约 **30—40 分钟巴士排程余量**考虑，具体停靠、班次和通行情况出发前确认。\n\n不承诺所有步道及七处瀑布当天全部开放，不为凑齐数量进入封闭路段。资料：[七滝观光协会][nanadaru]、[巴士查询][tokai-search]。\n\n**不再加石廊崎、修善寺或热海。** 电车接巴士加溪谷步行，已经是完整的一天。\n\n### 替换一：热海小镇＋黒根岩温泉\n\n保留原稿偏好，使用修正后的交通时间。\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:30—10:15 | 热川北上热海，包含候车与步行。 |\n| 10:15—12:30 | 来宫神社、商店街，减少支线。 |\n| 12:30—13:15 | 午餐，附近海边短走。 |\n| 13:15—14:45 | 电车南下伊豆北川，再步行到温泉。 |\n| 14:45—15:45 | 黒根岩風呂，按当天开放执行。 |\n| 15:45—17:00 | 返回热川酒店。 |\n\n**不加热海城。** 从热海南下先到北川、后到热川，不需要先坐过酒店站再倒回来。\n\n黒根岩当前 **10:00—18:00、17:45 最晚入场，成人 700 日元**，男女分浴。官网列有 PayPay，不再写“只收现金”；游客仍可备好现金、小毛巾，遵守浴场规定，不随意拍摄他人。[北川温泉官网][kurone]\n\n这套不是“近、零风险的轻松日”，有较长电车往返；偏爱小镇和海边温泉再选。\n\n### 替换二：北川温泉半日＋热川休息\n\n不去热海，也不去河津。早餐后慢慢出门，中午用餐，白天去黒根岩，下午回热川休息。\n\n若 9/29 海岸取消，也可将今天换成**城崎海岸专门日**，而不是把海岸、河津和温泉全部留下。\n\n\u003e **稻取雛之馆不要直接挪来今天：周四通常休馆。** 它保留在 10/2 替换段，与东京半日明确取舍。[开放信息][hina]", "html": "\u003ch3\u003e默认：河津七滝，下午回热川\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e主线：热川 → 河津站 → 巴士 → 七滝步道 → 河津站 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—10:15\u003c/td\u003e\n\u003ctd\u003e离开酒店，电车到河津，再按已查好的巴士进山。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:15—12:45\u003c/td\u003e\n\u003ctd\u003e溪谷和瀑布步道，留台阶、拍照、休息时间。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:45—13:30\u003c/td\u003e\n\u003ctd\u003e简餐，地点不能影响回程巴士。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:30—15:30\u003c/td\u003e\n\u003ctd\u003e巴士、电车返回；接续不佳时顺延。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:30—16:30 左右\u003c/td\u003e\n\u003ctd\u003e回酒店休息，晚上吃酒店晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e计划从上游往下游走时，去程可查询 \u003cstrong\u003e「河津七滝遊歩道上入口」\u003c/strong\u003e，回程查询 \u003cstrong\u003e「河津七滝」\u003c/strong\u003e，不是同一站。上入口按约 \u003cstrong\u003e30—40 分钟巴士排程余量\u003c/strong\u003e考虑，具体停靠、班次和通行情况出发前确认。\u003c/p\u003e\n\u003cp\u003e不承诺所有步道及七处瀑布当天全部开放，不为凑齐数量进入封闭路段。资料：\u003ca href=\"https://www.nanadaru.com/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e七滝观光协会\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e巴士查询\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e不再加石廊崎、修善寺或热海。\u003c/strong\u003e 电车接巴士加溪谷步行，已经是完整的一天。\u003c/p\u003e\n\u003ch3\u003e替换一：热海小镇＋黒根岩温泉\u003c/h3\u003e\n\u003cp\u003e保留原稿偏好，使用修正后的交通时间。\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—10:15\u003c/td\u003e\n\u003ctd\u003e热川北上热海，包含候车与步行。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:15—12:30\u003c/td\u003e\n\u003ctd\u003e来宫神社、商店街，减少支线。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:30—13:15\u003c/td\u003e\n\u003ctd\u003e午餐，附近海边短走。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:15—14:45\u003c/td\u003e\n\u003ctd\u003e电车南下伊豆北川，再步行到温泉。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:45—15:45\u003c/td\u003e\n\u003ctd\u003e黒根岩風呂，按当天开放执行。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:45—17:00\u003c/td\u003e\n\u003ctd\u003e返回热川酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e不加热海城。\u003c/strong\u003e 从热海南下先到北川、后到热川，不需要先坐过酒店站再倒回来。\u003c/p\u003e\n\u003cp\u003e黒根岩当前 \u003cstrong\u003e10:00—18:00、17:45 最晚入场，成人 700 日元\u003c/strong\u003e，男女分浴。官网列有 PayPay，不再写“只收现金”；游客仍可备好现金、小毛巾，遵守浴场规定，不随意拍摄他人。\u003ca href=\"https://www.hokkawa-onsen.com/kurone\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e北川温泉官网\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这套不是“近、零风险的轻松日”，有较长电车往返；偏爱小镇和海边温泉再选。\u003c/p\u003e\n\u003ch3\u003e替换二：北川温泉半日＋热川休息\u003c/h3\u003e\n\u003cp\u003e不去热海，也不去河津。早餐后慢慢出门，中午用餐，白天去黒根岩，下午回热川休息。\u003c/p\u003e\n\u003cp\u003e若 9/29 海岸取消，也可将今天换成\u003cstrong\u003e城崎海岸专门日\u003c/strong\u003e，而不是把海岸、河津和温泉全部留下。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e稻取雛之馆不要直接挪来今天：周四通常休馆。\u003c/strong\u003e 它保留在 10/2 替换段，与东京半日明确取舍。\u003ca href=\"https://inatorionsen.or.jp/facility/hinanoyakata/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e开放信息\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n", "plain": "默认：河津七滝，下午回热川 主线：热川 → 河津站 → 巴士 → 七滝步道 → 河津站 → 热川。 建议时间 安排 08:30—10:15 离开酒店，电车到河津，再按已查好的巴士进山。 10:15—12:45 溪谷和瀑布步道，留台阶、拍照、休息时间。 12:45—13:30 简餐，地点不能影响回程巴士。 13:30—15:30 巴士、电车返回；接续不佳时顺延。 15:30—16:30 左右 回酒店休息，晚上吃酒店晚餐。 计划从上游往下游走时，去程可查询 「河津七滝遊歩道上入口」 ，回程查询 「河津七滝」 ，不是同一站。上入口按约 30—40 分钟巴士排程余量 考虑，具体停靠、班次和通行情况出发前确认。 不承诺所有步道及七处瀑布当天全部开放，不为凑齐数量进入封闭路段。资料： 七滝观光协会 、 巴士查询 。 不再加石廊崎、修善寺或热海。 电车接巴士加溪谷步行，已经是完整的一天。 替换一：热海小镇＋黒根岩温泉 保留原稿偏好，使用修正后的交通时间。 建议时间 安排 08:30—10:15 热川北上热海，包含候车与步行。 10:15—12:30 来宫神社、商店街，减少支线。 12:30—13:15 午餐，附近海边短走。 13:15—14:45 电车南下伊豆北川，再步行到温泉。 14:45—15:45 黒根岩風呂，按当天开放执行。 15:45—17:00 返回热川酒店。 不加热海城。 从热海南下先到北川、后到热川，不需要先坐过酒店站再倒回来。 黒根岩当前 10:00—18:00、17:45 最晚入场，成人 700 日元 ，男女分浴。官网列有 PayPay，不再写“只收现金”；游客仍可备好现金、小毛巾，遵守浴场规定，不随意拍摄他人。 北川温泉官网 这套不是“近、零风险的轻松日”，有较长电车往返；偏爱小镇和海边温泉再选。 替换二：北川温泉半日＋热川休息 不去热海，也不去河津。早餐后慢慢出门，中午用餐，白天去黒根岩，下午回热川休息。 若 9/29 海岸取消，也可将今天换成 城崎海岸专门日 ，而不是把海岸、河津和温泉全部留下。 稻取雛之馆不要直接挪来今天：周四通常休馆。 它保留在 10/2 替换段，与东京半日明确取舍。 开放信息"}, {"id": "source-11", "title": "Day 8｜10/2 周五：进东京，两种衔接方式", "markdown": "### 默认：早离开伊豆，保住新宿下午\n\n**住：滨松町名铁酒店（Meitetsu Inn Hamamatsucho／名鉄イン浜松町）**  \n**主线：伊豆热川 → 品川 → JR 滨松町站北口 → 滨松町名铁酒店寄存 → 新宿 → 东京塔外观。**\n\n从品川转 JR 山手线或京滨东北线到滨松町，出**北口后步行约 4 分钟**到酒店；若从地铁大门站到达，选 **A2 出口**，需要电梯时选 **A1 出口**。[酒店交通][hotel-meitetsu]\n\n\u003e **候选车次：踊り子 2 号，伊豆热川 10:32 → 品川 12:40。**  \n\u003e 须核对 10/2 运行、票面日期和座位，不是已经代订。[JR 官方车次][odoriko-2]\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:00—09:30 | 早餐、整理、退房。 |\n| 09:30—10:15 | 去车站；当前 09:55 酒店接驳可用作查询目标，不等 10:35 那班。 |\n| 10:32—12:40 | 候选特急去品川。 |\n| 13:00—14:00 | 前往滨松町名铁酒店寄存、简单午餐；未到通常 15:00 入住时间，不等待进房。 |\n| 14:00—14:45 | 去新宿，步行到御苑入口。 |\n| 14:45—15:50 | 新宿御苑散步，不追求全园。 |\n| 16:00—18:30 | 新宿街区、购物、晚餐；都厅可删。 |\n| 19:30—20:30 | 回酒店附近，芝公园、东京塔外观。 |\n\n**御苑十月 16:00 停止入园、16:30 闭园。** 当天迟到就删御苑，改逛新宿，不能把入园顺延至傍晚。[官方指南][gyoen]\n\n滨松町名铁酒店到东京塔官方参考步行约 **15 分钟**，所以原有东京塔外观散步安排保留，不再单独安排登塔半日。[酒店周边信息][hotel-meitetsu]\n\n### 替换：保留稻取雛之馆，东京只留傍晚\n\n**选择这一版，就不乘 10:32 的早班特急，也不安排当天下午新宿御苑。**\n\n| 建议时间 | 安排 |\n|---|---|\n| 08:30—09:00 | 退房、确认寄存；先解决行李，再决定是否去稻取。 |\n| 09:00—10:00 | 电车去伊豆稻取，步行到文化公园。 |\n| 10:00—11:00 | **文化公园「雛の館」**秋季展示。 |\n| 11:00—12:00 | 温泉街／海边、简单海鲜午餐，不加远处展望台。 |\n| 12:00—13:00 | 回热川取行李，再到车站。 |\n| 13:00—14:00 左右 | 按提前查好的车次离开伊豆，优先少换乘的接续。 |\n| 16:00—17:30 左右 | 东京酒店抵达规划范围，以所选车次实际倒推。 |\n| 傍晚 | 芝公园、东京塔外观；体力好再考虑新宿夜间活动。 |\n\n这里是**室内秋季吊雏展示**，不是春季素盏鸣神社的阶梯人偶活动。雛之馆通常 **09:00—16:00、15:40 最晚入馆，成人 500 日元，周四休馆**；10/2 为周五，仍要看秋季开放日历。[雛之馆][hina]\n\n退房后寄存是否允许、费用和取件时间，须先问热川酒店；资料不足以保证热川站有合适大件柜。\n\n**取舍结论：默认版保留新宿御苑，稻取版保留伊豆人偶与小镇。** 两套都保留供选择，但不写成可以同时完成。", "html": "\u003ch3\u003e默认：早离开伊豆，保住新宿下午\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e住：滨松町名铁酒店（Meitetsu Inn Hamamatsucho／名鉄イン浜松町）\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：伊豆热川 → 品川 → JR 滨松町站北口 → 滨松町名铁酒店寄存 → 新宿 → 东京塔外观。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从品川转 JR 山手线或京滨东北线到滨松町，出\u003cstrong\u003e北口后步行约 4 分钟\u003c/strong\u003e到酒店；若从地铁大门站到达，选 \u003cstrong\u003eA2 出口\u003c/strong\u003e，需要电梯时选 \u003cstrong\u003eA1 出口\u003c/strong\u003e。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店交通\u003c/a\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e候选车次：踊り子 2 号，伊豆热川 10:32 → 品川 12:40。\u003c/strong\u003e\u003cbr/\u003e\n须核对 10/2 运行、票面日期和座位，不是已经代订。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098921.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方车次\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00—09:30\u003c/td\u003e\n\u003ctd\u003e早餐、整理、退房。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:30—10:15\u003c/td\u003e\n\u003ctd\u003e去车站；当前 09:55 酒店接驳可用作查询目标，不等 10:35 那班。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:32—12:40\u003c/td\u003e\n\u003ctd\u003e候选特急去品川。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—14:00\u003c/td\u003e\n\u003ctd\u003e前往滨松町名铁酒店寄存、简单午餐；未到通常 15:00 入住时间，不等待进房。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—14:45\u003c/td\u003e\n\u003ctd\u003e去新宿，步行到御苑入口。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:45—15:50\u003c/td\u003e\n\u003ctd\u003e新宿御苑散步，不追求全园。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—18:30\u003c/td\u003e\n\u003ctd\u003e新宿街区、购物、晚餐；都厅可删。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:30—20:30\u003c/td\u003e\n\u003ctd\u003e回酒店附近，芝公园、东京塔外观。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e御苑十月 16:00 停止入园、16:30 闭园。\u003c/strong\u003e 当天迟到就删御苑，改逛新宿，不能把入园顺延至傍晚。\u003ca href=\"https://policies.env.go.jp/national-garden/shinjukugyoen/english/guide/information/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方指南\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e滨松町名铁酒店到东京塔官方参考步行约 \u003cstrong\u003e15 分钟\u003c/strong\u003e，所以原有东京塔外观散步安排保留，不再单独安排登塔半日。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店周边信息\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e替换：保留稻取雛之馆，东京只留傍晚\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e选择这一版，就不乘 10:32 的早班特急，也不安排当天下午新宿御苑。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—09:00\u003c/td\u003e\n\u003ctd\u003e退房、确认寄存；先解决行李，再决定是否去稻取。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:00—10:00\u003c/td\u003e\n\u003ctd\u003e电车去伊豆稻取，步行到文化公园。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:00—11:00\u003c/td\u003e\n\u003ctd\u003e**文化公园「雛の館」**秋季展示。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00—12:00\u003c/td\u003e\n\u003ctd\u003e温泉街／海边、简单海鲜午餐，不加远处展望台。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:00—13:00\u003c/td\u003e\n\u003ctd\u003e回热川取行李，再到车站。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—14:00 左右\u003c/td\u003e\n\u003ctd\u003e按提前查好的车次离开伊豆，优先少换乘的接续。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—17:30 左右\u003c/td\u003e\n\u003ctd\u003e东京酒店抵达规划范围，以所选车次实际倒推。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e傍晚\u003c/td\u003e\n\u003ctd\u003e芝公园、东京塔外观；体力好再考虑新宿夜间活动。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e这里是\u003cstrong\u003e室内秋季吊雏展示\u003c/strong\u003e，不是春季素盏鸣神社的阶梯人偶活动。雛之馆通常 \u003cstrong\u003e09:00—16:00、15:40 最晚入馆，成人 500 日元，周四休馆\u003c/strong\u003e；10/2 为周五，仍要看秋季开放日历。\u003ca href=\"https://inatorionsen.or.jp/facility/hinanoyakata/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e雛之馆\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e退房后寄存是否允许、费用和取件时间，须先问热川酒店；资料不足以保证热川站有合适大件柜。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e取舍结论：默认版保留新宿御苑，稻取版保留伊豆人偶与小镇。\u003c/strong\u003e 两套都保留供选择，但不写成可以同时完成。\u003c/p\u003e\n", "plain": "默认：早离开伊豆，保住新宿下午 住：滨松町名铁酒店（Meitetsu Inn Hamamatsucho／名鉄イン浜松町） 主线：伊豆热川 → 品川 → JR 滨松町站北口 → 滨松町名铁酒店寄存 → 新宿 → 东京塔外观。 从品川转 JR 山手线或京滨东北线到滨松町，出 北口后步行约 4 分钟 到
