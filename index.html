u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:55\u003c/td\u003e\n\u003ctd\u003e按前文时间抵达成田，下机、入境、取行李。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e17:00—18:15 左右\u003c/td\u003e\n\u003ctd\u003e根据实际出关时间乘车，不预设 17:00 一定办完。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:30—21:00 左右\u003c/td\u003e\n\u003ctd\u003e正常接续下的酒店抵达规划范围；延误及时联系酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e入住后\u003c/td\u003e\n\u003ctd\u003e简单晚餐／便利店补给，休息；海滩散步不是必做项目。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e普通 JR 有直通镰仓的班次，不必固定在东京换车。\u003c/strong\u003e 当前九月平日时刻表中，\u003cstrong\u003e空港第2ビル 17:01 出发，久里浜方向，约 19:25 到镰仓\u003c/strong\u003e。途中线路名称变化，但同一列车直通时不用下车。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/110/114361.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方候选车次\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e前面查询也出现过 \u003cstrong\u003e18:04 出发、约 20:30 到镰仓\u003c/strong\u003e的接续，可作为较晚出关时的查询目标；必须输入 9/25 日期复核，不只记住截图时间。\u003ca href=\"https://ekitan.com/transit/route/sf-1998/st-1865\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e路线查询\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e售票时直接说明终点 \u003cstrong\u003e鎌倉／Kamakura\u003c/strong\u003e。普通车不保证有座。N’EX 只在疲惫、行李不便或接续明显更好时升级；到大船仍要换车，途中经过北镰仓，并不是一站到镰仓。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/110/114361.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 站序\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e到镰仓站后正常步行去酒店，不默认打车。酒店到海滩约 10 分钟，并非“楼下就是沙滩”。\u003cstrong\u003e22:30 是最晚入住要求\u003c/strong\u003e，不要与前台其他服务时段混淆。\u003ca href=\"https://plat-hostel-keikyu.com/hostel/kamakura-wave/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店信息\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**删减规则：**晚到只办入住、吃饭。预计逼近 22:30 时提前电话沟通，不自行假设酒店会等到深夜。\u003c/p\u003e\n"}, {"key": "2", "num": 2, "date": "9/26", "iso": "2026-09-26", "week": "周六", "region": "镰仓", "hotel": "kamakura", "title": "电车、海风与镰仓寺庙", "desc": "高校前 · 江之岛 · 长谷寺 · 大佛", "route": "镰仓高校前 → 江之岛 → 长谷寺 → 镰仓大佛 → 由比滨", "focus": "江之岛登塔与岩屋择一；超时先删支线。", "terms": [["高校前站", "鎌倉高校前駅"], ["江之岛", "江の島"], ["长谷寺", "長谷寺 鎌倉"], ["镰仓大佛", "高徳院 鎌倉"]], "sectionId": "source-4", "originalTitle": "Day 2｜9/26 周六：江之电海岸线与镰仓寺庙", "timeline": [{"time": "08:00—08:40", "text": "酒店附近早餐，轻装出门。"}, {"time": "08:40—09:30", "text": "江之电去镰仓高校前，平交道和海边短停。"}, {"time": "09:30—10:15", "text": "去江之岛站，步行上岛；包括站外步行。"}, {"time": "10:15—12:45", "text": "神社、街区、岛上午餐，登塔或岩屋最多选一个。"}, {"time": "12:45—14:00", "text": "离岛、候车、乘江之电回长谷。"}, {"time": "14:00—15:15", "text": "长谷寺境内和见晴台。"}, {"time": "15:30—16:15", "text": "镰仓大佛；胎内参观按开放、排队情况决定。"}, {"time": "16:30—17:30", "text": "海岸散步；天气不好或疲惫就直接回酒店。"}, {"time": "18:00 后", "text": "镰仓站／酒店附近晚餐。"}], "html": "\u003cp\u003e\u003cstrong\u003e住：镰仓\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：镰仓高校前 → 江之岛 → 长谷寺 → 镰仓大佛 → 由比滨。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e保留原稿“上午先去高校前和江之岛、下午回长谷”的喜好，但缩减岛内支线，不把餐券店设为必须抵达的节点。\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003e岛上默认：神社和街区＋午餐，有余量再登塔。\u003c/strong\u003e 偏爱岩屋就用它替换登塔，并减少其他支线，不同时完成三宫全程、岩屋、灯塔和离岛午餐。\u003c/p\u003e\n\u003cp\u003e岩屋成人 \u003cstrong\u003e500 日元\u003c/strong\u003e，开放受季节和临时状况影响；不承诺某个潮位、富士山一定可见或固定日落机位。\u003ca href=\"https://www.fujisawa-kanko.jp/spot/enoshima/17.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e岩屋信息\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e长谷寺当前 \u003cstrong\u003e08:00 开放、16:30 停止入场、17:00 闭山，成人 400 日元\u003c/strong\u003e。大佛参拜 \u003cstrong\u003e300\u003c/strong\u003e，胎内另 \u003cstrong\u003e50 日元\u003c/strong\u003e。\u003ca href=\"https://www.hasedera.jp/guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e长谷寺\u003c/a\u003e／\u003ca href=\"https://www.kotoku-in.jp/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e高德院\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e超时先删：登塔／岩屋、极乐寺短停、固定日落机位。\u003c/strong\u003e 下午先完成寺庙，不为拍照错过入场。极乐寺不作为必下车项目；拍平交道时不进入轨道或车道。\u003c/p\u003e\n\u003cp\u003e**餐饮处理：**review 已指出 BREEZE BIRD 不能按 08:45 早餐安排，ミンナミ食堂周六兑券、ヨリドコロ日落后兑券也不适配原路线。本版早餐以按时吃到为先，午餐留江之岛，晚餐在镰仓附近；那些店只保留为候选，不为兑券绕路。\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e住：镰仓\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：镰仓高校前 → 江之岛 → 长谷寺 → 镰仓大佛 → 由比滨。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e保留原稿“上午先去高校前和江之岛、下午回长谷”的喜好，但缩减岛内支线，不把餐券店设为必须抵达的节点。\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00—08:40\u003c/td\u003e\n\u003ctd\u003e酒店附近早餐，轻装出门。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:40—09:30\u003c/td\u003e\n\u003ctd\u003e江之电去镰仓高校前，平交道和海边短停。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:30—10:15\u003c/td\u003e\n\u003ctd\u003e去江之岛站，步行上岛；包括站外步行。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:15—12:45\u003c/td\u003e\n\u003ctd\u003e神社、街区、岛上午餐，登塔或岩屋最多选一个。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:45—14:00\u003c/td\u003e\n\u003ctd\u003e离岛、候车、乘江之电回长谷。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—15:15\u003c/td\u003e\n\u003ctd\u003e长谷寺境内和见晴台。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:30—16:15\u003c/td\u003e\n\u003ctd\u003e镰仓大佛；胎内参观按开放、排队情况决定。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:30—17:30\u003c/td\u003e\n\u003ctd\u003e海岸散步；天气不好或疲惫就直接回酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e18:00 后\u003c/td\u003e\n\u003ctd\u003e镰仓站／酒店附近晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e岛上默认：神社和街区＋午餐，有余量再登塔。\u003c/strong\u003e 偏爱岩屋就用它替换登塔，并减少其他支线，不同时完成三宫全程、岩屋、灯塔和离岛午餐。\u003c/p\u003e\n\u003cp\u003e岩屋成人 \u003cstrong\u003e500 日元\u003c/strong\u003e，开放受季节和临时状况影响；不承诺某个潮位、富士山一定可见或固定日落机位。\u003ca href=\"https://www.fujisawa-kanko.jp/spot/enoshima/17.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e岩屋信息\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e长谷寺当前 \u003cstrong\u003e08:00 开放、16:30 停止入场、17:00 闭山，成人 400 日元\u003c/strong\u003e。大佛参拜 \u003cstrong\u003e300\u003c/strong\u003e，胎内另 \u003cstrong\u003e50 日元\u003c/strong\u003e。\u003ca href=\"https://www.hasedera.jp/guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e长谷寺\u003c/a\u003e／\u003ca href=\"https://www.kotoku-in.jp/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e高德院\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e超时先删：登塔／岩屋、极乐寺短停、固定日落机位。\u003c/strong\u003e 下午先完成寺庙，不为拍照错过入场。极乐寺不作为必下车项目；拍平交道时不进入轨道或车道。\u003c/p\u003e\n\u003cp\u003e**餐饮处理：**review 已指出 BREEZE BIRD 不能按 08:45 早餐安排，ミンナミ食堂周六兑券、ヨリドコロ日落后兑券也不适配原路线。本版早餐以按时吃到为先，午餐留江之岛，晚餐在镰仓附近；那些店只保留为候选，不为兑券绕路。\u003c/p\u003e\n"}, {"key": "3", "num": 3, "date": "9/27", "iso": "2026-09-27", "week": "周日", "region": "箱根", "hotel": "hakone", "title": "从镰仓小町，走进山间美术馆", "desc": "八幡宫 · 小町通 · 雕刻之森", "route": "八幡宫 → 小町通 → 镰仓 → 大船 → 小田原 → 箱根汤本 → 雕刻之森", "focus": "11:00 左右离开镰仓；含晚餐方案注意 18:00 前入住。", "terms": [["八幡宫", "鶴岡八幡宮"], ["箱根汤本", "箱根湯本駅"], ["雕刻之森", "彫刻の森美術館"]], "sectionId": "source-5", "originalTitle": "Day 3｜9/27 周日：镰仓收尾，下午雕刻之森", "timeline": [{"time": "08:00 左右", "text": "退房或与酒店确认寄存，费用按规定。"}, {"time": "08:30—09:45", "text": "鹤冈八幡宫、段葛一带。"}, {"time": "10:00—10:30", "text": "小町通、买手信，不长时间排队用餐。"}, {"time": "10:30—11:00", "text": "取行李，到镰仓站。"}, {"time": "11:00 左右", "text": "经大船换 JR 东海道线去小田原。"}, {"time": "12:00—13:00", "text": "周游券、去箱根汤本、简餐与寄存，按实际接续调整。"}, {"time": "13:00—14:00", "text": "登山电车上山，步行入馆。"}, {"time": "14:00—16:00", "text": "雕刻之森美术馆。"}, {"time": "16:00—17:15", "text": "下山、取行李、到天成园。"}, {"time": "晚上", "text": "按酒店安排吃自助晚餐，之后泡汤。"}], "html": "\u003cp\u003e\u003cstrong\u003e住：箱根天成园\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：鹤冈八幡宫 → 小町通 → 镰仓 → 大船 → 小田原 → 箱根汤本 → 雕刻之森 → 天成园。\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003e这一版不保留 12:00「鰻のおかむら」午餐，也不承诺 15:00 已在酒店泡汤。\u003c/strong\u003e 想吃鳗鱼，可保留翌日元箱根长谷川为候选。这项取舍是为了留住美术馆，并释放 9/29 的时间。\u003c/p\u003e\n\u003cp\u003e优先用箱根汤本站可用寄存设施；无合适柜位时先去酒店询问寄存，再上山，\u003cstrong\u003e相应缩短或取消美术馆\u003c/strong\u003e。不保证寄存免费，也不预设大件柜有空位。\u003c/p\u003e\n\u003cp\u003e雕刻之森 \u003cstrong\u003e09:00—17:00，16:30 最后入馆\u003c/strong\u003e；成人现场 \u003cstrong\u003e2,000\u003c/strong\u003e、网上 \u003cstrong\u003e1,800 日元\u003c/strong\u003e。汤本上山留约 35—45 分钟车程，再加候车和步行，不是五分钟。\u003ca href=\"https://www.hakone-oam.or.jp/info/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e美术馆\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e含晚餐方案注意天成园 \u003cstrong\u003e18:00 前入住\u003c/strong\u003e；预计晚到提前联系。延误时宁可早点离馆，也不拿酒店晚餐作赌注。\u003ca href=\"https://www.tenseien.co.jp/faq/?category=%E5%AE%BF%E6%B3%8A\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e天成园问答\u003c/a\u003e\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e住：箱根天成园\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：鹤冈八幡宫 → 小町通 → 镰仓 → 大船 → 小田原 → 箱根汤本 → 雕刻之森 → 天成园。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00 左右\u003c/td\u003e\n\u003ctd\u003e退房或与酒店确认寄存，费用按规定。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—09:45\u003c/td\u003e\n\u003ctd\u003e鹤冈八幡宫、段葛一带。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:00—10:30\u003c/td\u003e\n\u003ctd\u003e小町通、买手信，不长时间排队用餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:30—11:00\u003c/td\u003e\n\u003ctd\u003e取行李，到镰仓站。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00 左右\u003c/td\u003e\n\u003ctd\u003e经大船换 JR 东海道线去小田原。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:00—13:00\u003c/td\u003e\n\u003ctd\u003e周游券、去箱根汤本、简餐与寄存，按实际接续调整。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—14:00\u003c/td\u003e\n\u003ctd\u003e登山电车上山，步行入馆。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—16:00\u003c/td\u003e\n\u003ctd\u003e雕刻之森美术馆。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—17:15\u003c/td\u003e\n\u003ctd\u003e下山、取行李、到天成园。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e晚上\u003c/td\u003e\n\u003ctd\u003e按酒店安排吃自助晚餐，之后泡汤。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e这一版不保留 12:00「鰻のおかむら」午餐，也不承诺 15:00 已在酒店泡汤。\u003c/strong\u003e 想吃鳗鱼，可保留翌日元箱根长谷川为候选。这项取舍是为了留住美术馆，并释放 9/29 的时间。\u003c/p\u003e\n\u003cp\u003e优先用箱根汤本站可用寄存设施；无合适柜位时先去酒店询问寄存，再上山，\u003cstrong\u003e相应缩短或取消美术馆\u003c/strong\u003e。不保证寄存免费，也不预设大件柜有空位。\u003c/p\u003e\n\u003cp\u003e雕刻之森 \u003cstrong\u003e09:00—17:00，16:30 最后入馆\u003c/strong\u003e；成人现场 \u003cstrong\u003e2,000\u003c/strong\u003e、网上 \u003cstrong\u003e1,800 日元\u003c/strong\u003e。汤本上山留约 35—45 分钟车程，再加候车和步行，不是五分钟。\u003ca href=\"https://www.hakone-oam.or.jp/info/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e美术馆\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e含晚餐方案注意天成园 \u003cstrong\u003e18:00 前入住\u003c/strong\u003e；预计晚到提前联系。延误时宁可早点离馆，也不拿酒店晚餐作赌注。\u003ca href=\"https://www.tenseien.co.jp/faq/?category=%E5%AE%BF%E6%B3%8A\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e天成园问答\u003c/a\u003e\u003c/p\u003e\n"}, {"key": "4", "num": 4, "date": "9/28", "iso": "2026-09-28", "week": "周一", "region": "箱根", "hotel": "hakone", "title": "绕一圈箱根，留半晚泡汤", "desc": "大涌谷 · 芦之湖 · 箱根神社", "route": "汤本 → 强罗 → 早云山 → 大涌谷 → 桃源台 → 元箱根港 → 箱根神社", "focus": "核对缆车、游船运行；鸟居排队过长就不等。", "terms": [["大涌谷", "大涌谷"], ["元箱根港", "元箱根港"], ["箱根神社", "箱根神社"]], "sectionId": "source-6", "originalTitle": "Day 4｜9/28 周一：箱根环线与温泉", "timeline": [{"time": "08:00 前后", "text": "早餐，查看缆车、游船运行公告。"}, {"time": "08:30—10:00", "text": "登山电车到强罗、缆车到早云山、空中缆车到大涌谷。"}, {"time": "10:00—11:00", "text": "大涌谷观景、黑蛋等简单体验。"}, {"time": "11:00—12:15", "text": "去桃源台，候船、乘海贼船，按当天停靠顺序。"}, {"time": "12:15—14:15", "text": "\u003cstrong\u003e元箱根港\u003c/strong\u003e下船，午餐、箱根神社和湖边。"}, {"time": "14:15—15:30", "text": "鸟居拍照或散步，随后候车回汤本；排队过长就不等。"}, {"time": "16:00—17:00 左右", "text": "回酒店，休息、泡汤。"}, {"time": "晚上", "text": "酒店晚餐。"}], "html": "\u003cp\u003e\u003cstrong\u003e住：箱根天成园\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：汤本 → 强罗 → 早云山 → 大涌谷 → 桃源台 → 元箱根港 → 箱根神社 → 汤本。\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003e神社与\u003cstrong\u003e元箱根港\u003c/strong\u003e衔接，官方参考步行约 10 分钟。不去箱根关所、旧街道时，不特地在箱根町下船再折返。\u003ca href=\"https://hakonejinja.or.jp/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e神社交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e湖边回汤本巴士按\u003cstrong\u003e约 35—60 分钟排程余量\u003c/strong\u003e考虑，另留候车与拥堵时间。上车核对运营公司、线路和周游券覆盖范围。\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e周游券\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e午餐保留 \u003cstrong\u003e鳗鱼长谷川元箱根本店\u003c/strong\u003e为候选，定位在元箱根码头附近；尚未预约，满位则换就近午餐。\u003ca href=\"https://www.unagi-hasegawa-hakone.com/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e餐厅官网\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e不加入已闭馆的小王子博物馆，不重复美术馆，也不把“覆盖八类交通”理解成“必须坐完八种”。缆车、游船停运时按当天公告缩减，\u003cstrong\u003e不预设一定有免费替代巴士\u003c/strong\u003e；天气不好早点回酒店即可。\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e住：箱根天成园\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：汤本 → 强罗 → 早云山 → 大涌谷 → 桃源台 → 元箱根港 → 箱根神社 → 汤本。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00 前后\u003c/td\u003e\n\u003ctd\u003e早餐，查看缆车、游船运行公告。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—10:00\u003c/td\u003e\n\u003ctd\u003e登山电车到强罗、缆车到早云山、空中缆车到大涌谷。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:00—11:00\u003c/td\u003e\n\u003ctd\u003e大涌谷观景、黑蛋等简单体验。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00—12:15\u003c/td\u003e\n\u003ctd\u003e去桃源台，候船、乘海贼船，按当天停靠顺序。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:15—14:15\u003c/td\u003e\n\u003ctd\u003e\u003cstrong\u003e元箱根港\u003c/strong\u003e下船，午餐、箱根神社和湖边。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:15—15:30\u003c/td\u003e\n\u003ctd\u003e鸟居拍照或散步，随后候车回汤本；排队过长就不等。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—17:00 左右\u003c/td\u003e\n\u003ctd\u003e回酒店，休息、泡汤。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e晚上\u003c/td\u003e\n\u003ctd\u003e酒店晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e神社与\u003cstrong\u003e元箱根港\u003c/strong\u003e衔接，官方参考步行约 10 分钟。不去箱根关所、旧街道时，不特地在箱根町下船再折返。\u003ca href=\"https://hakonejinja.or.jp/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e神社交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e湖边回汤本巴士按\u003cstrong\u003e约 35—60 分钟排程余量\u003c/strong\u003e考虑，另留候车与拥堵时间。上车核对运营公司、线路和周游券覆盖范围。\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e周游券\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e午餐保留 \u003cstrong\u003e鳗鱼长谷川元箱根本店\u003c/strong\u003e为候选，定位在元箱根码头附近；尚未预约，满位则换就近午餐。\u003ca href=\"https://www.unagi-hasegawa-hakone.com/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e餐厅官网\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e不加入已闭馆的小王子博物馆，不重复美术馆，也不把“覆盖八类交通”理解成“必须坐完八种”。缆车、游船停运时按当天公告缩减，\u003cstrong\u003e不预设一定有免费替代巴士\u003c/strong\u003e；天气不好早点回酒店即可。\u003c/p\u003e\n"}, {"key": "5", "num": 5, "date": "9/29", "iso": "2026-09-29", "week": "周二", "region": "伊豆", "hotel": "izu", "title": "转场伊豆，沿着断崖看海", "desc": "伊豆高原寄存 · 城崎海岸 · 热川", "route": "天成园 → 小田原 → 伊豆高原寄存 → 城崎海岸 → 取行李 → 热川", "focus": "先存行李再去海岸；寄存失败或晚到就直接入住。", "terms": [["伊豆高原站", "伊豆高原駅"], ["海洋公园", "伊豆海洋公園"], ["门胁吊桥", "門脇つり橋"], ["热川站", "伊豆熱川駅"]], "sectionId": "source-8", "originalTitle": "Day 5｜9/29 周二：转场伊豆，城崎海岸短线", "timeline": [{"time": "11:00—11:45", "text": "寄存行李、简餐、确认海岸往返交通。"}, {"time": "11:45—14:00", "text": "前往海岸，游览门胁吊桥、灯塔周边和一段步道。"}, {"time": "14:00—15:00", "text": "回伊豆高原站取行李。"}, {"time": "15:00—16:15", "text": "电车去伊豆热川，按到站时间衔接酒店接驳。"}, {"time": "16:00—17:00 左右", "text": "入住、休息，按酒店场次吃晚餐。"}], "html": "\u003cp\u003e\u003cstrong\u003e住：伊东园酒店热川\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：天成园退房 → 小田原 → 伊豆高原寄存 → 城崎海岸 → 伊豆高原取行李 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\u003ch3\u003e两种进伊豆的方式\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e少换乘版，优先查询候选车次：\u003c/strong\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e踊り子 1 号：小田原 10:01 → 伊豆高原 11:02。\u003c/strong\u003e\u003cbr/\u003e\n当前 JR 公布时刻，不代表已买票或保证有座。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098941.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方车次\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e建议约 \u003cstrong\u003e08:45 离开天成园\u003c/strong\u003e，预留到小田原、进站、找站台和买票时间。注意连接不同目的地车厢的情况：\u003cstrong\u003e去伊豆高原要坐「伊豆急下田」方向车厢，不是「修善寺」方向。\u003c/strong\u003e 以票面车厢和现场显示为准。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e省钱版：小田原 → 热海 → 伊东／伊豆高原的普通电车接续。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e目标在 \u003cstrong\u003e12:00 前后到伊豆高原\u003c/strong\u003e，按当天换乘查实际抵达时间，不能把普通车写成与特急同样用时。小田原到伊豆高原普通纸票参考 \u003cstrong\u003e1,470 日元\u003c/strong\u003e；特急另付附加费。汤本到小田原按周游券适用范围乘坐，不重复计费。\u003ca href=\"https://www.izukyu.co.jp/fares/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e伊豆急运价\u003c/a\u003e／\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e箱根周游券\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e以 11 点左右到伊豆高原为基础的安排\u003c/h3\u003e\n\n\u003ch3\u003e先存好行李，再去海岸\u003c/h3\u003e\n\u003cp\u003e伊豆高原站设有寄存柜，但\u003cstrong\u003e不保证到站时有适合大件行李的空位\u003c/strong\u003e。\u003ca href=\"https://www.izukyu.co.jp/train/station_detail.php?station=%E4%BC%8A%E8%B1%86%E9%AB%98%E5%8E%9F%E9%A7%85\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e站内设施\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e寄存失败、明显晚到或天气不适合走海岸时，直接去热川酒店。城崎海岸改为 \u003cstrong\u003e10/1 的替换项目\u003c/strong\u003e，不硬塞回大室山和动物公园那一天。\u003c/p\u003e\n\u003ch3\u003e海岸交通要选对站\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e巴士候选：伊豆高原站 →「伊豆海洋公園」→ 按现场步道前往门胁吊桥。\u003c/strong\u003e 下车后仍有步行，不是公交直接停在吊桥上；发车、步道入口与回程路线按官方查询及现场信息确认。\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e东海巴士查询\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e不等巴士的备选：电车到「城ヶ崎海岸」站，再步行去海岸。\u003c/strong\u003e 官网车站到景区参考约 \u003cstrong\u003e35 分钟\u003c/strong\u003e，往返步行必须单独计入，不能当成“站口就是海”。\u003ca href=\"https://itospa.com/spot/detail_54002.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e海岸交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e今天只走短线，不按九公里全线徒步安排。门胁灯塔按现场开放参观，不再沿用原稿“灯塔 300 日元”的预算。\u003c/p\u003e\n\u003cp\u003e**删减规则：**普通车接续导致较晚到达时，缩短停留；约 12:30 后才解决好行李和午餐，就重新评估是否取消海岸，不牺牲入住与晚餐。\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e住：伊东园酒店热川\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：天成园退房 → 小田原 → 伊豆高原寄存 → 城崎海岸 → 伊豆高原取行李 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\u003ch3\u003e两种进伊豆的方式\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003e少换乘版，优先查询候选车次：\u003c/strong\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e踊り子 1 号：小田原 10:01 → 伊豆高原 11:02。\u003c/strong\u003e\u003cbr/\u003e\n当前 JR 公布时刻，不代表已买票或保证有座。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098941.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方车次\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003e建议约 \u003cstrong\u003e08:45 离开天成园\u003c/strong\u003e，预留到小田原、进站、找站台和买票时间。注意连接不同目的地车厢的情况：\u003cstrong\u003e去伊豆高原要坐「伊豆急下田」方向车厢，不是「修善寺」方向。\u003c/strong\u003e 以票面车厢和现场显示为准。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e省钱版：小田原 → 热海 → 伊东／伊豆高原的普通电车接续。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e目标在 \u003cstrong\u003e12:00 前后到伊豆高原\u003c/strong\u003e，按当天换乘查实际抵达时间，不能把普通车写成与特急同样用时。小田原到伊豆高原普通纸票参考 \u003cstrong\u003e1,470 日元\u003c/strong\u003e；特急另付附加费。汤本到小田原按周游券适用范围乘坐，不重复计费。\u003ca href=\"https://www.izukyu.co.jp/fares/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e伊豆急运价\u003c/a\u003e／\u003ca href=\"https://www.hakonenavi.jp/transportation/ticket/freepass/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e箱根周游券\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e以 11 点左右到伊豆高原为基础的安排\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00—11:45\u003c/td\u003e\n\u003ctd\u003e寄存行李、简餐、确认海岸往返交通。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:45—14:00\u003c/td\u003e\n\u003ctd\u003e前往海岸，游览门胁吊桥、灯塔周边和一段步道。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—15:00\u003c/td\u003e\n\u003ctd\u003e回伊豆高原站取行李。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:00—16:15\u003c/td\u003e\n\u003ctd\u003e电车去伊豆热川，按到站时间衔接酒店接驳。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—17:00 左右\u003c/td\u003e\n\u003ctd\u003e入住、休息，按酒店场次吃晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch3\u003e先存好行李，再去海岸\u003c/h3\u003e\n\u003cp\u003e伊豆高原站设有寄存柜，但\u003cstrong\u003e不保证到站时有适合大件行李的空位\u003c/strong\u003e。\u003ca href=\"https://www.izukyu.co.jp/train/station_detail.php?station=%E4%BC%8A%E8%B1%86%E9%AB%98%E5%8E%9F%E9%A7%85\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e站内设施\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e寄存失败、明显晚到或  16:00\u003c/strong\u003e，实际受天气影响。挪到 10/1 时不能套用九月时间。\u003ca href=\"https://omuroyama.com/hours_fare/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e营业与费用\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e动物公园当前成人普通票为\u003cstrong\u003e平日 2,800、周末及指定假期 3,000 日元\u003c/strong\u003e；额外体验另计。九月底以参观动物和植物为主，不把“水豚泡温泉”作为一定能看到的节目。\u003ca href=\"https://izushaboten.com/news/entrance-fee/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e动物公园票价\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e去回程查明确站名：伊豆高原駅／シャボテン公園。\u003c/strong\u003e 不用“每小时 :45、:59”猜班次。酒店 16:30 接驳末班不是游览的绝对截止线，但必须知道后面怎么回去，且不影响晚餐。\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e巴士查询\u003c/a\u003e／\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店接驳\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**天气调整：**可与 10/1 对调，把较好的风况和能见度留给大室山。若强风、暴雨或步道封闭，就减少户外活动，不能自动改去海岸或瀑布。换日后同时重查巴士券有效期、营业时间与晚餐衔接。\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e住：伊豆热川\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：热川 → 伊豆高原 → 巴士「シャボテン公園」→ 大室山 → 仙人掌动物公园 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00—09:00\u003c/td\u003e\n\u003ctd\u003e早餐、看大室山运行公告、查回程巴士。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:00—10:30\u003c/td\u003e\n\u003ctd\u003e去伊豆高原转巴士；可使用酒店 09:15 接驳。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:30—11:45\u003c/td\u003e\n\u003ctd\u003e大室山缆椅、山顶环行和拍照。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:45—12:30\u003c/td\u003e\n\u003ctd\u003e午餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:30—15:00\u003c/td\u003e\n\u003ctd\u003e动物公园，按兴趣选区域，不排满所有互动。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:00—17:00\u003c/td\u003e\n\u003ctd\u003e巴士、电车返程；有酒店接驳则乘，错过则步行或另行安排。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e晚上\u003c/td\u003e\n\u003ctd\u003e酒店晚餐和温泉。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e大室山成人往返缆椅 \u003cstrong\u003e1,000 日元\u003c/strong\u003e，山顶绕行约 20—30 分钟，另算排队和拍照。官网区分季节：\u003cstrong\u003e3—9 月通常营业至 17:00，10—2 月通常至 16:00\u003c/strong\u003e，实际受天气影响。挪到 10/1 时不能套用九月时间。\u003ca href=\"https://omuroyama.com/hours_fare/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e营业与费用\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e动物公园当前成人普通票为\u003cstrong\u003e平日 2,800、周末及指定假期 3,000 日元\u003c/strong\u003e；额外体验另计。九月底以参观动物和植物为主，不把“水豚泡温泉”作为一定能看到的节目。\u003ca href=\"https://izushaboten.com/news/entrance-fee/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e动物公园票价\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e去回程查明确站名：伊豆高原駅／シャボテン公園。\u003c/strong\u003e 不用“每小时 :45、:59”猜班次。酒店 16:30 接驳末班不是游览的绝对截止线，但必须知道后面怎么回去，且不影响晚餐。\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e巴士查询\u003c/a\u003e／\u003ca href=\"https://www.itoenhotel.com/atagawa/access/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店接驳\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e**天气调整：**可与 10/1 对调，把较好的风况和能见度留给大室山。若强风、暴雨或步道封闭，就减少户外活动，不能自动改去海岸或瀑布。换日后同时重查巴士券有效期、营业时间与晚餐衔接。\u003c/p\u003e\n"}, {"key": "7", "num": 7, "date": "10/1", "iso": "2026-10-01", "week": "周四", "region": "伊豆", "hotel": "izu", "title": "把这一天，留给喜欢的节奏", "desc": "河津七滝 / 热海温泉 / 休息", "route": "热川 → 河津站 → 七滝步道 → 河津站 → 热川", "focus": "三套选一套，不再叠加石廊崎或修善寺。", "terms": [["七滝上入口", "河津七滝遊歩道上入口"], ["七滝回程站", "河津七滝"], ["黒根岩", "黒根岩風呂"]], "sectionId": "source-10", "originalTitle": "Day 7｜10/1 周四：伊豆弹性日，三套只选一套", "variants": [{"timeline": [{"time": "08:30—10:15", "text": "离开酒店，电车到河津，再按已查好的巴士进山。"}, {"time": "10:15—12:45", "text": "溪谷和瀑布步道，留台阶、拍照、休息时间。"}, {"time": "12:45—13:30", "text": "简餐，地点不能影响回程巴士。"}, {"time": "13:30—15:30", "text": "巴士、电车返回；接续不佳时顺延。"}, {"time": "15:30—16:30 左右", "text": "回酒店休息，晚上吃酒店晚餐。"}], "html": "\u003cp\u003e\u003cstrong\u003e主线：热川 → 河津站 → 巴士 → 七滝步道 → 河津站 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003e计划从上游往下游走时，去程可查询 \u003cstrong\u003e「河津七滝遊歩道上入口」\u003c/strong\u003e，回程查询 \u003cstrong\u003e「河津七滝」\u003c/strong\u003e，不是同一站。上入口按约 \u003cstrong\u003e30—40 分钟巴士排程余量\u003c/strong\u003e考虑，具体停靠、班次和通行情况出发前确认。\u003c/p\u003e\n\u003cp\u003e不承诺所有步道及七处瀑布当天全部开放，不为凑齐数量进入封闭路段。资料：\u003ca href=\"https://www.nanadaru.com/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e七滝观光协会\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e巴士查询\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e不再加石廊崎、修善寺或热海。\u003c/strong\u003e 电车接巴士加溪谷步行，已经是完整的一天。\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e主线：热川 → 河津站 → 巴士 → 七滝步道 → 河津站 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—10:15\u003c/td\u003e\n\u003ctd\u003e离开酒店，电车到河津，再按已查好的巴士进山。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:15—12:45\u003c/td\u003e\n\u003ctd\u003e溪谷和瀑布步道，留台阶、拍照、休息时间。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:45—13:30\u003c/td\u003e\n\u003ctd\u003e简餐，地点不能影响回程巴士。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:30—15:30\u003c/td\u003e\n\u003ctd\u003e巴士、电车返回；接续不佳时顺延。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:30—16:30 左右\u003c/td\u003e\n\u003ctd\u003e回酒店休息，晚上吃酒店晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e计划从上游往下游走时，去程可查询 \u003cstrong\u003e「河津七滝遊歩道上入口」\u003c/strong\u003e，回程查询 \u003cstrong\u003e「河津七滝」\u003c/strong\u003e，不是同一站。上入口按约 \u003cstrong\u003e30—40 分钟巴士排程余量\u003c/strong\u003e考虑，具体停靠、班次和通行情况出发前确认。\u003c/p\u003e\n\u003cp\u003e不承诺所有步道及七处瀑布当天全部开放，不为凑齐数量进入封闭路段。资料：\u003ca href=\"https://www.nanadaru.com/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e七滝观光协会\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e巴士查询\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e不再加石廊崎、修善寺或热海。\u003c/strong\u003e 电车接巴士加溪谷步行，已经是完整的一天。\u003c/p\u003e\n", "title": "默认：河津七滝，下午回热川"}, {"timeline": [{"time": "08:30—10:15", "text": "热川北上热海，包含候车与步行。"}, {"time": "10:15—12:30", "text": "来宫神社、商店街，减少支线。"}, {"time": "12:30—13:15", "text": "午餐，附近海边短走。"}, {"time": "13:15—14:45", "text": "电车南下伊豆北川，再步行到温泉。"}, {"time": "14:45—15:45", "text": "黒根岩風呂，按当天开放执行。"}, {"time": "15:45—17:00", "text": "返回热川酒店。"}], "html": "\u003cp\u003e保留原稿偏好，使用修正后的交通时间。\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003e不加热海城。\u003c/strong\u003e 从热海南下先到北川、后到热川，不需要先坐过酒店站再倒回来。\u003c/p\u003e\n\u003cp\u003e黒根岩当前 \u003cstrong\u003e10:00—18:00、17:45 最晚入场，成人 700 日元\u003c/strong\u003e，男女分浴。官网列有 PayPay，不再写“只收现金”；游客仍可备好现金、小毛巾，遵守浴场规定，不随意拍摄他人。\u003ca href=\"https://www.hokkawa-onsen.com/kurone\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e北川温泉官网\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这套不是“近、零风险的轻松日”，有较长电车往返；偏爱小镇和海边温泉再选。\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e保留原稿偏好，使用修正后的交通时间。\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—10:15\u003c/td\u003e\n\u003ctd\u003e热川北上热海，包含候车与步行。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:15—12:30\u003c/td\u003e\n\u003ctd\u003e来宫神社、商店街，减少支线。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:30—13:15\u003c/td\u003e\n\u003ctd\u003e午餐，附近海边短走。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:15—14:45\u003c/td\u003e\n\u003ctd\u003e电车南下伊豆北川，再步行到温泉。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:45—15:45\u003c/td\u003e\n\u003ctd\u003e黒根岩風呂，按当天开放执行。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:45—17:00\u003c/td\u003e\n\u003ctd\u003e返回热川酒店。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e不加热海城。\u003c/strong\u003e 从热海南下先到北川、后到热川，不需要先坐过酒店站再倒回来。\u003c/p\u003e\n\u003cp\u003e黒根岩当前 \u003cstrong\u003e10:00—18:00、17:45 最晚入场，成人 700 日元\u003c/strong\u003e，男女分浴。官网列有 PayPay，不再写“只收现金”；游客仍可备好现金、小毛巾，遵守浴场规定，不随意拍摄他人。\u003ca href=\"https://www.hokkawa-onsen.com/kurone\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e北川温泉官网\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e这套不是“近、零风险的轻松日”，有较长电车往返；偏爱小镇和海边温泉再选。\u003c/p\u003e\n", "title": "替换一：热海小镇＋黒根岩温泉"}, {"timeline": [], "html": "\u003cp\u003e不去热海，也不去河津。早餐后慢慢出门，中午用餐，白天去黒根岩，下午回热川休息。\u003c/p\u003e\n\u003cp\u003e若 9/29 海岸取消，也可将今天换成\u003cstrong\u003e城崎海岸专门日\u003c/strong\u003e，而不是把海岸、河津和温泉全部留下。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e稻取雛之馆不要直接挪来今天：周四通常休馆。\u003c/strong\u003e 它保留在 10/2 替换段，与东京半日明确取舍。\u003ca href=\"https://inatorionsen.or.jp/facility/hinanoyakata/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e开放信息\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n", "fullHtml": "\u003cp\u003e不去热海，也不去河津。早餐后慢慢出门，中午用餐，白天去黒根岩，下午回热川休息。\u003c/p\u003e\n\u003cp\u003e若 9/29 海岸取消，也可将今天换成\u003cstrong\u003e城崎海岸专门日\u003c/strong\u003e，而不是把海岸、河津和温泉全部留下。\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e稻取雛之馆不要直接挪来今天：周四通常休馆。\u003c/strong\u003e 它保留在 10/2 替换段，与东京半日明确取舍。\u003ca href=\"https://inatorionsen.or.jp/facility/hinanoyakata/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e开放信息\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n", "title": "替换二：北川温泉半日＋热川休息"}], "timeline": [{"time": "08:30—10:15", "text": "离开酒店，电车到河津，再按已查好的巴士进山。"}, {"time": "10:15—12:45", "text": "溪谷和瀑布步道，留台阶、拍照、休息时间。"}, {"time": "12:45—13:30", "text": "简餐，地点不能影响回程巴士。"}, {"time": "13:30—15:30", "text": "巴士、电车返回；接续不佳时顺延。"}, {"time": "15:30—16:30 左右", "text": "回酒店休息，晚上吃酒店晚餐。"}], "html": "\u003cp\u003e\u003cstrong\u003e主线：热川 → 河津站 → 巴士 → 七滝步道 → 河津站 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003e计划从上游往下游走时，去程可查询 \u003cstrong\u003e「河津七滝遊歩道上入口」\u003c/strong\u003e，回程查询 \u003cstrong\u003e「河津七滝」\u003c/strong\u003e，不是同一站。上入口按约 \u003cstrong\u003e30—40 分钟巴士排程余量\u003c/strong\u003e考虑，具体停靠、班次和通行情况出发前确认。\u003c/p\u003e\n\u003cp\u003e不承诺所有步道及七处瀑布当天全部开放，不为凑齐数量进入封闭路段。资料：\u003ca href=\"https://www.nanadaru.com/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e七滝观光协会\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e巴士查询\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e不再加石廊崎、修善寺或热海。\u003c/strong\u003e 电车接巴士加溪谷步行，已经是完整的一天。\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e主线：热川 → 河津站 → 巴士 → 七滝步道 → 河津站 → 热川。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—10:15\u003c/td\u003e\n\u003ctd\u003e离开酒店，电车到河津，再按已查好的巴士进山。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:15—12:45\u003c/td\u003e\n\u003ctd\u003e溪谷和瀑布步道，留台阶、拍照、休息时间。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:45—13:30\u003c/td\u003e\n\u003ctd\u003e简餐，地点不能影响回程巴士。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:30—15:30\u003c/td\u003e\n\u003ctd\u003e巴士、电车返回；接续不佳时顺延。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:30—16:30 左右\u003c/td\u003e\n\u003ctd\u003e回酒店休息，晚上吃酒店晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e计划从上游往下游走时，去程可查询 \u003cstrong\u003e「河津七滝遊歩道上入口」\u003c/strong\u003e，回程查询 \u003cstrong\u003e「河津七滝」\u003c/strong\u003e，不是同一站。上入口按约 \u003cstrong\u003e30—40 分钟巴士排程余量\u003c/strong\u003e考虑，具体停靠、班次和通行情况出发前确认。\u003c/p\u003e\n\u003cp\u003e不承诺所有步道及七处瀑布当天全部开放，不为凑齐数量进入封闭路段。资料：\u003ca href=\"https://www.nanadaru.com/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e七滝观光协会\u003c/a\u003e、\u003ca href=\"https://www.tokaibus.jp/rosen/route_search.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e巴士查询\u003c/a\u003e。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e不再加石廊崎、修善寺或热海。\u003c/strong\u003e 电车接巴士加溪谷步行，已经是完整的一天。\u003c/p\u003e\n"}, {"key": "8", "num": 8, "date": "10/2", "iso": "2026-10-02", "week": "周五", "region": "东京", "hotel": "tokyo", "title": "告别伊豆，走进东京的夜", "desc": "早进东京 · 新宿 · 东京塔外观", "route": "伊豆热川 → 品川 → 滨松町北口 → 酒店寄存 → 新宿 → 东京塔", "focus": "默认保留新宿御苑；选稻取则放弃早班特急和御苑。", "terms": [["东京酒店", "名鉄イン浜松町"], ["新宿御苑", "新宿御苑"], ["东京塔", "東京タワー"]], "sectionId": "source-11", "originalTitle": "Day 8｜10/2 周五：进东京，两种衔接方式", "variants": [{"timeline": [{"time": "08:00—09:30", "text": "早餐、整理、退房。"}, {"time": "09:30—10:15", "text": "去车站；当前 09:55 酒店接驳可用作查询目标，不等 10:35 那班。"}, {"time": "10:32—12:40", "text": "候选特急去品川。"}, {"time": "13:00—14:00", "text": "前往滨松町名铁酒店寄存、简单午餐；未到通常 15:00 入住时间，不等待进房。"}, {"time": "14:00—14:45", "text": "去新宿，步行到御苑入口。"}, {"time": "14:45—15:50", "text": "新宿御苑散步，不追求全园。"}, {"time": "16:00—18:30", "text": "新宿街区、购物、晚餐；都厅可删。"}, {"time": "19:30—20:30", "text": "回酒店附近，芝公园、东京塔外观。"}], "html": "\u003cp\u003e\u003cstrong\u003e住：滨松町名铁酒店（Meitetsu Inn Hamamatsucho／名鉄イン浜松町）\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：伊豆热川 → 品川 → JR 滨松町站北口 → 滨松町名铁酒店寄存 → 新宿 → 东京塔外观。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从品川转 JR 山手线或京滨东北线到滨松町，出\u003cstrong\u003e北口后步行约 4 分钟\u003c/strong\u003e到酒店；若从地铁大门站到达，选 \u003cstrong\u003eA2 出口\u003c/strong\u003e，需要电梯时选 \u003cstrong\u003eA1 出口\u003c/strong\u003e。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店交通\u003c/a\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e候选车次：踊り子 2 号，伊豆热川 10:32 → 品川 12:40。\u003c/strong\u003e\u003cbr/\u003e\n须核对 10/2 运行、票面日期和座位，不是已经代订。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098921.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方车次\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\n\u003cp\u003e\u003cstrong\u003e御苑十月 16:00 停止入园、16:30 闭园。\u003c/strong\u003e 当天迟到就删御苑，改逛新宿，不能把入园顺延至傍晚。\u003ca href=\"https://policies.env.go.jp/national-garden/shinjukugyoen/english/guide/information/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方指南\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e滨松町名铁酒店到东京塔官方参考步行约 \u003cstrong\u003e15 分钟\u003c/strong\u003e，所以原有东京塔外观散步安排保留，不再单独安排登塔半日。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店周边信息\u003c/a\u003e\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e住：滨松町名铁酒店（Meitetsu Inn Hamamatsucho／名鉄イン浜松町）\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：伊豆热川 → 品川 → JR 滨松町站北口 → 滨松町名铁酒店寄存 → 新宿 → 东京塔外观。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从品川转 JR 山手线或京滨东北线到滨松町，出\u003cstrong\u003e北口后步行约 4 分钟\u003c/strong\u003e到酒店；若从地铁大门站到达，选 \u003cstrong\u003eA2 出口\u003c/strong\u003e，需要电梯时选 \u003cstrong\u003eA1 出口\u003c/strong\u003e。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店交通\u003c/a\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e候选车次：踊り子 2 号，伊豆热川 10:32 → 品川 12:40。\u003c/strong\u003e\u003cbr/\u003e\n须核对 10/2 运行、票面日期和座位，不是已经代订。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098921.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方车次\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00—09:30\u003c/td\u003e\n\u003ctd\u003e早餐、整理、退房。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:30—10:15\u003c/td\u003e\n\u003ctd\u003e去车站；当前 09:55 酒店接驳可用作查询目标，不等 10:35 那班。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:32—12:40\u003c/td\u003e\n\u003ctd\u003e候选特急去品川。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—14:00\u003c/td\u003e\n\u003ctd\u003e前往滨松町名铁酒店寄存、简单午餐；未到通常 15:00 入住时间，不等待进房。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—14:45\u003c/td\u003e\n\u003ctd\u003e去新宿，步行到御苑入口。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:45—15:50\u003c/td\u003e\n\u003ctd\u003e新宿御苑散步，不追求全园。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—18:30\u003c/td\u003e\n\u003ctd\u003e新宿街区、购物、晚餐；都厅可删。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:30—20:30\u003c/td\u003e\n\u003ctd\u003e回酒店附近，芝公园、东京塔外观。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e御苑十月 16:00 停止入园、16:30 闭园。\u003c/strong\u003e 当天迟到就删御苑，改逛新宿，不能把入园顺延至傍晚。\u003ca href=\"https://policies.env.go.jp/national-garden/shinjukugyoen/english/guide/information/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方指南\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e滨松町名铁酒店到东京塔官方参考步行约 \u003cstrong\u003e15 分钟\u003c/strong\u003e，所以原有东京塔外观散步安排保留，不再单独安排登塔半日。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店周边信息\u003c/a\u003e\u003c/p\u003e\n", "title": "默认：早离开伊豆，保住新宿下午"}, {"timeline": [{"time": "08:30—09:00", "text": "退房、确认寄存；先解决行李，再决定是否去稻取。"}, {"time": "09:00—10:00", "text": "电车去伊豆稻取，步行到文化公园。"}, {"time": "10:00—11:00", "text": "**文化公园「雛の館」**秋季展示。"}, {"time": "11:00—12:00", "text": "温泉街／海边、简单海鲜午餐，不加远处展望台。"}, {"time": "12:00—13:00", "text": "回热川取行李，再到车站。"}, {"time": "13:00—14:00 左右", "text": "按提前查好的车次离开伊豆，优先少换乘的接续。"}, {"time": "16:00—17:30 左右", "text": "东京酒店抵达规划范围，以所选车次实际倒推。"}, {"time": "傍晚", "text": "芝公园、东京塔外观；体力好再考虑新宿夜间活动。"}], "html": "\u003cp\u003e\u003cstrong\u003e选择这一版，就不乘 10:32 的早班特急，也不安排当天下午新宿御苑。\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003e这里是\u003cstrong\u003e室内秋季吊雏展示\u003c/strong\u003e，不是春季素盏鸣神社的阶梯人偶活动。雛之馆通常 \u003cstrong\u003e09:00—16:00、15:40 最晚入馆，成人 500 日元，周四休馆\u003c/strong\u003e；10/2 为周五，仍要看秋季开放日历。\u003ca href=\"https://inatorionsen.or.jp/facility/hinanoyakata/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e雛之馆\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e退房后寄存是否允许、费用和取件时间，须先问热川酒店；资料不足以保证热川站有合适大件柜。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e取舍结论：默认版保留新宿御苑，稻取版保留伊豆人偶与小镇。\u003c/strong\u003e 两套都保留供选择，但不写成可以同时完成。\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e选择这一版，就不乘 10:32 的早班特急，也不安排当天下午新宿御苑。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:30—09:00\u003c/td\u003e\n\u003ctd\u003e退房、确认寄存；先解决行李，再决定是否去稻取。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:00—10:00\u003c/td\u003e\n\u003ctd\u003e电车去伊豆稻取，步行到文化公园。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:00—11:00\u003c/td\u003e\n\u003ctd\u003e**文化公园「雛の館」**秋季展示。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00—12:00\u003c/td\u003e\n\u003ctd\u003e温泉街／海边、简单海鲜午餐，不加远处展望台。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:00—13:00\u003c/td\u003e\n\u003ctd\u003e回热川取行李，再到车站。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—14:00 左右\u003c/td\u003e\n\u003ctd\u003e按提前查好的车次离开伊豆，优先少换乘的接续。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—17:30 左右\u003c/td\u003e\n\u003ctd\u003e东京酒店抵达规划范围，以所选车次实际倒推。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e傍晚\u003c/td\u003e\n\u003ctd\u003e芝公园、东京塔外观；体力好再考虑新宿夜间活动。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e这里是\u003cstrong\u003e室内秋季吊雏展示\u003c/strong\u003e，不是春季素盏鸣神社的阶梯人偶活动。雛之馆通常 \u003cstrong\u003e09:00—16:00、15:40 最晚入馆，成人 500 日元，周四休馆\u003c/strong\u003e；10/2 为周五，仍要看秋季开放日历。\u003ca href=\"https://inatorionsen.or.jp/facility/hinanoyakata/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e雛之馆\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e退房后寄存是否允许、费用和取件时间，须先问热川酒店；资料不足以保证热川站有合适大件柜。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e取舍结论：默认版保留新宿御苑，稻取版保留伊豆人偶与小镇。\u003c/strong\u003e 两套都保留供选择，但不写成可以同时完成。\u003c/p\u003e\n", "title": "替换：保留稻取雛之馆，东京只留傍晚"}], "timeline": [{"time": "08:00—09:30", "text": "早餐、整理、退房。"}, {"time": "09:30—10:15", "text": "去车站；当前 09:55 酒店接驳可用作查询目标，不等 10:35 那班。"}, {"time": "10:32—12:40", "text": "候选特急去品川。"}, {"time": "13:00—14:00", "text": "前往滨松町名铁酒店寄存、简单午餐；未到通常 15:00 入住时间，不等待进房。"}, {"time": "14:00—14:45", "text": "去新宿，步行到御苑入口。"}, {"time": "14:45—15:50", "text": "新宿御苑散步，不追求全园。"}, {"time": "16:00—18:30", "text": "新宿街区、购物、晚餐；都厅可删。"}, {"time": "19:30—20:30", "text": "回酒店附近，芝公园、东京塔外观。"}], "html": "\u003cp\u003e\u003cstrong\u003e住：滨松町名铁酒店（Meitetsu Inn Hamamatsucho／名鉄イン浜松町）\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：伊豆热川 → 品川 → JR 滨松町站北口 → 滨松町名铁酒店寄存 → 新宿 → 东京塔外观。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从品川转 JR 山手线或京滨东北线到滨松町，出\u003cstrong\u003e北口后步行约 4 分钟\u003c/strong\u003e到酒店；若从地铁大门站到达，选 \u003cstrong\u003eA2 出口\u003c/strong\u003e，需要电梯时选 \u003cstrong\u003eA1 出口\u003c/strong\u003e。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店交通\u003c/a\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e候选车次：踊り子 2 号，伊豆热川 10:32 → 品川 12:40。\u003c/strong\u003e\u003cbr/\u003e\n须核对 10/2 运行、票面日期和座位，不是已经代订。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098921.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方车次\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\n\u003cp\u003e\u003cstrong\u003e御苑十月 16:00 停止入园、16:30 闭园。\u003c/strong\u003e 当天迟到就删御苑，改逛新宿，不能把入园顺延至傍晚。\u003ca href=\"https://policies.env.go.jp/national-garden/shinjukugyoen/english/guide/information/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方指南\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e滨松町名铁酒店到东京塔官方参考步行约 \u003cstrong\u003e15 分钟\u003c/strong\u003e，所以原有东京塔外观散步安排保留，不再单独安排登塔半日。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店周边信息\u003c/a\u003e\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e住：滨松町名铁酒店（Meitetsu Inn Hamamatsucho／名鉄イン浜松町）\u003c/strong\u003e\u003cbr/\u003e\n\u003cstrong\u003e主线：伊豆热川 → 品川 → JR 滨松町站北口 → 滨松町名铁酒店寄存 → 新宿 → 东京塔外观。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e从品川转 JR 山手线或京滨东北线到滨松町，出\u003cstrong\u003e北口后步行约 4 分钟\u003c/strong\u003e到酒店；若从地铁大门站到达，选 \u003cstrong\u003eA2 出口\u003c/strong\u003e，需要电梯时选 \u003cstrong\u003eA1 出口\u003c/strong\u003e。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店交通\u003c/a\u003e\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003e候选车次：踊り子 2 号，伊豆热川 10:32 → 品川 12:40。\u003c/strong\u003e\u003cbr/\u003e\n须核对 10/2 运行、票面日期和座位，不是已经代订。\u003ca href=\"https://timetables.jreast.co.jp/2609/train/095/098921.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003eJR 官方车次\u003c/a\u003e\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e08:00—09:30\u003c/td\u003e\n\u003ctd\u003e早餐、整理、退房。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:30—10:15\u003c/td\u003e\n\u003ctd\u003e去车站；当前 09:55 酒店接驳可用作查询目标，不等 10:35 那班。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:32—12:40\u003c/td\u003e\n\u003ctd\u003e候选特急去品川。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—14:00\u003c/td\u003e\n\u003ctd\u003e前往滨松町名铁酒店寄存、简单午餐；未到通常 15:00 入住时间，不等待进房。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—14:45\u003c/td\u003e\n\u003ctd\u003e去新宿，步行到御苑入口。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:45—15:50\u003c/td\u003e\n\u003ctd\u003e新宿御苑散步，不追求全园。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e16:00—18:30\u003c/td\u003e\n\u003ctd\u003e新宿街区、购物、晚餐；都厅可删。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:30—20:30\u003c/td\u003e\n\u003ctd\u003e回酒店附近，芝公园、东京塔外观。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e御苑十月 16:00 停止入园、16:30 闭园。\u003c/strong\u003e 当天迟到就删御苑，改逛新宿，不能把入园顺延至傍晚。\u003ca href=\"https://policies.env.go.jp/national-garden/shinjukugyoen/english/guide/information/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方指南\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e滨松町名铁酒店到东京塔官方参考步行约 \u003cstrong\u003e15 分钟\u003c/strong\u003e，所以原有东京塔外观散步安排保留，不再单独安排登塔半日。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店周边信息\u003c/a\u003e\u003c/p\u003e\n"}, {"key": "9A", "num": 9, "date": "10/3", "iso": "2026-10-03", "week": "周六", "region": "东京", "hotel": "tokyo", "title": "涩谷半日，夜里去看花火", "desc": "涩谷 · 二子玉川 · 多摩川花火", "route": "涩谷 → 二子玉川 → 选定观览区 → 分流返程 → 大门 → 酒店", "focus": "13:00 左右从涩谷出发；整晚留给烟花与散场。", "terms": [["花火会场", "二子玉川緑地運動場"], ["分流车站", "用賀駅"], ["酒店出口", "大門駅 A2出口"]], "sectionId": "source-13", "originalTitle": "Day 9A｜10/3 周六：涩谷半日 → 多摩川花火", "timeline": [{"time": "09:30—12:00", "text": "涩谷十字路口、八公、街区和商场，轻装活动。"}, {"time": "12:00—13:00", "text": "午餐，补水和简单食物，提前上厕所。"}, {"time": "13:00 左右", "text": "从涩谷乘田园都市线前往二子玉川。"}, {"time": "14:00—15:00", "text": "按选定会场入口步行和排队，不临时换岸找位置。"}, {"time": "15:00—17:30", "text": "付费席按规定入场，或在指定一般区等待、休息。"}, {"time": "\u003cstrong\u003e18:00—19:00\u003c/strong\u003e", "text": "花火大会。"}, {"time": "19:00—19:30 后", "text": "按现场指引分散离场，视拥堵决定何时步行出发。"}, {"time": "21:00—22:00 左右", "text": "作为回酒店的规划范围；严重拥堵时可能更晚。"}], "html": "\u003cp\u003e官方已公布 \u003cstrong\u003e2026/10/3，18:00—19:00\u003c/strong\u003e 举办世田谷区多摩川花火大会，主会场为二子玉川绿地运动场，恶劣天气取消。\u003ca href=\"https://tamagawa-hanabi.com/about/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e大会信息\u003c/a\u003e\u003c/p\u003e\n\n\u003cp\u003e\u003cstrong\u003e这天预留的是整个下午和晚上，不只是放烟花的一小时。\u003c/strong\u003e SHIBUYA SKY 不是必去；很想上就选上午，替换部分涩谷购物，不叠加下午或日落票。\u003c/p\u003e\n\u003ch3\u003e1. 观览位置：提前选定，不现场巡回找“穴场”\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e选择\u003c/th\u003e\n\u003cth\u003e使用原则\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e付费观览席\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e先确认具体会场、入口、座位和取票方式。单人椅席当前标价 \u003cstrong\u003e6,500／人\u003c/strong\u003e，双人椅席 \u003cstrong\u003e14,000／对\u003c/strong\u003e，手续费另看订单；未核实时余票。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e一般观览区\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e只采用当年官方图标出的可入场区域，遵守站立区、通道与铺垫规则，不承诺随到随有好位置。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e原稿的几个公园\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e不把二子玉川公园、兵库岛、上野毛自然公园、等々力绿地一概当作“免费、空、人少、散场快”的保证。部分区域有收费观览安排或管制。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e票价和观览区以\u003ca href=\"https://www.city.setagaya.lg.jp/02219/26491.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e世田谷官方售票说明\u003c/a\u003e、\u003ca href=\"https://tamagawa-hanabi.com/seat/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e大会座位说明\u003c/a\u003e为准。购买两张单人票不等于已经保证连座，需看实际选座和票面。\u003c/p\u003e\n\u003ch3\u003e2. 入场与物品\u003c/h3\u003e\n\u003cp\u003e付费席当前说明 \u003cstrong\u003e15:00 起入场\u003c/strong\u003e，需按流程在 \u003cstrong\u003e7-Eleven 领取实体票\u003c/strong\u003e；不要只带订单截图。购买后变更、主动取消及大会取消后的退款，都按官方票规，不能默认免费退。\u003ca href=\"https://tamagawa-hanabi.com/seat/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e票券规则\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e一般区铺野餐垫须遵守\u003cstrong\u003e当日 14:00 以后\u003c/strong\u003e等规则，不早上铺满位置后离场逛街。准备饮水、便携食物、充电宝、轻便外套、垃圾袋；使用垫子和摄影器材不挡通道或他人视线。\u003ca href=\"https://tamagawa-hanabi.com/manner/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e现场规则\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e提前保存票面、会场图和返程路线；到场后不把手机网络始终通畅当成前提。\u003c/p\u003e\n\u003ch3\u003e3. 去程不要卡在开场前\u003c/h3\u003e\n\u003cp\u003e官方提示，临近开场时车站到会场可能耗时\u003cstrong\u003e超过 90 分钟\u003c/strong\u003e。因此本版 13:00 左右就从涩谷出发，不能把“16:30 到二子玉川站”当作稳妥方案。\u003ca href=\"https://tamagawa-hanabi.com/venue/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e会场交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e入场按当年开放入口和现场指引走；地图 App 的最短路径不一定能穿过管制区。不要临时横穿河流两岸，以免遇到桥面通行限制。\u003ca href=\"https://tamagawa-hanabi.com/wp-content/uploads/2026/06/%E4%BA%A4%E9%80%9A%E8%A6%8F%E5%88%B6%E3%81%A8%E5%BE%92%E6%AD%A9%E3%83%AB%E3%83%BC%E3%83%88%E6%A1%88%E5%86%85%E5%9B%B3.pdf\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方交通图\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e4. 散场：把用贺站当作分流备选\u003c/h3\u003e\n\u003cp\u003e官方专门给出前往 \u003cstrong\u003e用賀駅／用贺站\u003c/strong\u003e的步行分流路线，参考约 \u003cstrong\u003e30 分钟\u003c/strong\u003e；拥堵、出场位置、体力会额外增加时间，不是保证半小时进站。\u003ca href=\"https://tamagawa-hanabi.com/wp-content/uploads/2026/06/%E4%BA%A4%E9%80%9A%E8%A6%8F%E5%88%B6%E3%81%A8%E5%BE%92%E6%AD%A9%E3%83%AB%E3%83%BC%E3%83%88%E6%A1%88%E5%86%85%E5%9B%B3.pdf\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e分流路线图\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e可采用：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e会场 → 按指引经吉沢口／華火橋口等适用出口 → 用贺站 → 田园都市线／直通半藏门线 → 青山一丁目 → 大江户线 → 大门站 A2 出口 → 步行约 2 分钟 → 滨松町名铁酒店。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e车站至酒店的末段按新酒店位置更新；需要电梯时可用 A1 出口，步行约 3 分钟。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e二子玉川站也可作为返程选项，但不要认为它距离近就一定最快。不要把出租车设为可靠的散场捷径，也不预订烟花结束后的固定时间餐厅、展望台或其他活动。\u003ca href=\"https://tamagawa-hanabi.com/traffic/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e交通管制\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e5. 当天取消怎么办\u003c/h3\u003e\n\u003cp\u003e官方会在当天早上 \u003cstrong\u003e07:00 前作出一次举办判断\u003c/strong\u003e，之后也可能因天气变化取消，仍要持续查看公告。\u003ca href=\"https://tamagawa-hanabi.com/seat/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方票券与取消说明\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e提前决定不看且天气适合户外\u003c/strong\u003e：改用后面的 B 版，重排皇居和涩谷。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e临时因恶劣天气取消\u003c/strong\u003e：改为涩谷室内商场、餐饮和休息；不是自动去屋顶展望台。\u003c/li\u003e\n\u003cli\u003e已买 SHIBUYA SKY 或烟花票时，按各自票规处理，不假设当日能随意改票或临时买到日落场。\u003c/li\u003e\n\u003c/ul\u003e\n", "fullHtml": "\u003cp\u003e官方已公布 \u003cstrong\u003e2026/10/3，18:00—19:00\u003c/strong\u003e 举办世田谷区多摩川花火大会，主会场为二子玉川绿地运动场，恶劣天气取消。\u003ca href=\"https://tamagawa-hanabi.com/about/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e大会信息\u003c/a\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:30—12:00\u003c/td\u003e\n\u003ctd\u003e涩谷十字路口、八公、街区和商场，轻装活动。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e12:00—13:00\u003c/td\u003e\n\u003ctd\u003e午餐，补水和简单食物，提前上厕所。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00 左右\u003c/td\u003e\n\u003ctd\u003e从涩谷乘田园都市线前往二子玉川。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:00—15:00\u003c/td\u003e\n\u003ctd\u003e按选定会场入口步行和排队，不临时换岸找位置。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e15:00—17:30\u003c/td\u003e\n\u003ctd\u003e付费席按规定入场，或在指定一般区等待、休息。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e18:00—19:00\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e花火大会。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:00—19:30 后\u003c/td\u003e\n\u003ctd\u003e按现场指引分散离场，视拥堵决定何时步行出发。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e21:00—22:00 左右\u003c/td\u003e\n\u003ctd\u003e作为回酒店的规划范围；严重拥堵时可能更晚。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003e这天预留的是整个下午和晚上，不只是放烟花的一小时。\u003c/strong\u003e SHIBUYA SKY 不是必去；很想上就选上午，替换部分涩谷购物，不叠加下午或日落票。\u003c/p\u003e\n\u003ch3\u003e1. 观览位置：提前选定，不现场巡回找“穴场”\u003c/h3\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e选择\u003c/th\u003e\n\u003cth\u003e使用原则\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e付费观览席\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e先确认具体会场、入口、座位和取票方式。单人椅席当前标价 \u003cstrong\u003e6,500／人\u003c/strong\u003e，双人椅席 \u003cstrong\u003e14,000／对\u003c/strong\u003e，手续费另看订单；未核实时余票。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e一般观览区\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e只采用当年官方图标出的可入场区域，遵守站立区、通道与铺垫规则，不承诺随到随有好位置。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003e原稿的几个公园\u003c/strong\u003e\u003c/td\u003e\n\u003ctd\u003e不把二子玉川公园、兵库岛、上野毛自然公园、等々力绿地一概当作“免费、空、人少、散场快”的保证。部分区域有收费观览安排或管制。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e票价和观览区以\u003ca href=\"https://www.city.setagaya.lg.jp/02219/26491.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e世田谷官方售票说明\u003c/a\u003e、\u003ca href=\"https://tamagawa-hanabi.com/seat/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e大会座位说明\u003c/a\u003e为准。购买两张单人票不等于已经保证连座，需看实际选座和票面。\u003c/p\u003e\n\u003ch3\u003e2. 入场与物品\u003c/h3\u003e\n\u003cp\u003e付费席当前说明 \u003cstrong\u003e15:00 起入场\u003c/strong\u003e，需按流程在 \u003cstrong\u003e7-Eleven 领取实体票\u003c/strong\u003e；不要只带订单截图。购买后变更、主动取消及大会取消后的退款，都按官方票规，不能默认免费退。\u003ca href=\"https://tamagawa-hanabi.com/seat/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e票券规则\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e一般区铺野餐垫须遵守\u003cstrong\u003e当日 14:00 以后\u003c/strong\u003e等规则，不早上铺满位置后离场逛街。准备饮水、便携食物、充电宝、轻便外套、垃圾袋；使用垫子和摄影器材不挡通道或他人视线。\u003ca href=\"https://tamagawa-hanabi.com/manner/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e现场规则\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e提前保存票面、会场图和返程路线；到场后不把手机网络始终通畅当成前提。\u003c/p\u003e\n\u003ch3\u003e3. 去程不要卡在开场前\u003c/h3\u003e\n\u003cp\u003e官方提示，临近开场时车站到会场可能耗时\u003cstrong\u003e超过 90 分钟\u003c/strong\u003e。因此本版 13:00 左右就从涩谷出发，不能把“16:30 到二子玉川站”当作稳妥方案。\u003ca href=\"https://tamagawa-hanabi.com/venue/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e会场交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e入场按当年开放入口和现场指引走；地图 App 的最短路径不一定能穿过管制区。不要临时横穿河流两岸，以免遇到桥面通行限制。\u003ca href=\"https://tamagawa-hanabi.com/wp-content/uploads/2026/06/%E4%BA%A4%E9%80%9A%E8%A6%8F%E5%88%B6%E3%81%A8%E5%BE%92%E6%AD%A9%E3%83%AB%E3%83%BC%E3%83%88%E6%A1%88%E5%86%85%E5%9B%B3.pdf\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方交通图\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e4. 散场：把用贺站当作分流备选\u003c/h3\u003e\n\u003cp\u003e官方专门给出前往 \u003cstrong\u003e用賀駅／用贺站\u003c/strong\u003e的步行分流路线，参考约 \u003cstrong\u003e30 分钟\u003c/strong\u003e；拥堵、出场位置、体力会额外增加时间，不是保证半小时进站。\u003ca href=\"https://tamagawa-hanabi.com/wp-content/uploads/2026/06/%E4%BA%A4%E9%80%9A%E8%A6%8F%E5%88%B6%E3%81%A8%E5%BE%92%E6%AD%A9%E3%83%AB%E3%83%BC%E3%83%88%E6%A1%88%E5%86%85%E5%9B%B3.pdf\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e分流路线图\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e可采用：\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e会场 → 按指引经吉沢口／華火橋口等适用出口 → 用贺站 → 田园都市线／直通半藏门线 → 青山一丁目 → 大江户线 → 大门站 A2 出口 → 步行约 2 分钟 → 滨松町名铁酒店。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e车站至酒店的末段按新酒店位置更新；需要电梯时可用 A1 出口，步行约 3 分钟。\u003ca href=\"https://www.m-inn.com/hamamatsucho/access_guide/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e酒店交通\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e二子玉川站也可作为返程选项，但不要认为它距离近就一定最快。不要把出租车设为可靠的散场捷径，也不预订烟花结束后的固定时间餐厅、展望台或其他活动。\u003ca href=\"https://tamagawa-hanabi.com/traffic/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e交通管制\u003c/a\u003e\u003c/p\u003e\n\u003ch3\u003e5. 当天取消怎么办\u003c/h3\u003e\n\u003cp\u003e官方会在当天早上 \u003cstrong\u003e07:00 前作出一次举办判断\u003c/strong\u003e，之后也可能因天气变化取消，仍要持续查看公告。\u003ca href=\"https://tamagawa-hanabi.com/seat/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e官方票券与取消说明\u003c/a\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003e提前决定不看且天气适合户外\u003c/strong\u003e：改用后面的 B 版，重排皇居和涩谷。\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e临时因恶劣天气取消\u003c/strong\u003e：改为涩谷室内商场、餐饮和休息；不是自动去屋顶展望台。\u003c/li\u003e\n\u003cli\u003e已买 SHIBUYA SKY 或烟花票时，按各自票规处理，不假设当日能随意改票或临时买到日落场。\u003c/li\u003e\n\u003c/ul\u003e\n"}, {"key": "10A", "num": 10, "date": "10/4", "iso": "2026-10-04", "week": "周日", "region": "东京", "hotel": "tokyo", "title": "皇居、浅草，与银座最后一逛", "desc": "皇居东御苑 · 浅草 · 银座", "route": "皇居东御苑 → 浅草 → 隅田川 → 银座 → 酒店", "focus": "烟花散场太晚就先删皇居；晚上完成行李整理。", "terms": [["皇居", "皇居東御苑"], ["浅草", "浅草寺"], ["银座", "銀座"]], "sectionId": "source-14", "originalTitle": "Day 10A｜10/4 周日：皇居 → 浅草 → 银座", "timeline": [{"time": "09:00—10:15", "text": "皇居东御苑，选主要步道，不走遍全园。"}, {"time": "10:15—11:00", "text": "前往浅草。"}, {"time": "11:00—13:00", "text": "浅草寺、仲见世、午餐。"}, {"time": "13:00—13:30", "text": "隅田川边短走，远眺晴空塔。"}, {"time": "14:30—18:00", "text": "银座购物、晚餐。"}, {"time": "19:00—20:00", "text": "回酒店、整理行李、确认次日机场路线。"}], "html": "\u003cp\u003e\u003cstrong\u003e住：滨松町名铁酒店；今晚完成行李整理。\u003c/strong\u003e\u003c/p\u003e\n\n\u003cp\u003e宫内厅当前日历显示 \u003cstrong\u003e10/3、10/4 东御苑开放，10/2、10/5 休园\u003c/strong\u003e，临时安排仍需查看公告。\u003ca href=\"https://www.kunaicho.go.jp/visit/higashigyoen/gyoen-close.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003e开放日历\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e疲惫时的删减顺序：先删皇居，再减少浅草支线；保留回酒店收行李的时间。\u003c/strong\u003e 晴空塔这版只远眺，不登塔；东京塔外观已放到 10/2，不再重复跑。\u003c/p\u003e\n", "fullHtml": "\u003cp\u003e\u003cstrong\u003e住：滨松町名铁酒店；今晚完成行李整理。\u003c/strong\u003e\u003c/p\u003e\n\u003cdiv aria-label=\"Table\" class=\"table-scroll\" role=\"region\" tabindex=\"0\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003e建议时间\u003c/th\u003e\n\u003cth\u003e安排\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e09:00—10:15\u003c/td\u003e\n\u003ctd\u003e皇居东御苑，选主要步道，不走遍全园。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e10:15—11:00\u003c/td\u003e\n\u003ctd\u003e前往浅草。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e11:00—13:00\u003c/td\u003e\n\u003ctd\u003e浅草寺、仲见世、午餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e13:00—13:30\u003c/td\u003e\n\u003ctd\u003e隅田川边短走，远眺晴空塔。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e14:30—18:00\u003c/td\u003e\n\u003ctd\u003e银座购物、晚餐。\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e19:00—20:00\u003c/td\u003e\n\u003ctd\u003e回酒店、整理行李、确认次日机场路线。\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e宫内厅当前日历显示 \u003cstrong\u003e10/3、10/4 东御苑开放，10/2、10/5 休园\u003c/strong\u003e，临时安排仍需查看公告。\u003ca hr
